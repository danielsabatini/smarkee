[project]
name = "smarkee-schemas"
version = "0.1.0"
description = "Verificação dos contratos em JSON Schema (schemas/): sintaxe, referências, exemplos, limites e classificação (docs/SCHEMA.md)."
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 100
# Fontes canônicas copiadas para os componentes (decisão 0046): têm o marcador PKG e são
# verificadas com as regras de cada componente, onde são geradas.
extend-exclude = ["observability/python"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
