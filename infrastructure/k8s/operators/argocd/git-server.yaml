apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: gitops-operator
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: git
      port: 9418
      targetPort: 9418
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: gitops-operator
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
        app.kubernetes.io/part-of: argocd
    spec:
      containers:
        - name: git-server
          image: quay.io/argoproj/argocd:v3.5.6
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /tmp/repos/smarkee.git
              cd /tmp/repos/smarkee.git
              git init -b dev
              git config user.name "smarkee-dev-git"
              git config user.email "dev@smarkee.internal"
              sync_repo() {
                mkdir -p /tmp/repos/smarkee.git/infrastructure
                rm -rf /tmp/repos/smarkee.git/infrastructure/k8s
                cp -R /workspace/smarkee/infrastructure/k8s /tmp/repos/smarkee.git/infrastructure/k8s
                rm -rf /tmp/repos/smarkee.git/features
                for k8s_dir in /workspace/smarkee/features/*/*/k8s; do
                  if [ -d "$k8s_dir" ]; then
                    rel="${k8s_dir#/workspace/smarkee/}"
                    mkdir -p "/tmp/repos/smarkee.git/$(dirname "$rel")"
                    cp -R "$k8s_dir" "/tmp/repos/smarkee.git/$rel"
                  fi
                done
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "chore(k8s): sync dev working tree" >/dev/null
                fi
              }
              sync_repo
              (
                while true; do
                  sleep 5
                  sync_repo || true
                done
              ) &
              exec git daemon --reuseaddr --base-path=/tmp/repos --export-all --port=9418 /tmp/repos
          ports:
            - name: git
              containerPort: 9418
              protocol: TCP
          volumeMounts:
            - name: workspace
              mountPath: /workspace/smarkee
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          hostPath:
            path: /workspace/smarkee
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
