apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-operator

# ArgoCD v3.5.6 (estável mais recente, decisão 0102).
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
  - nodeport.yaml
  - git-server.yaml

images:
  - name: public.ecr.aws/docker/library/redis
    newName: docker.io/library/redis
    newTag: 8.2.3-alpine

patches:
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: argocd-application-controller
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: gitops-operator
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: argocd-applicationset-controller
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: gitops-operator
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: argocd-server
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: gitops-operator

