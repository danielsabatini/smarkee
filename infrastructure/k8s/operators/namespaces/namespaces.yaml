# Namespaces da plataforma Smarkee no cluster Kubernetes (decisão 0102):
#   - 1 por papel de infraestrutura: database, messaging, identity, gateway, mail, telemetry, vault
#   - 1 por módulo de produto: core, ipm, sum, bsm (e futuros svm, ekm, clm)
#   - 1 por operador do cluster (padronização <papel>-operator, AGENTS.md §15.1):
#     database-operator, telemetry-operator, external-secrets-operator,
#     cert-manager-operator, gitops-operator, messaging-operator
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    smarkee.io/layer: infra
    smarkee.io/role: database
---
apiVersion: v1
kind: Namespace
metadata:
  name: messaging
  labels:
    smarkee.io/layer: infra
    smarkee.io/role: messaging
---
