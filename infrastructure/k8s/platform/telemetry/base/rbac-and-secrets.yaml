apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-agent
  namespace: telemetry
  labels:
    app.kubernetes.io/part-of: telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telemetry-agent-reader
  labels:
    app.kubernetes.io/part-of: telemetry
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/stats
      - nodes/proxy
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telemetry-agent-reader
  labels:
    app.kubernetes.io/part-of: telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: telemetry-agent-reader
subjects:
  - kind: ServiceAccount
    name: telemetry-agent
    namespace: telemetry
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telemetry-database-secret
  namespace: telemetry
  labels:
    app.kubernetes.io/part-of: telemetry
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: telemetry-database-secret
    creationPolicy: Owner
  data:
    - secretKey: SMARKEE_DATABASE_TELEMETRY_PASSWORD
      remoteRef:
        key: database/admin
        property: telemetry_password
