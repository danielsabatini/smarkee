apiVersion: v1
kind: ConfigMap
metadata:
  name: messaging-config
  namespace: messaging
  labels:
    app.kubernetes.io/part-of: messaging
data:
  nats.conf: |
    server_name: smarkee-messaging
    pid_file: "/var/run/nats/nats.pid"

    jetstream {
      store_dir: "/data"
      max_mem: 1G
      max_file: 10G
    }

    port: 4222
    http_port: 8222

    authorization {
      user: $NATS_USER
      password: $NATS_PASSWORD
    }
---
apiVersion: v1
kind: Service
metadata:
  name: messaging
  namespace: messaging
  labels:
    app.kubernetes.io/name: messaging
    app.kubernetes.io/part-of: messaging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: messaging
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      protocol: TCP
    - name: metrics
      port: 7777
      targetPort: 7777
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-headless
  namespace: messaging
  labels:
    app.kubernetes.io/name: messaging-headless
    app.kubernetes.io/part-of: messaging
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: messaging
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: messaging
  namespace: messaging
  labels:
    app.kubernetes.io/name: messaging
    app.kubernetes.io/part-of: messaging
    smarkee.io/layer: infra
spec:
  serviceName: messaging-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messaging
        app.kubernetes.io/part-of: messaging
        smarkee.io/layer: infra
    spec:
      shareProcessNamespace: true
      containers:
        - name: messaging
          image: nats:2.15.2-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/nats/nats.conf"
          env:
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: messaging-secret
                  key: NATS_USER
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: messaging-secret
                  key: NATS_PASSWORD
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: pid
              mountPath: /var/run/nats
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: config-reloader
          image: natsio/nats-server-config-reloader:0.22.2
          imagePullPolicy: IfNotPresent
          args:
            - "-pid=/var/run/nats/nats.pid"
            - "-config=/etc/nats/nats.conf"
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: pid
              mountPath: /var/run/nats
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: exporter
          image: natsio/prometheus-nats-exporter:0.20.3
          imagePullPolicy: IfNotPresent
          args:
            - "-varz"
            - "-jsz=all"
            - "-prefix=nats"
            - "-port=7777"
            - "http://127.0.0.1:8222"
          ports:
            - name: metrics
              containerPort: 7777
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: messaging-config
        - name: pid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
