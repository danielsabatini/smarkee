apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messaging-secret
  namespace: messaging
  labels:
    app.kubernetes.io/part-of: messaging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: messaging-secret
    creationPolicy: Owner
  data:
    - secretKey: NATS_USER
      remoteRef:
        key: messaging
        property: user
    - secretKey: NATS_PASSWORD
      remoteRef:
        key: messaging
        property: password
---
# Mesma credencial no namespace do operador NACK: `secretKeyRef` resolve no namespace do próprio pod,
# então o `nack-jetstream-controller` (messaging-operator) não enxerga o Secret de `messaging`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: messaging-secret
  namespace: messaging-operator
  labels:
    app.kubernetes.io/part-of: messaging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: messaging-secret
    creationPolicy: Owner
  data:
    - secretKey: NATS_USER
      remoteRef:
        key: messaging
        property: user
    - secretKey: NATS_PASSWORD
      remoteRef:
        key: messaging
        property: password
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: messaging-server-tls
  namespace: messaging
  labels:
    app.kubernetes.io/part-of: messaging
spec:
  secretName: messaging-server-tls
  commonName: messaging.messaging.svc.cluster.local
  dnsNames:
    - messaging
    - messaging.messaging
    - messaging.messaging.svc
    - messaging.messaging.svc.cluster.local
    - "*.messaging-headless.messaging.svc.cluster.local"
    - localhost
  ipAddresses:
    - 127.0.0.1
  usages:
    - server auth
  issuerRef:
    name: smarkee-internal-ca
    kind: ClusterIssuer
