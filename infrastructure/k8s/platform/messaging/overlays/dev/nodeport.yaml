apiVersion: v1
kind: Service
metadata:
  name: messaging-nodeport
  namespace: messaging
  labels:
    app.kubernetes.io/name: messaging-nodeport
    app.kubernetes.io/part-of: messaging
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: messaging
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      nodePort: 30422
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      nodePort: 30822
      protocol: TCP
