apiVersion: v1
kind: Service
metadata:
  name: mail
  namespace: mail
  labels:
    app.kubernetes.io/name: mail
    app.kubernetes.io/part-of: mail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mail
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
      protocol: TCP
    - name: http
      port: 8025
      targetPort: 8025
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mail
  namespace: mail
  labels:
    app.kubernetes.io/name: mail
    app.kubernetes.io/part-of: mail
    smarkee.io/layer: infra
spec:
  serviceName: mail
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail
        app.kubernetes.io/part-of: mail
        smarkee.io/layer: infra
    spec:
      containers:
        - name: mail
          image: axllent/mailpit:v1.31.4
          imagePullPolicy: IfNotPresent
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
            - name: MP_MAX_MESSAGES
              value: "500"
            - name: MP_DATABASE
              value: "/data/mailpit.db"
          ports:
            - name: smtp
              containerPort: 1025
              protocol: TCP
            - name: http
              containerPort: 8025
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
