apiVersion: v1
kind: Service
metadata:
  name: mail-nodeport
  namespace: mail
  labels:
    app.kubernetes.io/name: mail-nodeport
    app.kubernetes.io/part-of: mail
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mail
  ports:
    - name: http
      port: 8025
      targetPort: 8025
      nodePort: 30025
      protocol: TCP
