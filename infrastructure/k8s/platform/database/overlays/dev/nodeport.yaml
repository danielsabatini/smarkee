apiVersion: v1
kind: Service
metadata:
  name: database-nodeport
  namespace: database
  labels:
    app.kubernetes.io/name: database-nodeport
    app.kubernetes.io/part-of: database
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: database
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
      protocol: TCP
