apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - nodeport.yaml

patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: database
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
