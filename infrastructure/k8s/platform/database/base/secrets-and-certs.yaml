# ExternalSecrets do namespace `database` sincronizando credenciais de `core/svm/database/admin`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-superuser-secret
  namespace: database
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: database-superuser-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ .postgres_password }}"
  data:
    - secretKey: postgres_password
      remoteRef:
        key: database/admin
        property: postgres_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-ssot-owner-secret
  namespace: database
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: database-ssot-owner-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ssot
        password: "{{ .ssot_password }}"
  data:
    - secretKey: ssot_password
      remoteRef:
        key: database/admin
        property: ssot_password
---
# Certificado TLS do servidor PostgreSQL emitido pela PKI interna (`core/clm/int`).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: database-server-tls
  namespace: database
spec:
  secretName: database-server-tls
  commonName: database.database.svc.cluster.local
  dnsNames:
    - database
    - database.database
    - database.database.svc
    - database.database.svc.cluster.local
    - database-rw
    - database-rw.database
    - database-rw.database.svc
    - database-rw.database.svc.cluster.local
    - database-ro
    - database-ro.database
    - database-ro.database.svc
    - database-ro.database.svc.cluster.local
    - database-r
    - database-r.database
    - database-r.database.svc
    - database-r.database.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  usages:
    - server auth
  issuerRef:
    name: smarkee-internal-ca
    kind: ClusterIssuer
