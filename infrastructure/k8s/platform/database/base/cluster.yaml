# Cluster PostgreSQL 18.6 gerenciado pelo CloudNativePG (decisão 0102 e docs/data/POSTGRESQL.md).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  namespace: database
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: database
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  enableSuperuserAccess: true
  superuserSecret:
    name: database-superuser-secret

  bootstrap:
    initdb:
      database: ssot
      owner: ssot
      secret:
        name: database-ssot-owner-secret
      encoding: UTF8
      localeProvider: builtin
      builtinLocale: C.UTF-8
      dataChecksums: true
      postInitSQLRefs:
        configMapRefs:
          - name: database-bootstrap-sql
            key: 01-roles.sql
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: database-bootstrap-sql
            key: 02-ssot-init.sql

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      max_wal_size: "1GB"
      min_wal_size: "80MB"
      log_timezone: "UTC"
      datestyle: "iso, mdy"
      timezone: "UTC"
      log_lock_waits: "on"
      deadlock_timeout: "1s"
      log_min_duration_statement: "500ms"
      log_parameter_max_length: "0"
    pg_hba:
      - host all all all scram-sha-256

  storage:
    size: 2Gi
---
# Declarative Database para o Zitadel (`identity`) reconciliado pelo CloudNativePG.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: database-identity
  namespace: database
  labels:
    app.kubernetes.io/part-of: database
spec:
  name: identity
  owner: identity
  cluster:
    name: database
---
# Service alias `database.database.svc.cluster.local:5432` apontando para a instância primária (`role: primary`),
# além do `database-rw.database.svc.cluster.local:5432` criado nativamente pelo CNPG.
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: database
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: database
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: database
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
