apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-secret
  namespace: identity
  labels:
    app.kubernetes.io/part-of: identity
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: identity-secret
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: identity/config
        property: masterkey
    - secretKey: admin_password
      remoteRef:
        key: identity/config
        property: admin_password
    - secretKey: session_cookie_secret
      remoteRef:
        key: identity/config
        property: session_cookie_secret
    - secretKey: database_password
      remoteRef:
        key: identity/config
        property: database_password
    - secretKey: login-client.pat
      remoteRef:
        key: identity/config
        property: login_client_pat
    - secretKey: platform-bootstrap.json
      remoteRef:
        key: identity/service-accounts/platform-bootstrap
        property: key_json
