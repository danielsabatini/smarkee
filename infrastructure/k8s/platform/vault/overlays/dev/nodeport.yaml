apiVersion: v1
kind: Service
metadata:
  name: vault-nodeport
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-nodeport
    app.kubernetes.io/part-of: vault
spec:
  type: NodePort
  selector:
    app.kubernetes.io/part-of: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30200
      protocol: TCP
