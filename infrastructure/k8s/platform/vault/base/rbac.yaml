apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: vault
---
# Permite que o OpenBao valide ServiceAccount tokens do Kubernetes via TokenReview API (auth/kubernetes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
  labels:
    app.kubernetes.io/part-of: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets-operator
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager-operator
---
# Permite que o cert-manager emita um token curto para sua propria ServiceAccount ao autenticar no OpenBao (serviceAccountRef).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-tokenrequest
  namespace: cert-manager-operator
  labels:
    app.kubernetes.io/part-of: vault
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["cert-manager"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-vault-tokenrequest
  namespace: cert-manager-operator
  labels:
    app.kubernetes.io/part-of: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-vault-tokenrequest
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager-operator

