# ClusterIssuer do cert-manager (emite certificados TLS via core/clm/int em clm.vault.svc.cluster.local)
# e ClusterSecretStore do External Secrets Operator (lê segredos de core/svm em svm.vault.svc.cluster.local).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: smarkee-internal-ca
  labels:
    app.kubernetes.io/part-of: vault
spec:
  vault:
    server: http://clm.vault.svc.cluster.local:8200
    namespace: core
    path: clm/int/sign/smarkee-internal
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-issuer
        serviceAccountRef:
          name: cert-manager
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: smarkee-core-svm
  labels:
    app.kubernetes.io/part-of: vault
spec:
  provider:
    vault:
      server: http://svm.vault.svc.cluster.local:8200
      namespace: core
      path: svm
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-reader
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-operator
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: smarkee-internal-ca-bundle
  labels:
    app.kubernetes.io/part-of: vault
spec:
  sources:
    - secret:
        name: "smarkee-root-ca"
        key: "ca.crt"
  target:
    configMap:
      key: "ca.crt"

