apiVersion: v1
kind: Service
metadata:
  name: gateway-external
  namespace: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: proxy-http
      port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
    - name: admin
      port: 9180
      targetPort: 9180
      nodePort: 30180
      protocol: TCP
