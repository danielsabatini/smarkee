# Configuração do Apache APISIX (modo tradicional, com etcd) em Kubernetes.
# Segredos vêm do ambiente (sintaxe ${{VAR}}).
apisix:
  # Proxy HTTP dentro do cluster. A 8000 é a das APIs/Receivers (buscam o JWKS do Zitadel em
  # gateway.gateway.svc.cluster.local:8000). A 8080 existe para o próprio gateway e o vault buscarem
  # o discovery e o JWKS do Zitadel pelo endereço público (o issuer tem a porta 8080).
  node_listen:
    - 8000
    - 8080
  enable_server_tokens: false

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key_required: true
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    enable_admin_ui: true
    enable_admin_cors: false
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180
  etcd:
    host:
      - "http://gateway-etcd.gateway.svc.cluster.local:2379"
    prefix: /apisix
    timeout: 30

nginx_config:
  worker_processes: 2
  error_log_level: warn

