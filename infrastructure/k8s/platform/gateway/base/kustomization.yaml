apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: gateway-config
    namespace: gateway
    files:
      - config.yaml
  - name: gateway-bootstrap
    namespace: gateway
    files:
      - adc.yaml

resources:
  - gateway.yaml
