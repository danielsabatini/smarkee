apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-vault
  namespace: gitops-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git://git-server.gitops-operator.svc.cluster.local:9418/smarkee.git
    targetRevision: dev
    path: infrastructure/k8s/platform/vault/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
