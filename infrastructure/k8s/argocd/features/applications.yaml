apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feature-core-account
  namespace: gitops-operator
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: git://git-server.gitops-operator.svc.cluster.local:9418/smarkee.git
    targetRevision: dev
    path: features/core/account/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
