# Configuração do OpenTelemetry Collector do gateway. O processador `transform/gateway-semconv` vem do
# arquivo gateway-semconv.yaml (mesclado na linha de comando).
extensions:
  # Sonda de saúde (HTTP em 13133, rede `internal`).
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protege a memória do contêiner quando a telemetria chega mais rápido do que sai.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Lotes curtos e com tamanho máximo: o exporter file, com rotação, REJEITA um lote maior que max_megabytes
  # (1 MB). 200 itens (spans, registros de log ou pontos de métrica) ficam bem abaixo disso.
  batch:
    timeout: 1s
    send_batch_size: 100
    send_batch_max_size: 200

exporters:
  # Ainda não há backend: cada sinal vai para arquivos em disco (uma linha OTLP JSON por lote), nas pastas
  # logs/, metrics/ e traces/ deste diretório (montadas em /telemetry). Com `rotation`, o arquivo é fechado ao
  # chegar a 1 MB e renomeado com a data e o motivo (por exemplo, traces-2026-10-17T15-02-14.173-size.jsonl);
  # ficam no máximo 3 rotacionados, por no máximo 1 dia. Cada sinal ocupa, no máximo, 4 MB.
  file/logs:
    path: /telemetry/logs/logs.jsonl
    rotation:
      max_megabytes: 1
      max_days: 1
      max_backups: 3
  file/metrics:
    path: /telemetry/metrics/metrics.jsonl
    rotation:
      max_megabytes: 1
      max_days: 1
      max_backups: 3
  file/traces:
    path: /telemetry/traces/traces.jsonl
    rotation:
      max_megabytes: 1
      max_days: 1
      max_backups: 3

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/metrics]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/logs]

    # O processador do gateway entra depois do memory_limiter e antes de qualquer exporter, para que o que
    # for gravado já esteja na semconv.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/gateway-semconv, batch]
      exporters: [file/traces]
