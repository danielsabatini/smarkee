[project]
name = "identity-conformance"
version = "0.1.0"
description = "Conformidade da estrutura do Zitadel de dev (somente leitura): organizações, projeto de roles, aplicação cli, Project Grant, contas de serviço e papéis."
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "cryptography>=46.0.0",
    "httpx>=0.28.1",
    "pyjwt>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
