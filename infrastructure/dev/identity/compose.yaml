name: identity

# Depende do PostgreSQL: o `database` é incluído para que zitadel-init possa aguardá-lo
# (depends_on) tanto na subida pela raiz quanto no modo isolado. O Compose trata
# inclusões repetidas do mesmo arquivo como um único serviço.
include:
  - path: ../database/compose.yaml
    env_file: ../database/.env

# Conexão com o banco `zitadel`, criado com o usuário `zitadel` por database/bootstrap/zitadel.sql.
# O Zitadel não recebe credencial de administrador do PostgreSQL.
x-zitadel-database-environment: &zitadel-database-environment
  ZITADEL_DATABASE_POSTGRES_HOST: ${ZITADEL_DATABASE_HOST:-database}
  ZITADEL_DATABASE_POSTGRES_PORT: ${ZITADEL_DATABASE_PORT:-5432}
  ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DATABASE_NAME:-zitadel}
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DATABASE_USER:-zitadel}
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DATABASE_PASSWORD:?Defina ZITADEL_DATABASE_PASSWORD no .env}
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable

services:
  # Contêiner de inicialização (equivalente ao initContainer): cria os schemas internos do
  # Zitadel (eventstore, projections, system) com o próprio usuário `zitadel`. Repetível.
  # Requer o `database` aceitando conexões (veja o README).
  zitadel-init:
    image: ${ZITADEL_IMAGE_VERSION:-ghcr.io/zitadel/zitadel:v4.19.4}
    container_name: zitadel-init
    command: ["init", "zitadel"]
    environment:
      <<: *zitadel-database-environment
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # API do Zitadel. O start-from-setup aplica as migrações e, na primeira vez, cria a instância
  # descrita pelas variáveis ZITADEL_FIRSTINSTANCE_* (aplicadas só na primeira inicialização).
  zitadel-api:
    image: ${ZITADEL_IMAGE_VERSION:-ghcr.io/zitadel/zitadel:v4.19.4}
    container_name: zitadel-api
    # user 0: o volume zitadel-bootstrap precisa ser gravável pela API (PAT do cliente de login).
    user: "0"
    command: ["start-from-setup", "--masterkeyFromEnv", "--tlsMode", "disabled"]
    environment:
      <<: *zitadel-database-environment
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?Defina ZITADEL_MASTERKEY (32 caracteres) no .env}
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}
      # O Zitadel é acessado pelo gateway; a porta externa deve ser a do proxy HTTP do Kong.
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNAL_PORT:-8000}
      ZITADEL_EXTERNALSECURE: "false"
      # Lido também pelo healthcheck (`zitadel ready`), que não aceita --tlsMode.
      ZITADEL_TLS_ENABLED: "false"
      # Primeira instância: administrador humano e cliente de login (usuário de serviço com PAT,
      # gravado no volume zitadel-bootstrap e lido pelo zitadel-login).
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?Defina ZITADEL_ADMIN_PASSWORD no .env}
      # Já é o padrão do Zitadel; explícito por ser configuração de segurança.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      # Login v2 (UI separada em /ui/v2/login, servida pelo zitadel-login).
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://${ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}:${ZITADEL_EXTERNAL_PORT:-8000}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://${ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}:${ZITADEL_EXTERNAL_PORT:-8000}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://${ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}:${ZITADEL_EXTERNAL_PORT:-8000}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://${ZITADEL_EXTERNAL_DOMAIN:-auth.localhost}:${ZITADEL_EXTERNAL_PORT:-8000}/ui/v2/login/login?samlRequest=
    volumes:
      # Estado de runtime: PAT do cliente de login, gerado na primeira inicialização.
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 60s

  # Interface de login (login v2). Autentica na API com o PAT gerado pelo zitadel-api.
  zitadel-login:
    image: ${ZITADEL_LOGIN_IMAGE_VERSION:-ghcr.io/zitadel/zitadel-login:v4.19.4}
    container_name: zitadel-login
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_LOGIN_SESSION_COOKIE_SECRET:?Defina ZITADEL_LOGIN_SESSION_COOKIE_SECRET no .env}
      # Preserva o domínio público nas chamadas à API (a instância é resolvida pelo Host).
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_EXTERNAL_DOMAIN:-auth.localhost},X-Forwarded-Proto:http
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

volumes:
  zitadel-bootstrap:

networks:
  # Rede dos serviços, compartilhada por nome. Criada pelo primeiro serviço que subir; os
  # demais a reutilizam. Não usa `internal: true` porque redes internas não publicam portas no host.
  internal:
    name: internal
