name: identity

# Depende do PostgreSQL: o `database` é incluído para que identity-init possa aguardá-lo
# (depends_on) tanto na subida pela raiz quanto no modo isolado. O Compose trata
# inclusões repetidas do mesmo arquivo como um único serviço.
include:
  - path: ../database/compose.yaml
    env_file: ../database/.env

# Conexão com o banco `identity`, criado com o usuário `identity` por database/bootstrap/identity.sql.
# O Zitadel não recebe credencial de administrador do PostgreSQL.
x-identity-database-environment: &identity-database-environment
  ZITADEL_DATABASE_POSTGRES_HOST: ${ZITADEL_DATABASE_POSTGRES_HOST:-database.smarkee.internal}
  ZITADEL_DATABASE_POSTGRES_PORT: ${ZITADEL_DATABASE_POSTGRES_PORT:-5432}
  ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DATABASE_POSTGRES_DATABASE:-identity}
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DATABASE_POSTGRES_USER_USERNAME:-identity}
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DATABASE_POSTGRES_USER_PASSWORD:?Defina ZITADEL_DATABASE_POSTGRES_USER_PASSWORD no .env}
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable

services:
  # Contêiner de inicialização (equivalente ao initContainer): cria os schemas internos do
  # Zitadel (eventstore, projections, system) com o próprio usuário `identity`. Repetível.
  # Requer o `database` aceitando conexões (veja o README).
  identity-init:
    image: ${ZITADEL_IMAGE_VERSION:-ghcr.io/zitadel/zitadel:v4.19.4}
    container_name: identity-init.smarkee.internal
    command: ["init", "zitadel"]
    environment:
      <<: *identity-database-environment
    depends_on:
      database:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - identity-init.smarkee.internal
    restart: "no"

  # API do Zitadel. O start-from-setup aplica as migrações e, na primeira vez, cria a instância
  # descrita pelas variáveis ZITADEL_FIRSTINSTANCE_* (aplicadas só na primeira inicialização).
  identity:
    image: ${ZITADEL_IMAGE_VERSION:-ghcr.io/zitadel/zitadel:v4.19.4}
    container_name: identity.smarkee.internal
    # user 0: o volume identity-bootstrap precisa ser gravável pela API (PAT do cliente de login).
    user: "0"
    command: ["start-from-setup", "--masterkeyFromEnv", "--tlsMode", "disabled"]
    environment:
      <<: *identity-database-environment
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?Defina ZITADEL_MASTERKEY (32 caracteres) no .env}
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-ipm-dev.smarkee.com.br}
      # O Zitadel é acessado pelo gateway; a porta externa deve ser a do proxy HTTP do Kong.
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8080}
      ZITADEL_EXTERNALSECURE: "false"
      # Lido também pelo healthcheck (`zitadel ready`), que não aceita --tlsMode.
      ZITADEL_TLS_ENABLED: "false"
      # Primeira instância: administrador humano e cliente de login (usuário de serviço com PAT,
      # gravado no volume identity-bootstrap e lido pelo identity-login).
      # Nome da instância exibido no console (forma curta da marca: IPM = Identity Provider Manager).
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: ${ZITADEL_FIRSTINSTANCE_INSTANCENAME:-IPM}
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_FIRSTINSTANCE_ORG_NAME:-smarkee.internal}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:?Defina ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD no .env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL:-admin@smarkee.internal}
      # Já é o padrão do Zitadel; explícito por ser configuração de segurança.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      # Conta de bootstrap da plataforma (decisão 0011): administra a instância (IAM_OWNER, atribuído
      # pelo Zitadel) e é usada só pela infraestrutura para configurar a plataforma no Zitadel
      # (projeto, roles, aplicação e os usuários de máquina de cada Executor). Nenhum serviço de
      # runtime a usa. Chave JSON (tipo 1) gravada no volume identity-bootstrap.
      # Só vale na criação da instância; numa instância existente, veja o README.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: platform-bootstrap@smarkee.internal
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Platform Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /zitadel/bootstrap/service-account-platform-bootstrap.json
      # Login v2 (desativado para manter suporte nativo ao cadastro de organization e links no v1)
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://${ZITADEL_EXTERNALDOMAIN:-ipm-dev.smarkee.com.br}:${ZITADEL_EXTERNALPORT:-8080}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://${ZITADEL_EXTERNALDOMAIN:-ipm-dev.smarkee.com.br}:${ZITADEL_EXTERNALPORT:-8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://${ZITADEL_EXTERNALDOMAIN:-ipm-dev.smarkee.com.br}:${ZITADEL_EXTERNALPORT:-8080}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://${ZITADEL_EXTERNALDOMAIN:-ipm-dev.smarkee.com.br}:${ZITADEL_EXTERNALPORT:-8080}/ui/v2/login/login?samlRequest=
      # Marca: remove o "Powered by ZITADEL" das telas de login. Aplicado só na criação da instância.
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_DISABLEWATERMARK: "true"
      # Marca: textos de e-mail em pt sem "Zitadel" (títulos com IPM, frases com Identity Provider
      # Manager). Lista em JSON (aceito pelo Zitadel para esta variável), aplicada só na criação da
      # instância. Substitui a lista padrão (de/en): esses idiomas passam a usar os textos embutidos
      # do Zitadel; em en eles não citam a marca. Demais campos iguais aos textos pt embutidos.
      ZITADEL_DEFAULTINSTANCE_MESSAGETEXTS: |-
        [
          {"MessageTextType": "InitCode", "Language": "pt", "Title": "IPM - Inicializar Usuário", "PreHeader": "Inicializar Usuário", "Subject": "Inicializar Usuário", "Greeting": "Olá {{.DisplayName}},", "Text": "Este usuário foi criado no Identity Provider Manager. Use o nome de usuário {{.PreferredLoginName}} para fazer login. Por favor, clique no botão abaixo para finalizar o processo de inicialização. (Código {{.Code}}) Se você não solicitou este e-mail, por favor, ignore-o.", "ButtonText": "Finalizar inicialização"},
          {"MessageTextType": "PasswordReset", "Language": "pt", "Title": "IPM - Redefinir senha", "PreHeader": "Redefinir senha", "Subject": "Redefinir senha", "Greeting": "Olá {{.DisplayName}},", "Text": "Recebemos uma solicitação de redefinição de senha. Por favor, use o botão abaixo para redefinir sua senha. (Código {{.Code}}) Se você não solicitou este e-mail, por favor, ignore-o.", "ButtonText": "Redefinir senha"},
          {"MessageTextType": "VerifyEmail", "Language": "pt", "Title": "IPM - Verificar e-mail", "PreHeader": "Verificar e-mail", "Subject": "Verificar e-mail", "Greeting": "Olá {{.DisplayName}},", "Text": "Um novo e-mail foi adicionado. Por favor, use o botão abaixo para verificar seu e-mail. (Código {{.Code}}) Se você não adicionou um novo e-mail, por favor, ignore este e-mail.", "ButtonText": "Verificar e-mail"},
          {"MessageTextType": "VerifyPhone", "Language": "pt", "Title": "IPM - Verificar telefone", "PreHeader": "Verificar telefone", "Subject": "Verificar telefone", "Greeting": "Olá {{.DisplayName}},", "Text": "Um novo número de telefone foi adicionado. Por favor, use o código a seguir para verificá-lo {{.Code}}", "ButtonText": "Verificar telefone"},
          {"MessageTextType": "VerifyEmailOTP", "Language": "pt", "Title": "IPM - Verifica o OTP", "PreHeader": "Verifica o OTP", "Subject": "Verifica o OTP", "Greeting": "Olá {{.DisplayName}},", "Text": "Por favor, usa o botão 'Autenticar' o copia o OTP {{.OTP}} e cola-a na tela de autenticação para te autenticares no Identity Provider Manager nos próximos cinco minutos.", "ButtonText": "Autenticar"},
          {"MessageTextType": "DomainClaimed", "Language": "pt", "Title": "IPM - Domínio foi reivindicado", "PreHeader": "Alterar e-mail / nome de usuário", "Subject": "Domínio foi reivindicado", "Greeting": "Olá {{.DisplayName}},", "Text": "O domínio {{.Domain}} foi reivindicado por uma organização. Seu usuário atual, {{.Username}}, não faz parte dessa organização. Portanto, você terá que alterar seu e-mail quando fizer o login. Criamos um nome de usuário temporário ({{.TempUsername}}) para este login.", "ButtonText": "Fazer login"},
          {"MessageTextType": "PasswordlessRegistration", "Language": "pt", "Title": "IPM - Adicionar Login sem Senha", "PreHeader": "Adicionar Login sem Senha", "Subject": "Adicionar Login sem Senha", "Greeting": "Olá {{.DisplayName}},", "Text": "Recebemos uma solicitação para adicionar um token ou dispositivo para login sem senha. Por favor, use o botão abaixo para adicionar seu token ou dispositivo para login sem senha.", "ButtonText": "Adicionar Login sem Senha"},
          {"MessageTextType": "PasswordChange", "Language": "pt", "Title": "IPM - Senha do usuário foi alterada", "PreHeader": "Alterar senha", "Subject": "Senha do usuário foi alterada", "Greeting": "Olá {{.DisplayName}},", "Text": "A senha do seu usuário foi alterada. Se esta alteração não foi feita por você, recomendamos que você redefina sua senha imediatamente.", "ButtonText": "Fazer login"}
        ]
    volumes:
      # Estado de runtime: PAT do cliente de login, gerado na primeira inicialização.
      - identity-bootstrap:/zitadel/bootstrap:rw
    depends_on:
      identity-init:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - identity.smarkee.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 60s

  # Interface de login (login v2). Autentica na API com o PAT gerado pelo identity.
  identity-login:
    image: ${ZITADEL_LOGIN_IMAGE_VERSION:-ghcr.io/zitadel/zitadel-login:v4.19.4}
    container_name: identity-login.smarkee.internal
    user: "0"
    environment:
      ZITADEL_API_URL: http://identity.smarkee.internal:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_SESSION_COOKIE_SECRET:?Defina ZITADEL_SESSION_COOKIE_SECRET no .env}
      # Preserva o domínio público nas chamadas à API (a instância é resolvida pelo Host).
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_EXTERNALDOMAIN:-ipm-dev.smarkee.com.br},X-Forwarded-Proto:http
    volumes:
      - identity-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      identity:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - identity-login.smarkee.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

volumes:
  identity-bootstrap:
    name: identity-bootstrap

networks:
  # Rede dos serviços, compartilhada por nome. Criada pelo primeiro serviço que subir; os
  # demais a reutilizam. Não usa `internal: true` porque redes internas não publicam portas no host.
  internal:
    name: internal
