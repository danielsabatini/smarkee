name: messaging

x-messaging-bootstrap: &messaging-bootstrap
  build:
    context: ../../tools/nats-client
  image: ${MESSAGING_CLIENT_IMAGE:-smarkee-nats-client:dev}
  environment:
    NATS_URL: nats://messaging.smarkee.internal:4222
    NATS_USER: ${MESSAGING_USER:-smarkee}
    NATS_PASSWORD: ${MESSAGING_PASSWORD:?Defina MESSAGING_PASSWORD no .env (veja .env.example)}
  volumes:
    - ./bootstrap:/bootstrap:ro
  depends_on:
    messaging:
      condition: service_healthy
  networks:
    - internal
  restart: "no"

# Driver de log legível pelo telemetry-agent (decisão 0053, docs/OBSERVABILITY.md §7): json-file com rotação e as labels
# que identificam o serviço e a camada (infra) em cada linha.
x-infra-logging: &infra-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: com.docker.compose.service,smarkee.layer

services:
  messaging:
    image: ${MESSAGING_IMAGE_VERSION:-nats:2.15.0-alpine}
    container_name: messaging.smarkee.internal
    labels:
      smarkee.layer: infra
    logging: *infra-logging
    # Limites de recursos (decisão 0053): padrão calibrado com o consumo medido em dev; ajuste pelo ambiente.
    deploy:
      resources:
        limits:
          cpus: "${MESSAGING_CPUS:-0.5}"
          memory: ${MESSAGING_MEMORY:-256M}
    ports:
      - "127.0.0.1:${MESSAGING_CLIENT_PORT:-4222}:4222"  # Client port (somente para desenvolvimento no host)
      - "127.0.0.1:${MESSAGING_MONITOR_PORT:-8222}:8222"  # Monitoring port
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_USER: ${MESSAGING_USER:-smarkee}
      NATS_PASSWORD: ${MESSAGING_PASSWORD:?Defina MESSAGING_PASSWORD no .env (veja .env.example)}
    volumes:
      - messaging-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    networks:
      internal:
        aliases:
          - messaging.smarkee.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Contêineres de inicialização (equivalente ao initContainer): um por Stream declarado em
  # bootstrap/<stream>.json, cada um executando um único comando da CLI oficial, a cada subida.
  # Stream inexistente é criado; existente com configuração idêntica não muda; configuração
  # diferente falha de forma explícita e exige `nats stream edit` deliberado (veja o README).
  # Todo arquivo novo em bootstrap/ exige o seu serviço aqui.
  messaging-bootstrap-requested:
    <<: *messaging-bootstrap
    container_name: messaging-bootstrap-requested.smarkee.internal
    command: ["nats", "stream", "add", "REQUESTED", "--config", "/bootstrap/requested.json"]

  messaging-bootstrap-desired:
    <<: *messaging-bootstrap
    container_name: messaging-bootstrap-desired.smarkee.internal
    command: ["nats", "stream", "add", "DESIRED", "--config", "/bootstrap/desired.json"]

  messaging-bootstrap-observed:
    <<: *messaging-bootstrap
    container_name: messaging-bootstrap-observed.smarkee.internal
    command: ["nats", "stream", "add", "OBSERVED", "--config", "/bootstrap/observed.json"]

  messaging-bootstrap-action:
    <<: *messaging-bootstrap
    container_name: messaging-bootstrap-action.smarkee.internal
    command: ["nats", "stream", "add", "ACTION", "--config", "/bootstrap/action.json"]

  messaging-bootstrap-result:
    <<: *messaging-bootstrap
    container_name: messaging-bootstrap-result.smarkee.internal
    command: ["nats", "stream", "add", "RESULT", "--config", "/bootstrap/result.json"]

  messaging-bootstrap-updated:
    <<: *messaging-bootstrap
    container_name: messaging-bootstrap-updated.smarkee.internal
    command: ["nats", "stream", "add", "UPDATED", "--config", "/bootstrap/updated.json"]

volumes:
  messaging-data:
    name: messaging-data

networks:
  # Rede dos serviços, compartilhada por nome. Criada pelo primeiro serviço que subir; os
  # demais a reutilizam. Não usa `internal: true` porque redes internas não publicam portas no host.
  internal:
    name: internal
