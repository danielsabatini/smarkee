# OpenTelemetry Collector (contrib) — agente de coleta do desenvolvimento.
#   - Métricas de contêiner ... docker_stats (container.*), só dos contêineres `*.smarkee.internal`
#   - Logs de aplicação ........ file_log (json-file do Docker): as linhas JSON dos componentes (decisão 0045)
#   - Logs de infra ............ file_log: os contêineres da plataforma (messaging, database, identity, gateway...), que
#                                o compose marca com a label smarkee.layer=infra (decisão 0053); só WARN ou acima
#   - Healthchecks ............. descartados aqui (uvicorn /health/*, linha do healthcheck da Admin API do APISIX)
#   - Destino .................. OTLP/gRPC no telemetry-router
# Política enxuta, como no otel-agent da stack do desenvolvedor: cada métrica e cada fonte de log é explícita.

extensions:
  # Guarda a posição de leitura dos logs entre reinícios.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

receivers:
  # ---------------------------------------------------------------------------
  # Métricas de contêiner (API do Docker, somente leitura)
  # ---------------------------------------------------------------------------
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    metrics:
      container.cpu.usage.total: { enabled: true }
      container.cpu.throttling_data.periods: { enabled: true }
      container.cpu.throttling_data.throttled_periods: { enabled: true }
      container.memory.usage.total: { enabled: true }
      container.memory.usage.limit: { enabled: true }
      container.network.io.usage.rx_bytes: { enabled: true }
      container.network.io.usage.tx_bytes: { enabled: true }
      container.cpu.utilization: { enabled: false }
      container.cpu.usage.usermode: { enabled: false }
      container.cpu.usage.kernelmode: { enabled: false }
      container.memory.percent: { enabled: false }
      container.memory.file: { enabled: false }
      container.network.io.usage.rx_dropped: { enabled: false }
      container.network.io.usage.tx_dropped: { enabled: false }
      container.blockio.io_service_bytes_recursive: { enabled: false }

  # ---------------------------------------------------------------------------
  # Métricas do PostgreSQL (pg_stat_database, pg_stat_user_tables, pg_database_size)
  # Role `telemetry_login` com `pg_read_all_stats` (sem acesso aos dados das tabelas).
  # ---------------------------------------------------------------------------
  postgresql:
    endpoint: database.smarkee.internal:5432
    transport: tcp
    username: telemetry_login
    password: ${env:SMARKEE_DATABASE_TELEMETRY_PASSWORD:-telemetry_login}
    connect_database: smarkee
    databases: [smarkee, identity]
    exclude_databases: [postgres]
    collection_interval: 30s
    tls:
      insecure: true
    connection_pool:
      max_idle: 2
      max_open: 4
      max_idle_time: 5m
    resource_attributes:
      service.name:
        enabled: true
      service.namespace:
        enabled: true
      db.system.version:
        enabled: true
    metrics:
      postgresql.backends: { enabled: true }
      postgresql.connection.max: { enabled: true }
      postgresql.commits: { enabled: true }
      postgresql.rollbacks: { enabled: true }
      postgresql.deadlocks: { enabled: true }
      postgresql.db_size: { enabled: true }
      postgresql.rows: { enabled: true }
      postgresql.bgwriter.buffers.allocated: { enabled: false }
      postgresql.bgwriter.buffers.writes: { enabled: false }
      postgresql.bgwriter.checkpoint.count: { enabled: false }
      postgresql.bgwriter.duration: { enabled: false }
      postgresql.bgwriter.maxwritten: { enabled: false }
      postgresql.blocks_read: { enabled: false }
      postgresql.database.count: { enabled: false }
      postgresql.index.scans: { enabled: false }
      postgresql.index.size: { enabled: false }
      postgresql.operations: { enabled: false }
      postgresql.replication.data_delay: { enabled: false }
      postgresql.table.count: { enabled: false }
      postgresql.table.size: { enabled: false }
      postgresql.table.vacuum.count: { enabled: false }
      postgresql.wal.age: { enabled: false }
      postgresql.wal.lag: { enabled: false }
      postgresql.wal.delay: { enabled: false }

  # ---------------------------------------------------------------------------
  # Saúde do Transactional Outbox (função SECURITY DEFINER telemetry.outbox_stats(),
  # que descobre dinamicamente as tabelas *_outbox sem expor payload nem acoplar às features).
  # ---------------------------------------------------------------------------
  sql_query/outbox:
    driver: postgres
    host: database.smarkee.internal
    port: 5432
    database: smarkee
    username: telemetry_login
    password: ${env:SMARKEE_DATABASE_TELEMETRY_PASSWORD:-telemetry_login}
    additional_params:
      sslmode: disable
    collection_interval: 30s
    timeout: 5s
    max_open_conn: 1
    queries:
      - sql: 'SELECT "db.namespace", "db.collection.name", unpublished_messages, oldest_unpublished_age FROM telemetry.outbox_stats()'
        metrics:
          - metric_name: smarkee.db.outbox.unpublished_messages
            value_column: unpublished_messages
            value_type: int
            data_type: gauge
            unit: "{message}"
            description: "Unpublished messages waiting in the transactional outbox."
            attribute_columns: ["db.namespace", "db.collection.name"]
            static_attributes:
              db.system.name: postgresql
          - metric_name: smarkee.db.outbox.oldest_unpublished_age
            value_column: oldest_unpublished_age
            value_type: double
            data_type: gauge
            unit: s
            description: "Age in seconds of the oldest unpublished message in the transactional outbox."
            attribute_columns: ["db.namespace", "db.collection.name"]
            static_attributes:
              db.system.name: postgresql

  # ---------------------------------------------------------------------------
  # Métricas de Identity (Zitadel) e Messaging (NATS JetStream), filtradas na origem
  # (metric_relabel_configs) para reter apenas sinais de alto valor e normalizadas à
  # OTel SemConv em transform/infra_metrics.
  # ---------------------------------------------------------------------------
  prometheus/infra:
    config:
      scrape_configs:
        - job_name: identity
          scrape_interval: 30s
          metrics_path: /debug/metrics
          static_configs:
            - targets: [identity.smarkee.internal:8080]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "(rpc_server_call_duration_seconds.*|rpc_server_duration_milliseconds.*|http_server_request_duration_seconds.*|http_server_return_code_counter_total|zitadel_database_pool_acquired_conns|zitadel_database_pool_idle_conns|zitadel_database_pool_max_conns|zitadel_database_pool_acquire_duration_milliseconds_total|projection_events_processed_total)"
              action: keep
        - job_name: messaging
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets: [messaging-exporter.smarkee.internal:7777]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "nats_(consumer_num_pending|consumer_num_ack_pending|consumer_num_redelivered|stream_total_messages|stream_total_bytes|varz_slow_consumers|varz_connections)"
              action: keep

  # ---------------------------------------------------------------------------
  # Logs dos contêineres (driver json-file). Lê todos os contêineres do host; o que não é uma linha JSON de
  # componente da plataforma (service.namespace = smarkee) é descartado no filtro, antes de sair do agente.
  # ---------------------------------------------------------------------------
  file_log/containers:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    include_file_path: true
    include_file_name: false
    storage: file_storage
    operators:
      # Desembrulha o JSON do Docker ({"log": ..., "stream": ..., "time": ...}).
      - type: container
        format: docker
        add_metadata_from_filepath: false
      # container.id (semconv) a partir do caminho do arquivo.
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[0-9a-f]{64})/'
        parse_to: resource
      - type: move
        from: resource.container_id
        to: resource["container.id"]
      - type: remove
        field: attributes["log.file.path"]
      # Linha do contrato 0045: JSON com timestamp, severity_*, body, scope, resource, attributes e event_name.
      # O instante e a severidade já vão para os campos do LogRecord; o resto é movido pelo transform.
      - type: json_parser
        if: attributes.attrs == nil and body matches '^\\{'
        parse_from: body
        # Linha que começa com { mas não é JSON válido segue como texto (e é descartada no filtro); sem isto o erro
        # do parser contamina as linhas boas do mesmo lote.
        on_error: send_quiet
        # Inteiros continuam inteiros (code.line.number é int na semconv); sem isto todo número vira double.
        parse_ints: true
        timestamp:
          parse_from: attributes.timestamp
          layout_type: strptime
          layout: '%Y-%m-%dT%H:%M:%S.%fZ'
        severity:
          parse_from: attributes.severity_text
        # Escopo por registro: sem isto o escopo é um só para o lote lido do arquivo.
        scope_name:
          parse_from: attributes.scope.name
      - type: move
        if: attributes.body != nil
        from: attributes.body
        to: body
      # Resource por registro. O file_log agrupa as linhas pelo Resource: movê-lo aqui (e não no transform, que
      # alteraria o Resource compartilhado do lote) mantém cada linha com a identidade do seu processo, inclusive
      # quando o contêiner reinicia e o arquivo de log passa a ter outro service.instance.id. As chaves são o
      # conjunto fechado do schema (schemas/observability/log-record.v1.schema.json, `resource`).
      - type: move
        if: 'attributes.resource != nil and attributes.resource["service.name"] != nil'
        from: attributes.resource["service.name"]
        to: resource["service.name"]
      - type: move
        if: 'attributes.resource != nil and attributes.resource["service.namespace"] != nil'
        from: attributes.resource["service.namespace"]
        to: resource["service.namespace"]
      - type: move
        if: 'attributes.resource != nil and attributes.resource["service.version"] != nil'
        from: attributes.resource["service.version"]
        to: resource["service.version"]
      - type: move
        if: 'attributes.resource != nil and attributes.resource["service.instance.id"] != nil'
        from: attributes.resource["service.instance.id"]
        to: resource["service.instance.id"]
      - type: move
        if: 'attributes.resource != nil and attributes.resource["deployment.environment.name"] != nil'
        from: attributes.resource["deployment.environment.name"]
        to: resource["deployment.environment.name"]
      - type: move
        if: 'attributes.resource != nil and attributes.resource["smarkee.module"] != nil'
        from: attributes.resource["smarkee.module"]
        to: resource["smarkee.module"]
      - type: move
        if: 'attributes.resource != nil and attributes.resource["smarkee.resource.type"] != nil'
        from: attributes.resource["smarkee.resource.type"]
        to: resource["smarkee.resource.type"]
      - type: move
        if: 'attributes.resource != nil and attributes.resource["smarkee.component.role"] != nil'
        from: attributes.resource["smarkee.component.role"]
        to: resource["smarkee.component.role"]

      # ---- Contêineres da plataforma (infra) ----
      # São os que o compose marca com a label smarkee.layer=infra e cujo driver grava as labels em cada linha
      # (`attrs`). A label com.docker.compose.service é o service.name. Contêineres de outros projetos do host também
      # podem ter `attrs`, mas sem a label smarkee.layer: ficam sem service.name e são descartados no filtro.
      - type: move
        if: 'attributes.attrs != nil and attributes.attrs["smarkee.layer"] == "infra" and attributes.attrs["com.docker.compose.service"] != nil'
        from: attributes.attrs["com.docker.compose.service"]
        to: resource["service.name"]
      - type: add
        if: 'attributes.attrs != nil and resource["service.name"] != nil'
        field: resource["service.namespace"]
        value: smarkee
      # Severidade: cada software escreve a sua. Os padrões abaixo cobrem logfmt e JSON (level=warn, "level":"info":
      # Zitadel, login, etcd, Mailpit), NATS ([INF]), PostgreSQL (LOG:), nginx/APISIX ([error]) e o Collector (tab).
      # Linhas sem nível reconhecido ficam sem severidade.
      - type: regex_parser
        if: 'attributes.attrs != nil and resource["service.name"] != nil and body matches "(\\blevel=|\"level\":\\s*\")[A-Za-z]+"'
        parse_from: body
        regex: '(?:\blevel=|"level":\s*")(?P<level>[A-Za-z]+)'
        severity: &infra_severity
          parse_from: attributes.level
          overwrite_text: true
          mapping:
            fatal: [fatal, ftl, panic, emerg, alert, crit, critical, dpanic]
            error: [error, err, eror]
            warn: [warn, warning, wrn]
            info: [info, inf, log, notice]
            debug: [debug, dbg, trace, trc, debug1, debug2, debug3, debug4, debug5]
      - type: regex_parser
        if: 'attributes.attrs != nil and resource["service.name"] != nil and body matches "\\[(INF|WRN|ERR|DBG|TRC|FTL)\\]"'
        parse_from: body
        regex: '\[(?P<level>INF|WRN|ERR|DBG|TRC|FTL)\]'
        severity: *infra_severity
      - type: regex_parser
        if: 'attributes.attrs != nil and resource["service.name"] != nil and body matches "\\s(LOG|WARNING|ERROR|FATAL|PANIC|NOTICE|INFO|DEBUG[1-5]?):\\s"'
        parse_from: body
        regex: '\s(?P<level>LOG|WARNING|ERROR|FATAL|PANIC|NOTICE|INFO|DEBUG[1-5]?):\s'
        severity: *infra_severity
      - type: regex_parser
        if: 'attributes.attrs != nil and resource["service.name"] != nil and body matches "\\[(emerg|alert|crit|error|warn|notice|info|debug)\\]"'
        parse_from: body
        regex: '\[(?P<level>emerg|alert|crit|error|warn|notice|info|debug)\]'
        severity: *infra_severity
      - type: regex_parser
        if: 'attributes.attrs != nil and resource["service.name"] != nil and body matches "^\\S+\t(debug|info|warn|error|dpanic|panic|fatal)\t"'
        parse_from: body
        regex: '^\S+\t(?P<level>debug|info|warn|error|dpanic|panic|fatal)\t'
        severity: *infra_severity
      - type: remove
        if: attributes.level != nil
        field: attributes.level
      - type: remove
        if: attributes.attrs != nil
        field: attributes.attrs

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # deployment.environment.name vem de OTEL_RESOURCE_ATTRIBUTES. `override: false` preserva o que a fonte já trouxe.
  resource_detection:
    detectors: [env]
    override: false

  # Métricas:
  #   1. `container.*` só dos contêineres da plataforma (`*.smarkee.internal`);
  #   2. descarta métricas sintéticas de scrape do Prometheus (`up`, `scrape_*`, `target_info`, `otel_scope_info`);
  #   3. descarta `postgresql.rows` das tabelas internas do banco `identity` (Zitadel), mantendo `postgresql.rows`
  #      apenas para o banco `smarkee` (e mantendo `backends`, `commits`, `rollbacks`, `deadlocks` e `db_size`
  #      para ambos os bancos).
  filter/dev_containers:
    error_mode: ignore
    metrics:
      metric:
        - IsMatch(metric.name, "^container\\.") and (resource.attributes["container.name"] == nil or not IsMatch(resource.attributes["container.name"], "^.*\\.smarkee\\.internal$"))
        - IsMatch(metric.name, "^(up|scrape_.*|target_info|otel_scope_info)$")
      datapoint:
        - metric.name == "postgresql.rows" and datapoint.attributes["db.namespace"] != nil and IsMatch(datapoint.attributes["db.namespace"], "^identity(\\|.*)?$")

  # Normaliza as métricas de infraestrutura (PostgreSQL, Outbox, Zitadel e NATS JetStream) para 100% OTel SemConv:
  # Resource (`service.namespace`, `service.name`, `server.address`, `server.port`), nomes de métricas, unidades UCUM
  # e atributos de datapoint.
  transform/infra_metrics:
    error_mode: ignore
    metric_statements:
      - context: resource
        conditions:
          - resource.attributes["container.name"] != nil
        statements:
          - set(resource.attributes["service.namespace"], "smarkee")
      - context: metric
        conditions:
          - IsMatch(metric.name, "^(postgresql\\.|smarkee\\.db\\.)")
        statements:
          - set(resource.attributes["service.namespace"], "smarkee")
          - set(resource.attributes["service.name"], "database")
          - set(resource.attributes["server.address"], "database.smarkee.internal") where resource.attributes["server.address"] == nil
          - set(resource.attributes["server.port"], 5432) where resource.attributes["server.port"] == nil
          - set(resource.attributes["service.instance.id"], "database.smarkee.internal:5432") where resource.attributes["service.instance.id"] == nil
      - context: resource
        conditions:
          - resource.attributes["service.name"] == "identity"
        statements:
          - set(resource.attributes["service.namespace"], "smarkee")
          - set(resource.attributes["server.address"], "identity.smarkee.internal")
          - set(resource.attributes["server.port"], 8080)
          - delete_matching_keys(resource.attributes, "^(net\\.host\\..*|server\\.socket\\..*|url\\.scheme)$")
      - context: resource
        conditions:
          - resource.attributes["service.name"] == "messaging"
        statements:
          - set(resource.attributes["service.namespace"], "smarkee")
          - set(resource.attributes["server.address"], "messaging.smarkee.internal")
          - set(resource.attributes["server.port"], 8222)
          - set(resource.attributes["service.instance.id"], "messaging.smarkee.internal:8222")
          - delete_matching_keys(resource.attributes, "^(net\\.host\\..*|server\\.socket\\..*|url\\.scheme)$")
      - context: datapoint
        conditions:
          - resource.attributes["service.name"] == "identity"
        statements:
          - set(datapoint.attributes["rpc.method"], datapoint.attributes["rpc_method"]) where datapoint.attributes["rpc_method"] != nil
          - set(datapoint.attributes["rpc.service"], datapoint.attributes["rpc_service"]) where datapoint.attributes["rpc_service"] != nil
          - set(datapoint.attributes["rpc.response.status_code"], datapoint.attributes["rpc_response_status_code"]) where datapoint.attributes["rpc_response_status_code"] != nil
          - set(datapoint.attributes["rpc.grpc.status_code"], Int(datapoint.attributes["rpc_grpc_status_code"])) where datapoint.attributes["rpc_grpc_status_code"] != nil
          - set(datapoint.attributes["rpc.system.name"], datapoint.attributes["rpc_system_name"]) where datapoint.attributes["rpc_system_name"] != nil
          - set(datapoint.attributes["rpc.system.name"], datapoint.attributes["rpc_system"]) where datapoint.attributes["rpc_system"] != nil
          - set(datapoint.attributes["http.request.method"], datapoint.attributes["method"]) where datapoint.attributes["method"] != nil
          - set(datapoint.attributes["http.route"], datapoint.attributes["uri"]) where datapoint.attributes["uri"] != nil
          - set(datapoint.attributes["http.response.status_code"], Int(datapoint.attributes["return_code"])) where datapoint.attributes["return_code"] != nil
          - set(datapoint.attributes["db.client.connection.pool.name"], "zitadel") where IsMatch(metric.name, "^zitadel_database_pool_")
          - set(datapoint.attributes["db.client.connection.state"], "used") where metric.name == "zitadel_database_pool_acquired_conns"
          - set(datapoint.attributes["db.client.connection.state"], "idle") where metric.name == "zitadel_database_pool_idle_conns"
          - set(datapoint.attributes["smarkee.identity.projection.name"], datapoint.attributes["projection"]) where datapoint.attributes["projection"] != nil
          - set(datapoint.attributes["smarkee.outcome"], "succeeded") where datapoint.attributes["success"] == "true"
          - set(datapoint.attributes["smarkee.outcome"], "failed") where datapoint.attributes["success"] == "false"
          - delete_matching_keys(datapoint.attributes, "^(rpc_method|rpc_service|rpc_response_status_code|rpc_grpc_status_code|rpc_system_name|rpc_system|method|uri|return_code|projection|success)$")
      - context: metric
        conditions:
          - resource.attributes["service.name"] == "identity"
        statements:
          - set(metric.unit, "s") where metric.name == "rpc_server_call_duration_seconds" or metric.name == "http_server_request_duration_seconds"
          - set(metric.name, "rpc.server.call.duration") where metric.name == "rpc_server_call_duration_seconds"
          - set(metric.unit, "ms") where metric.name == "rpc_server_duration_milliseconds"
          - set(metric.name, "rpc.server.duration") where metric.name == "rpc_server_duration_milliseconds"
          - set(metric.name, "http.server.request.duration") where metric.name == "http_server_request_duration_seconds"
          - set(metric.unit, "{request}") where metric.name == "http_server_return_code_counter_total"
          - set(metric.name, "smarkee.identity.http.requests") where metric.name == "http_server_return_code_counter_total"
          - set(metric.unit, "{connection}") where IsMatch(metric.name, "^zitadel_database_pool_(acquired|idle|max)_conns$")
          - set(metric.name, "db.client.connection.count") where metric.name == "zitadel_database_pool_acquired_conns" or metric.name == "zitadel_database_pool_idle_conns"
          - set(metric.name, "db.client.connection.max") where metric.name == "zitadel_database_pool_max_conns"
          - set(metric.unit, "ms") where metric.name == "zitadel_database_pool_acquire_duration_milliseconds_total"
          - set(metric.name, "db.client.connection.wait_time") where metric.name == "zitadel_database_pool_acquire_duration_milliseconds_total"
          - set(metric.unit, "{event}") where metric.name == "projection_events_processed_total"
          - set(metric.name, "smarkee.identity.projection.events") where metric.name == "projection_events_processed_total"
      - context: datapoint
        conditions:
          - resource.attributes["service.name"] == "messaging"
        statements:
          - set(datapoint.attributes["messaging.system"], "nats")
          - set(datapoint.attributes["messaging.destination.name"], datapoint.attributes["stream_name"]) where datapoint.attributes["stream_name"] != nil
          - set(datapoint.attributes["messaging.consumer.group.name"], datapoint.attributes["consumer_name"]) where datapoint.attributes["consumer_name"] != nil
          - delete_matching_keys(datapoint.attributes, "^(account|account_id|account_name|cluster|consumer_desc|consumer_leader|consumer_name|domain|is_consumer_leader|is_meta_leader|is_stream_leader|meta_leader|server_id|server_name|stream_leader|stream_name|stream_raft_group)$")
      - context: metric
        conditions:
          - resource.attributes["service.name"] == "messaging"
        statements:
          - set(metric.unit, "{message}") where IsMatch(metric.name, "^nats_(consumer_num_pending|consumer_num_ack_pending|consumer_num_redelivered|stream_total_messages)$")
          - set(metric.unit, "By") where metric.name == "nats_stream_total_bytes"
          - set(metric.unit, "{consumer}") where metric.name == "nats_varz_slow_consumers"
          - set(metric.unit, "{connection}") where metric.name == "nats_varz_connections"
          - set(metric.name, "smarkee.messaging.consumer.pending_messages") where metric.name == "nats_consumer_num_pending"
          - set(metric.name, "smarkee.messaging.consumer.ack_pending_messages") where metric.name == "nats_consumer_num_ack_pending"
          - set(metric.name, "smarkee.messaging.consumer.redelivered_messages") where metric.name == "nats_consumer_num_redelivered"
          - set(metric.name, "smarkee.messaging.stream.messages") where metric.name == "nats_stream_total_messages"
          - set(metric.name, "smarkee.messaging.stream.size") where metric.name == "nats_stream_total_bytes"
          - set(metric.name, "smarkee.messaging.server.slow_consumers") where metric.name == "nats_varz_slow_consumers"
          - set(metric.name, "smarkee.messaging.server.connections") where metric.name == "nats_varz_connections"

  # Termina o LogRecord a partir da linha do contrato 0045: `event_name`, os ids de trace e a raiz de `attributes`
  # (que o operador `move` do file_log não aceita como destino) são movidos aqui (docs/OBSERVABILITY.md §7).
  # O Resource e o escopo são por registro e já saíram no file_log; mexer neles aqui afetaria o lote inteiro.
  transform/smarkee_components:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - resource.attributes["smarkee.component.role"] != nil
        statements:
          # A versão do escopo seria a do receiver (do Collector), e não a do logger do componente.
          - set(instrumentation_scope.version, "")
          - set(log.event_name, log.attributes["event_name"]) where log.attributes["event_name"] != nil
          - set(log.trace_id.string, log.attributes["trace_id"]) where log.attributes["trace_id"] != nil
          - set(log.span_id.string, log.attributes["span_id"]) where log.attributes["span_id"] != nil
          - set(log.flags, Int(log.attributes["trace_flags"])) where log.attributes["trace_flags"] != nil
          - merge_maps(log.attributes, log.attributes["attributes"], "upsert") where log.attributes["attributes"] != nil
          - delete_matching_keys(log.attributes, "^(timestamp|severity_number|severity_text|event_name|scope|resource|attributes|trace_id|span_id|trace_flags)$")

  # Healthchecks não são sinal: uvicorn (/health/live|ready|startup, /healthz...) e a linha do healthcheck da Admin API
  # do APISIX (127.0.0.1, sem Host, HTTP/1.0). Descartados já aqui, antes de sair do agente.
  filter/health_checks:
    error_mode: ignore
    logs:
      log_record:
        - IsMatch(log.body, "\"(GET|HEAD) /(health/(live|ready|startup)|healthz|readyz|livez)[ ?\"]")
        - IsMatch(log.body, "^127\\.0\\.0\\.1 - - \\[[^\\]]+\\] - \"GET /apisix/admin/routes HTTP/1\\.0\"")

  # Só a plataforma: componentes (JSON do contrato) e contêineres de infra (labels do compose). O resto do host
  # (outros projetos, linhas sem identidade) é descartado. O próprio agente também, para não alimentar a si mesmo.
  filter/platform_only:
    error_mode: ignore
    logs:
      log_record:
        - resource.attributes["service.namespace"] != "smarkee"
        - resource.attributes["service.name"] == "telemetry-agent"

  # Política enxuta da infra, para começar: só WARN ou acima (descartando também linhas sem nível reconhecido, como
  # banners de boot e linhas órfãs STATEMENT:/DETAIL: do PostgreSQL), e sem as linhas de acesso do nginx (o gateway
  # já tem os spans). Os logs de aplicação (smarkee.component.role) ficam inteiros.
  filter/infra_lean:
    error_mode: ignore
    logs:
      log_record:
        - resource.attributes["smarkee.component.role"] == nil and log.severity_number < SEVERITY_NUMBER_WARN
        - resource.attributes["smarkee.component.role"] == nil and IsMatch(log.body, "^\\S+ - \\S+ \\[[0-9]{2}/[A-Za-z]{3}/[0-9]{4}:")
        # O WARN "missing translation" do Zitadel (e-mail sem tradução em `pt`) despeja o usuário inteiro nos argumentos:
        # e-mail, nome e o código de verificação. Além de ser dado pessoal e credencial, é ruído (decisão 0058).
        - resource.attributes["smarkee.component.role"] == nil and IsMatch(log.body, "msg=\"missing translation\"")

  # Defesa em profundidade na infra (decisão 0058): os logs de infra não seguem o contrato 0045 e podem carregar dados
  # pessoais de terceiros (Zitadel, gateway). Qualquer e-mail vira um marcador antes de sair do agente. Os logs de
  # componentes já estão proibidos de trazer valores (contrato 0045) e ficam de fora.
  transform/redact_infra:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - resource.attributes["smarkee.component.role"] == nil
        statements:
          - replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<redacted-email>")

  batch: {}

exporters:
  otlp_grpc/telemetry_gateway:
    endpoint: ${env:SMARKEE_TELEMETRY_ROUTER_ENDPOINT:-telemetry-router.smarkee.internal:4317}
    # Rede interna de desenvolvimento, sem TLS. Em stg e prd, TLS e autenticação.
    tls:
      insecure: true
    # Fila e retry explícitos (decisão 0059). A fila fica em disco (mesma extensão `file_storage` do checkpoint dos
    # logs), então um reinício do agente durante uma queda do telemetry-router não perde o que já foi lido: medido em
    # dev, 31 de 150 registros se perdiam com a fila só em memória. Cheia, a fila descarta o dado novo (a leitura dos
    # logs não é bloqueada). Passado o `max_elapsed_time`, o lote é descartado.
    sending_queue:
      enabled: true
      queue_size: 1000
      block_on_overflow: false
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 10m

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [docker_stats, postgresql, sql_query/outbox, prometheus/infra]
      processors: [memory_limiter, filter/dev_containers, transform/infra_metrics, resource_detection, batch]
      exporters: [otlp_grpc/telemetry_gateway]

    logs:
      receivers: [file_log/containers]
      processors: [memory_limiter, filter/health_checks, filter/platform_only, filter/infra_lean, transform/redact_infra, transform/smarkee_components, resource_detection, batch]
      exporters: [otlp_grpc/telemetry_gateway]
