# Configurações básicas do PostgreSQL

# Arquivos de configuração mapeados em /etc/postgresql (veja compose.yaml)
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'

# Diagnóstico (desenvolvimento): esperas por bloqueio e comandos lentos.
# Os parâmetros dos comandos não são registrados (podem conter dados confidential).
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
deadlock_timeout = 1s
log_min_duration_statement = 500ms
log_parameter_max_length = 0

# Configurações para suporte adequado ao JSONB / Otimizações
work_mem = 4MB
maintenance_work_mem = 64MB
