# Configurações básicas do PostgreSQL

# Arquivos de configuração mapeados em /etc/postgresql (veja compose.yaml)
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'

# Configurações para suporte adequado ao JSONB / Otimizações
work_mem = 4MB
maintenance_work_mem = 64MB
