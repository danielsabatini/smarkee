name: database
services:
  database:
    image: ${POSTGRES_IMAGE_VERSION:-postgres:18.6-alpine}
    container_name: database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarkee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarkee_password}
      POSTGRES_DB: ${POSTGRES_DB:-smarkee}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarkee} -d ${POSTGRES_DB:-smarkee}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database-data:
  
networks:
  database: