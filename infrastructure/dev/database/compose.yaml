name: database
# Driver de log legível pelo telemetry-agent (decisão 0053, docs/OBSERVABILITY.md §7): json-file com rotação e as labels
# que identificam o serviço e a camada (infra) em cada linha.
x-infra-logging: &infra-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: com.docker.compose.service,smarkee.layer

services:
  database:
    image: ${DATABASE_IMAGE_VERSION:-postgres:18.6-alpine}
    container_name: database.smarkee.internal
    labels:
      smarkee.layer: infra
    logging: *infra-logging
    # Limites de recursos (decisão 0053): padrão calibrado com o consumo medido em dev; ajuste pelo ambiente.
    deploy:
      resources:
        limits:
          cpus: "${DATABASE_CPUS:-1.0}"
          memory: ${DATABASE_MEMORY:-512M}
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"  # Somente para desenvolvimento no host
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      # PostgreSQL 18+ grava os dados em /var/lib/postgresql/18/docker;
      # o volume precisa ser montado em /var/lib/postgresql para persistir.
      - database-data:/var/lib/postgresql
      # Arquivos de configuração (postgresql.auto.conf é gerado pelo servidor e não é mapeado).
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
      # Scripts *.sql executados em ordem alfabética apenas na primeira inicialização do volume.
      - ./bootstrap:/docker-entrypoint-initdb.d:ro
    networks:
      internal:
        aliases:
          - database.smarkee.internal
    restart: unless-stopped
    healthcheck:
      # Por TCP: durante a inicialização (initdb.d), o servidor temporário só escuta no socket local;
      # pelo socket, o healthcheck indicaria pronto antes de o banco aceitar conexões dos serviços.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database-data:
    name: database-data

networks:
  # Rede dos serviços, compartilhada por nome. Criada pelo primeiro serviço que subir; os
  # demais a reutilizam. Não usa `internal: true` porque redes internas não publicam portas no host.
  internal:
    name: internal
