# Autenticação de clientes do PostgreSQL (apenas desenvolvimento local).
# Formato: TYPE  DATABASE  USER  ADDRESS  METHOD  (regras avaliadas em ordem; vale a primeira que casar)

# Socket Unix dentro do container: usado pelo entrypoint (initdb.d), pelo healthcheck
# (pg_isready) e por `docker exec`. Inacessível de fora do container.
local   all             all                                     trust

# Conexões TCP: somente de containers na mesma sub-rede (rede `internal`), sempre com senha.
host    all             all             samenet                 scram-sha-256

# Qualquer outra origem é rejeitada (sem regra = negado). Replicação não é utilizada.
