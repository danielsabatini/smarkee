name: core

# Depende do PostgreSQL: o `database` é incluído para que core-migrate possa aguardá-lo
# (depends_on) tanto na subida pela raiz quanto no modo isolado.
include:
  - path: ../database/compose.yaml
    env_file: ../database/.env
  - path: ../broker/compose.yaml
    env_file: ../broker/.env

services:
  # Contêiner de inicialização (equivalente ao initContainer): aplica as migrações do módulo core
  # (features/core/migrations/*.sql, em ordem) como o dono `smarkee`, no banco `smarkee`.
  # As migrações são idempotentes e rodam a cada up. Os papéis de serviço vêm de
  # database/bootstrap/core.sql (veja o README).
  core-migrate:
    image: ${POSTGRES_IMAGE_VERSION:-postgres:18.6-alpine}
    container_name: core-migrate.smarkee.internal
    environment:
      PGHOST: database.smarkee.internal
      PGDATABASE: smarkee
      PGUSER: smarkee
      # Senha trivial de dev do dono do SSOT (database/bootstrap/smarkee.sql).
      PGPASSWORD: smarkee
      # Sem NOTICE de "already exists": as migrações são idempotentes.
      PGOPTIONS: -c client_min_messages=warning
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$$migration" || exit 1; done
    volumes:
      - ../../../features/core/migrations:/migrations:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - core-migrate.smarkee.internal
    restart: "no"

  # Serviço core (decisão 0011): API HTTP, Manager, relay do outbox, Reconciler, Executor e Observer
  # num único processo. Só o gateway o alcança (api-dev.smarkee.com.br); a porta 8000 não é
  # publicada no host. Espera a migração do SSOT e os consumers duráveis do broker.
  core:
    build:
      context: ../../../features/core
    image: ${CORE_IMAGE:-smarkee-core:dev}
    container_name: core.smarkee.internal
    environment:
      # Segredos e identificadores de ambiente vêm do .env (veja .env.example); o resto usa os
      # defaults do serviço (CORE_<SEÇÃO>_<CAMPO>, features/core/src/core/settings.py).
      CORE_DATABASE_ORGANIZATION_MANAGER_PASSWORD: ${CORE_DATABASE_ORGANIZATION_MANAGER_PASSWORD:?Defina no .env}
      CORE_DATABASE_ORGANIZATION_API_PASSWORD: ${CORE_DATABASE_ORGANIZATION_API_PASSWORD:?Defina no .env}
      CORE_DATABASE_USER_MANAGER_PASSWORD: ${CORE_DATABASE_USER_MANAGER_PASSWORD:?Defina no .env}
      CORE_DATABASE_USER_API_PASSWORD: ${CORE_DATABASE_USER_API_PASSWORD:?Defina no .env}
      CORE_DATABASE_RELAY_PASSWORD: ${CORE_DATABASE_RELAY_PASSWORD:?Defina no .env}
      CORE_NATS_PASSWORD: ${CORE_NATS_PASSWORD:?Defina no .env (a mesma NATS_PASSWORD de broker/.env)}
      CORE_AUTH_AUDIENCE: ${CORE_AUTH_AUDIENCE:?Defina no .env (ID do projeto smarkee, org core)}
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      broker-bootstrap-core-organization-manager-requested:
        condition: service_completed_successfully
      broker-bootstrap-core-user-manager-requested:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - core.smarkee.internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  internal:
    name: internal
