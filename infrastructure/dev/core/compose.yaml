name: core

# Depende do PostgreSQL: o `database` é incluído para que core-migrate possa aguardá-lo
# (depends_on) tanto na subida pela raiz quanto no modo isolado.
include:
  - path: ../database/compose.yaml
    env_file: ../database/.env

services:
  # Contêiner de inicialização (equivalente ao initContainer): aplica as migrações do módulo core
  # (features/core/migrations/*.sql, em ordem) como o dono `smarkee`, no banco `smarkee`.
  # As migrações são idempotentes e rodam a cada up. Os papéis de serviço vêm de
  # database/bootstrap/core.sql (veja o README).
  core-migrate:
    image: ${POSTGRES_IMAGE_VERSION:-postgres:18.6-alpine}
    container_name: core-migrate.smarkee.internal
    environment:
      PGHOST: database.smarkee.internal
      PGDATABASE: smarkee
      PGUSER: smarkee
      # Senha trivial de dev do dono do SSOT (database/bootstrap/smarkee.sql).
      PGPASSWORD: smarkee
      # Sem NOTICE de "already exists": as migrações são idempotentes.
      PGOPTIONS: -c client_min_messages=warning
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$$migration" || exit 1; done
    volumes:
      - ../../../features/core/migrations:/migrations:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      internal:
        aliases:
          - core-migrate.smarkee.internal
    restart: "no"

networks:
  internal:
    name: internal
