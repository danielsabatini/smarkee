# Sobreposição aplicada somente quando a stack sobe pela raiz (../compose.yaml).
# Garante que gateway-migrations-bootstrap só inicie com o PostgreSQL aceitando conexões. No modo isolado
# o serviço `database` não pertence ao projeto, por isso a dependência não fica em compose.yaml.
services:
  gateway-migrations-bootstrap:
    depends_on:
      database:
        condition: service_healthy
