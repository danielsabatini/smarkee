# Estado desejado do gateway (formato do ADC), aplicado pelo `gateway-sync` a cada `up`.
# É a fonte da verdade dos serviços e das rotas dentro deles: o que não estiver aqui é removido do gateway.
# Rotas soltas (sem serviço), que é como o console as cria, não são tocadas pelo ADC.
#
# Roteamento por host: o Zitadel atende somente ipm-dev.smarkee.com.br, e nenhum serviço ocupa
# o caminho `/` de forma genérica. Novas APIs recebem host próprio (por exemplo, api.localhost).
services:
  # API e console do Zitadel. O Host original precisa ser preservado (`pass_host: pass`) porque
  # o Zitadel resolve a instância pelo domínio externo (ipm-dev.smarkee.com.br).
  - name: identity
    upstream:
      scheme: http
      type: roundrobin
      pass_host: pass
      nodes:
        - host: identity.smarkee.internal
          port: 8080
          weight: 100
    plugins:
      # O Zitadel usa o cabeçalho próprio para montar o issuer e as URLs públicas, com o Host
      # original (inclusive a porta). O valor enviado pelo cliente é substituído para não ser forjado.
      # No serviço, vale para todas as rotas dele.
      proxy-rewrite:
        headers:
          set:
            x-zitadel-public-host: $http_host
    # Rotas nomeadas por função, para que http.route (spans) diga o que foi acessado em vez de `/*`. A de baixo
    # (`identity`, `/*`) é a retaguarda: pega o que não tem rota própria, para nada deixar de funcionar. As APIs
    # de gestão do Zitadel (/management, /admin, /v2...) os componentes chamam direto, pela rede interna, e não
    # passam por aqui.
    routes:
      - name: identity-oidc
        hosts:
          - ipm-dev.smarkee.com.br
        uris:
          - /.well-known/*
          - /oauth/v2/*
          - /oidc/v1/*
        priority: 10
      - name: identity-login-v1
        hosts:
          - ipm-dev.smarkee.com.br
        uris:
          - /ui/login
          - /ui/login/*
        priority: 10
      - name: identity-console
        hosts:
          - ipm-dev.smarkee.com.br
        uris:
          - /ui/console
          - /ui/console/*
        priority: 10
      - name: identity
        hosts:
          - ipm-dev.smarkee.com.br
        uris:
          - /*

  # Interface de login v2 do Zitadel (a rota de prioridade maior prevalece sobre `/*`).
  - name: identity-login
    upstream:
      scheme: http
      type: roundrobin
      pass_host: pass
      nodes:
        - host: identity-login.smarkee.internal
          port: 3000
          weight: 100
    routes:
      - name: identity-login
        hosts:
          - ipm-dev.smarkee.com.br
        uris:
          - /ui/v2/login*
        priority: 10
        plugins:
          # Em desenvolvimento (HTTP), remove o atributo Secure dos cookies emitidos pelo
          # Next.js (hardcoded no build de produção da imagem). Navegadores rejeitam cookies
          # com Secure em origens HTTP que não sejam localhost (como ipm-dev.smarkee.com.br).
          serverless-post-function:
            phase: header_filter
            functions:
              - |
                return function(conf, ctx)
                  local cookies = ngx.header["Set-Cookie"]
                  if cookies then
                    if type(cookies) == "string" then
                      ngx.header["Set-Cookie"] = ngx.re.gsub(cookies, ";\\s*[Ss]ecure", "", "jo")
                    elseif type(cookies) == "table" then
                      local new_cookies = {}
                      for i, c in ipairs(cookies) do
                        new_cookies[i] = ngx.re.gsub(c, ";\\s*[Ss]ecure", "", "jo")
                      end
                      ngx.header["Set-Cookie"] = new_cookies
                    end
                  end
                end

  # APIs da plataforma. Host próprio (api-dev.smarkee.com.br; em dev, aponte 127.0.0.1 em
  # /etc/hosts). Só `/v1/...` é público: `/health/*` (e `/healthz`, na Organization) fica na rede interna.
  # Cada Receiver só é alcançado por este gateway, que acrescenta o endereço do cliente a
  # `X-Forwarded-For` (o Receiver usa o último valor para o limite de taxa das escritas anônimas).
  # Autenticação (decisão 0052): as rotas de API validam o token com o plugin openid-connect (assinatura pelo JWKS do
  # Zitadel, emissor, audiência do módulo, expiração e os campos sub, exp, iss e aud). A única rota anônima é o
  # cadastro (`core-account-register`, POST /v1/core/accounts); as rotas do Zitadel são públicas.
  # Uma rota por tipo de recurso (decisão 0015). Cada rota casa o caminho exato e os subcaminhos
  # (`/v1/<módulo>/<tipos>` e `/v1/<módulo>/<tipos>/*`), nunca um prefixo parecido (decisão 0030).
  - name: ipm-organization-api
    upstream:
      scheme: http
      type: roundrobin
      pass_host: pass
      nodes:
        - host: ipm-organization-api.smarkee.internal
          port: 8000
          weight: 100
    routes:
      - name: ipm-organization-api
        hosts:
          - api-dev.smarkee.com.br
        uris:
          - /v1/ipm/organizations
          - /v1/ipm/organizations/*
        plugins:
          # Autentica o token na porta de entrada (decisão 0052). Os Receivers repetem a validação e decidem as roles.
          openid-connect:
            client_id: ${SMARKEE_GATEWAY_AUTH_AUDIENCE_IPM_ORGANIZATION}
            discovery: http://ipm-dev.smarkee.com.br:8080/.well-known/openid-configuration
            bearer_only: true
            use_jwks: true
            realm: smarkee
            token_signing_alg_values_expected: RS256
            jwk_expires_in: 3600
            set_access_token_header: false
            set_id_token_header: false
            set_userinfo_header: false
            claim_validator:
              issuer:
                valid_issuers:
                  - http://ipm-dev.smarkee.com.br:8080
            claim_schema:
              type: object
              required: [sub, exp, iss, aud]
              properties:
                aud:
                  anyOf:
                    - type: string
                      const: ${SMARKEE_GATEWAY_AUTH_AUDIENCE_IPM_ORGANIZATION}
                    - type: array
                      contains:
                        const: ${SMARKEE_GATEWAY_AUTH_AUDIENCE_IPM_ORGANIZATION}
          # O 401 do plugin não tem corpo; este devolve o contrato ApiError, como o dos Receivers. Só vale para o 401 do
          # gateway (o plugin envia WWW-Authenticate); o 401 do próprio Receiver passa intacto.
          response-rewrite:
            vars:
              - - status
                - "=="
                - 401
              - - sent_http_www_authenticate
                - "~~"
                - "^Bearer"
            headers:
              set:
                Content-Type: application/json
                # Sem error_description: ele repetiria ao cliente o valor que ele mandou e falhas internas (por exemplo,
                # o corpo de um 503 do Zitadel). O motivo fica no log do gateway.
                WWW-Authenticate: Bearer realm="smarkee"
            body: '{"errorCode":"Unauthorized","message":"Token ausente ou inválido."}'

