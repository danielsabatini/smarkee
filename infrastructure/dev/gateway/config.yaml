# Configuração do Apache APISIX (modo tradicional, com etcd).
# Segredos vêm do ambiente (sintaxe ${{VAR}}); veja o compose.yaml e o .env.example.
apisix:
  # Proxy HTTP dentro da rede. A 8000 é a dos Receivers (buscam o JWKS do Zitadel em
  # gateway.smarkee.internal:8000). A 8080 existe só para o próprio gateway buscar o discovery e o JWKS do Zitadel
  # pelo endereço público (o issuer tem a porta 8080; veja o alias de rede no compose.yaml). Mantenha-a igual a
  # ZITADEL_EXTERNALPORT.
  node_listen:
    - 8000
    - 8080
  # Não revela a versão do APISIX no cabeçalho `Server`.
  enable_server_tokens: false

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key_required: true
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    # Console web embutido (/ui), na porta da Admin API. Exposto só em 127.0.0.1 no host, para desenvolvimento.
    enable_admin_ui: true
    # O console é servido pela mesma origem da Admin API; CORS aberto não é necessário.
    enable_admin_cors: false
    # A Admin API é alcançável por qualquer contêiner da rede `internal` (o gateway-sync usa); a chave é obrigatória.
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180
  etcd:
    host:
      - "http://gateway-etcd.smarkee.internal:2379"
    prefix: /apisix
    timeout: 30

nginx_config:
  # Desenvolvimento: dois processos de trabalho bastam (o padrão `auto` abre um por CPU).
  worker_processes: 2
  error_log_level: warn

# Plugins carregados. Declarar `plugins:` SUBSTITUI a lista padrão do APISIX: esta é a lista padrão da
