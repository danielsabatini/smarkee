name: gateway

# Gateway: Apache APISIX no modo tradicional (configuração no etcd), com o console web embutido.
# O console e a Admin API exigem o etcd; o estado desejado vive em `bootstrap/adc.yaml` e é
# aplicado pelo `gateway-sync` (decisão 0049).

x-apisix-admin-key: &apisix-admin-key ${SMARKEE_GATEWAY_ADMIN_KEY:?Defina SMARKEE_GATEWAY_ADMIN_KEY no .env (veja .env.example)}

# Driver de log legível pelo telemetry-agent (decisão 0053, docs/OBSERVABILITY.md §7): json-file com rotação e as labels
# que identificam o serviço e a camada (infra) em cada linha.
x-infra-logging: &infra-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: com.docker.compose.service,smarkee.layer

services:
  # Armazena a configuração do APISIX (rotas, serviços, plugins). Não é publicado no host.
  gateway-etcd:
    image: ${SMARKEE_GATEWAY_ETCD_IMAGE_VERSION:-quay.io/coreos/etcd:v3.7.2}
    container_name: gateway-etcd.smarkee.internal
    labels:
      smarkee.layer: infra
    logging: *infra-logging
    # Limites de recursos (decisão 0053): padrão calibrado com o consumo medido em dev; ajuste pelo ambiente.
    deploy:
      resources:
        limits:
          cpus: "${SMARKEE_GATEWAY_ETCD_CPUS:-0.5}"
          memory: ${SMARKEE_GATEWAY_ETCD_MEMORY:-256M}
    command:
      - etcd
      - --name=gateway-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://gateway-etcd.smarkee.internal:2379
    volumes:
      - gateway-etcd-data:/etcd-data
    networks:
      internal:
        aliases:
          - gateway-etcd.smarkee.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: ${SMARKEE_GATEWAY_IMAGE_VERSION:-apache/apisix:3.19.0-debian}
    container_name: gateway.smarkee.internal
    labels:
      smarkee.layer: infra
    logging: *infra-logging
    # Limites de recursos (decisão 0053): padrão calibrado com o consumo medido em dev; ajuste pelo ambiente.
    deploy:
      resources:
        limits:
          cpus: "${SMARKEE_GATEWAY_CPUS:-1.0}"
          memory: ${SMARKEE_GATEWAY_MEMORY:-384M}
    environment:
      APISIX_ADMIN_KEY: *apisix-admin-key
    # Só para apontar `SMARKEE_GATEWAY_TELEMETRY_ADDRESS` a um coletor publicado no host (por exemplo, o otel-gateway da
    # stack de observabilidade do desenvolvedor); no Docker Desktop o nome já existe, no Linux não.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Proxy HTTP na porta 8080 (igual a SMARKEE_IDENTITY_EXTERNAL_PORT): o Zitadel monta o issuer e as URLs
      # públicas a partir do Host original, com a porta, e o login (Next.js) recusa Server Actions
      # cujo Origin traga outra porta. Dentro da rede o proxy escuta em 8000 (os Receivers usam esta porta).
      - "127.0.0.1:${SMARKEE_GATEWAY_PROXY_HTTP_PORT:-8080}:8000"  # Proxy HTTP
      # Admin API e console web (/ui), protegidos pela chave SMARKEE_GATEWAY_ADMIN_KEY. Somente para desenvolvimento.
      - "127.0.0.1:${SMARKEE_GATEWAY_ADMIN_PORT:-9180}:9180"
    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      gateway-etcd:
        condition: service_healthy
    networks:
      external:
      internal:
        aliases:
          - gateway.smarkee.internal
          # O plugin openid-connect busca o discovery e o JWKS no endereço do issuer
          # (http://ipm-dev.smarkee.com.br:8080) e o Zitadel escolhe a instância pelo Host. Dentro da rede, esse nome
          # aponta para o próprio gateway, que atende a porta 8080 e encaminha ao Zitadel (decisão 0052). Deve ser
          # igual a SMARKEE_IDENTITY_EXTERNAL_DOMAIN.
          - ipm-dev.smarkee.com.br
    restart: unless-stopped
    healthcheck:
      # Pronto = a Admin API responde 200 (o que exige o etcd). A imagem não tem curl nem wget;
      # o bash fala HTTP pelo /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9180 &&
          printf 'GET /apisix/admin/routes HTTP/1.0\r\nX-API-KEY: %s\r\n\r\n' "$$APISIX_ADMIN_KEY" >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Contêiner de inicialização (equivalente ao initContainer): aplica `bootstrap/adc.yaml` ao gateway.
  # Repetível a cada subida. Reconcilia serviços e as rotas de dentro deles: o que existir no gateway
  # nesse escopo e não estiver no arquivo é REMOVIDO. Rotas soltas (sem serviço), que é como o console
  # as cria, NÃO são tocadas. Roda no `docker compose up -d` completo; num `up` com serviços nomeados,
  # inclua `gateway-sync` e não use `--wait` (ele aborta ao ver o contêiner terminar; veja o README).
  gateway-sync:
    image: ${SMARKEE_GATEWAY_ADC_IMAGE_VERSION:-api7/adc:0.31.0}
    container_name: gateway-sync.smarkee.internal
    command: ["sync", "-f", "/bootstrap/adc.yaml"]
    environment:
      ADC_BACKEND: apisix
      ADC_SERVER: http://gateway.smarkee.internal:9180
      ADC_TOKEN: *apisix-admin-key
      # Audiência (ID do projeto de roles do módulo no Zitadel) aceita em cada API. É a mesma `*_AUTH_AUDIENCE` do
      # Receiver correspondente. Sem valor, o padrão não casa com nenhum token: a API rejeita tudo (falha fechada),
      # e as rotas do Zitadel seguem funcionando para que o ID possa ser obtido.
      SMARKEE_GATEWAY_AUTH_AUDIENCE_CORE_ACCOUNT: ${SMARKEE_GATEWAY_AUTH_AUDIENCE_CORE_ACCOUNT:-nao-configurada}
      SMARKEE_GATEWAY_AUTH_AUDIENCE_IPM_ORGANIZATION: ${SMARKEE_GATEWAY_AUTH_AUDIENCE_IPM_ORGANIZATION:-nao-configurada}
      SMARKEE_GATEWAY_AUTH_AUDIENCE_SUM_SERVICE: ${SMARKEE_GATEWAY_AUTH_AUDIENCE_SUM_SERVICE:-nao-configurada}
      # Proxy (balanceador) em que o gateway confia para ler o IP real do cliente no X-Forwarded-For: um IP ou um CIDR.
      # O padrão (loopback) não confia em ninguém. Em stg e prd, o CIDR do balanceador (decisão 0054).
      SMARKEE_GATEWAY_TRUSTED_PROXIES: ${SMARKEE_GATEWAY_TRUSTED_PROXIES:-127.0.0.1}
      # Destino dos traces do plugin opentelemetry (host:porta do OTLP HTTP). Vira `collector.address` no adc.yaml.
      SMARKEE_GATEWAY_TELEMETRY_ADDRESS: ${SMARKEE_GATEWAY_TELEMETRY_ADDRESS:-telemetry-router.smarkee.internal:4318}
    volumes:
      - ./bootstrap:/bootstrap:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - internal
    # Idempotente: se falhar (por exemplo, logo depois de o etcd ser recriado, quando o APISIX ainda
    # não voltou a enxergá-lo), tenta de novo. Termina com código 0 e não reinicia.
    restart: "on-failure:5"

volumes:
  gateway-etcd-data:
    name: gateway-etcd-data

networks:
  # Rede dos serviços, compartilhada por nome. Criada pelo primeiro serviço que subir; os
  # demais a reutilizam. Não usa `internal: true` porque redes internas não publicam portas no host.
  internal:
    name: internal
  # Rede com acesso externo; somente o gateway participa e publica portas.
  external:
    name: external
