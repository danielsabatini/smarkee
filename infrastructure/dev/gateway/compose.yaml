name: gateway
services:
  gateway:
    image: ${KONG_IMAGE_VERSION:-kong:3.9-ubuntu}
    container_name: gateway
    environment:
      KONG_CONF: /etc/kong/kong.conf
    ports:
      - "${KONG_PROXY_HTTP_PORT:-8000}:8000"  # Proxy HTTP
      - "${KONG_PROXY_HTTPS_PORT:-8443}:8443"  # Proxy HTTPS
      - "${KONG_ADMIN_HTTP_PORT:-8001}:8001"  # Admin API HTTP
      - "${KONG_ADMIN_HTTPS_PORT:-8444}:8444"  # Admin API HTTPS
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
      - ./kong.conf:/etc/kong/kong.conf:ro
    networks:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gateway:  
