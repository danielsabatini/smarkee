name: gateway

# Depende do PostgreSQL: o `database` é incluído para que gateway-migrations-bootstrap possa aguardá-lo
# (depends_on) tanto na subida pela raiz quanto no modo isolado. O Compose trata
# inclusões repetidas do mesmo arquivo como um único serviço.
include:
  - path: ../database/compose.yaml
    env_file: ../database/.env

x-kong-database-environment: &kong-database-environment
  KONG_PG_HOST: ${KONG_DATABASE_HOST:-database.smarkee.internal}
  KONG_PG_PORT: ${KONG_DATABASE_PORT:-5432}
  KONG_PG_DATABASE: ${KONG_DATABASE_NAME:-gateway}
  KONG_PG_USER: ${KONG_DATABASE_USER:-gateway}
  KONG_PG_PASSWORD: ${KONG_DATABASE_PASSWORD:?Defina KONG_DATABASE_PASSWORD no .env}

x-gateway-bootstrap: &gateway-bootstrap
  image: ${KONG_IMAGE_VERSION:-kong:3.9.3-ubuntu}
  environment:
    <<: *kong-database-environment
  volumes:
    - ./kong.conf:/etc/kong/kong.conf:ro
    - ./bootstrap:/bootstrap:ro
  networks:
    - internal
  restart: "no"

services:
  # Contêineres de inicialização (equivalente ao initContainer), em cadeia, um comando cada:
  # migrações do esquema do Kong e importação das rotas declaradas em bootstrap/routes.yml.
  # Todos são repetíveis a cada subida. O `db_import` atualiza por nome: rotas removidas do
  # arquivo NÃO são removidas do banco. Requer o `database` aceitando conexões (veja o README).
  gateway-migrations-bootstrap:
    <<: *gateway-bootstrap
    container_name: gateway-migrations-bootstrap.smarkee.internal
    command: ["kong", "migrations", "bootstrap"]
    depends_on:
      database:
        condition: service_healthy

  gateway-migrations-up:
    <<: *gateway-bootstrap
    container_name: gateway-migrations-up.smarkee.internal
    command: ["kong", "migrations", "up"]
    depends_on:
      gateway-migrations-bootstrap:
        condition: service_completed_successfully

  gateway-migrations-finish:
    <<: *gateway-bootstrap
    container_name: gateway-migrations-finish.smarkee.internal
    command: ["kong", "migrations", "finish"]
    depends_on:
      gateway-migrations-up:
        condition: service_completed_successfully

  gateway-import:
    <<: *gateway-bootstrap
    container_name: gateway-import.smarkee.internal
    command: ["kong", "config", "db_import", "/bootstrap/routes.yml"]
    depends_on:
      gateway-migrations-finish:
        condition: service_completed_successfully

  gateway:
    image: ${KONG_IMAGE_VERSION:-kong:3.9.3-ubuntu}
    container_name: gateway.smarkee.internal
    environment:
      <<: *kong-database-environment
    ports:
      # Proxy HTTP na porta 8080 (igual a ZITADEL_EXTERNALPORT): o Kong envia o X-Forwarded-Host sem a porta, e o login do
      # Zitadel (Next.js) recusa Server Actions cujo Origin traga outra porta.
      - "127.0.0.1:${KONG_PROXY_HTTP_PORT:-8080}:8000"  # Proxy HTTP
      - "127.0.0.1:${KONG_PROXY_HTTPS_PORT:-8443}:8443"  # Proxy HTTPS
      - "127.0.0.1:${KONG_ADMIN_HTTP_PORT:-8001}:8001"  # Admin API HTTP
      - "127.0.0.1:${KONG_ADMIN_HTTPS_PORT:-8444}:8444"  # Admin API HTTPS
      - "127.0.0.1:${KONG_MANAGER_HTTP_PORT:-8002}:8002"  # Kong Manager HTTP (avaliação em dev)
      - "127.0.0.1:${KONG_MANAGER_HTTPS_PORT:-8445}:8445"  # Kong Manager HTTPS (avaliação em dev)
    volumes:
      - ./kong.conf:/etc/kong/kong.conf:ro
    depends_on:
      gateway-import:
        condition: service_completed_successfully
    networks:
      external:
      internal:
        aliases:
          - gateway.smarkee.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Rede dos serviços, compartilhada por nome. Criada pelo primeiro serviço que subir; os
  # demais a reutilizam. Não usa `internal: true` porque redes internas não publicam portas no host.
  internal:
    name: internal
  # Rede com acesso externo; somente o gateway participa e publica portas.
  external:
    name: external
