# Configuração do Kong (modo com banco PostgreSQL).
# Conexão com o banco (host, usuário, senha): variáveis KONG_PG_* no compose.yaml.
database = postgres

# Logs
proxy_access_log = /dev/stdout
admin_access_log = /dev/stdout
proxy_error_log = /dev/stderr
admin_error_log = /dev/stderr

# Interfaces de escuta
admin_listen = 0.0.0.0:8001, 0.0.0.0:8444 ssl
proxy_listen = 0.0.0.0:8000, 0.0.0.0:8443 ssl

# Kong Manager (interface web). Exposta apenas para avaliação em desenvolvimento.
# O navegador acessa a Admin API diretamente, por isso admin_gui_api_url usa o endereço publicado no host.
admin_gui_listen = 0.0.0.0:8002, 0.0.0.0:8445 ssl
admin_gui_url = http://localhost:8002
admin_gui_api_url = http://localhost:8001
