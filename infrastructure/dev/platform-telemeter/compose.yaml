name: platform-telemeter

# `platform-telemeter` (OpenTelemetry Collector, distribuição contrib): destino da telemetria de INFRA e dos sinais de
# APP que nenhum telemeter de feature reivindica (decisão 0062). Recebe do telemetry-router por OTLP gRPC e, até haver
# backend, grava em arquivos com rotação em 10 MB, nas pastas logs/{app,infra}, metrics/{app,infra} e traces/ deste
# diretório (decisão 0053). Não lê logs de contêineres e não roteia.
services:
  platform-telemeter:
    image: ${OTELCOL_IMAGE_VERSION:-otel/opentelemetry-collector-contrib:0.163.1}
    container_name: platform-telemeter.smarkee.internal
    # Sem capabilities e sem escalonamento de privilégio (o coletor escuta em portas altas e roda como 10001).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Saída do exporter file. A imagem não tem sistema de arquivos gravável: as pastas precisam existir no host e
      # ser graváveis pelo usuário 10001 (no Linux, `chmod o+rwx logs metrics traces`; no Docker Desktop já são).
      - ./logs:/telemetry/logs
      - ./metrics:/telemetry/metrics
      - ./traces:/telemetry/traces
    # Driver de log legível pelo coletor (decisão 0045, docs/OBSERVABILITY.md §7), com rotação.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: com.docker.compose.service,smarkee.layer
    labels:
      smarkee.layer: infra
    # Limites de recursos (decisão 0053): padrão calibrado com o consumo medido em dev; ajuste pelo ambiente.
    deploy:
      resources:
        limits:
          cpus: "${PLATFORM_TELEMETER_CPUS:-0.5}"
          memory: ${PLATFORM_TELEMETER_MEMORY:-384M}
    networks:
      internal:
        aliases:
          - platform-telemeter.smarkee.internal
    restart: unless-stopped
    # Sem healthcheck do Compose: a imagem não tem shell nem wget/curl. A extensão `health_check` responde em
    # 13133 (rede `internal`) para sondas externas.
    healthcheck:
      disable: true

networks:
  internal:
    name: internal
