server_name: smarkee-broker

# Configuração JetStream
jetstream {
    store_dir: "/data"
    max_mem: 1G
    max_file: 10G
}

# Portas
port: 4222
http_port: 8222

# Autenticação simples para desenvolvimento: um único usuário para todos os serviços.
# Valores vindos do ambiente (broker/.env). A identidade por serviço de docs/NATS.md e
# docs/RESOURCE-CONTROL-SECURITY.md não é aplicada aqui.
authorization {
    user: $NATS_USER
    password: $NATS_PASSWORD
}
