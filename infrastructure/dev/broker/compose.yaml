name: broker
services:
  broker:
    image: ${NATS_IMAGE_VERSION:-nats:2.15-alpine}
    container_name: broker
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"  # Client port
      - "${NATS_MONITOR_PORT:-8222}:8222"  # Management/Monitoring port
    volumes:
      - broker-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    networks:
      - broker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  broker-data:   

networks:
  broker: