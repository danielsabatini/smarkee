name: broker
services:
  broker:
    image: ${NATS_IMAGE_VERSION:-nats:2.15.0-alpine}
    container_name: broker
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - broker-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  broker-data:

networks:
  # Rede isolada (sem acesso ao host/internet), compartilhada por nome entre os serviços.
  # Criada pelo primeiro serviço que subir; os demais a reutilizam.
  internal:
    name: internal
    internal: true
