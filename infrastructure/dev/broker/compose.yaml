name: broker

x-broker-bootstrap: &broker-bootstrap
  image: ${NATS_BOX_IMAGE_VERSION:-natsio/nats-box:0.20.0-nonroot}
  environment:
    NATS_URL: nats://broker.smarkee.internal:4222
    NATS_USER: ${NATS_USER:-smarkee}
    NATS_PASSWORD: ${NATS_PASSWORD:?Defina NATS_PASSWORD no .env (veja .env.example)}
  volumes:
    - ./bootstrap:/bootstrap:ro
  depends_on:
    broker:
      condition: service_healthy
  networks:
    - internal
  restart: "no"

services:
  broker:
    image: ${NATS_IMAGE_VERSION:-nats:2.15.0-alpine}
    container_name: broker.smarkee.internal
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"  # Client port (somente para desenvolvimento no host)
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"  # Monitoring port
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_USER: ${NATS_USER:-smarkee}
      NATS_PASSWORD: ${NATS_PASSWORD:?Defina NATS_PASSWORD no .env (veja .env.example)}
    volumes:
      - broker-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    networks:
      internal:
        aliases:
          - broker.smarkee.internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Contêineres de inicialização (equivalente ao initContainer): um por Stream declarado em
  # bootstrap/<stream>.json, cada um executando um único comando da CLI oficial, a cada subida.
  # Stream inexistente é criado; existente com configuração idêntica não muda; configuração
  # diferente falha de forma explícita e exige `nats stream edit` deliberado (veja o README).
  # Todo arquivo novo em bootstrap/ exige o seu serviço aqui.
  broker-bootstrap-requested:
    <<: *broker-bootstrap
    container_name: broker-bootstrap-requested.smarkee.internal
    command: ["nats", "stream", "add", "REQUESTED", "--config", "/bootstrap/requested.json"]

  broker-bootstrap-desired:
    <<: *broker-bootstrap
    container_name: broker-bootstrap-desired.smarkee.internal
    command: ["nats", "stream", "add", "DESIRED", "--config", "/bootstrap/desired.json"]

  broker-bootstrap-observed:
    <<: *broker-bootstrap
    container_name: broker-bootstrap-observed.smarkee.internal
    command: ["nats", "stream", "add", "OBSERVED", "--config", "/bootstrap/observed.json"]

  broker-bootstrap-action:
    <<: *broker-bootstrap
    container_name: broker-bootstrap-action.smarkee.internal
    command: ["nats", "stream", "add", "ACTION", "--config", "/bootstrap/action.json"]

  broker-bootstrap-result:
    <<: *broker-bootstrap
    container_name: broker-bootstrap-result.smarkee.internal
    command: ["nats", "stream", "add", "RESULT", "--config", "/bootstrap/result.json"]

  broker-bootstrap-updated:
    <<: *broker-bootstrap
    container_name: broker-bootstrap-updated.smarkee.internal
    command: ["nats", "stream", "add", "UPDATED", "--config", "/bootstrap/updated.json"]

volumes:
  broker-data:
    name: broker-data

networks:
  # Rede dos serviços, compartilhada por nome. Criada pelo primeiro serviço que subir; os
  # demais a reutilizam. Não usa `internal: true` porque redes internas não publicam portas no host.
  internal:
    name: internal
