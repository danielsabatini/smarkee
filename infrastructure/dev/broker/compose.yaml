name: broker
services:
  broker:
    image: ${NATS_IMAGE_VERSION:-nats:2.15.0-alpine}
    container_name: broker
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"  # Client port (somente para desenvolvimento no host)
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"  # Monitoring port
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_USER: ${NATS_USER:-smarkee}
      NATS_PASSWORD: ${NATS_PASSWORD:?Defina NATS_PASSWORD no .env (veja .env.example)}
    volumes:
      - broker-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  broker-data:

networks:
  # Rede dos serviços, compartilhada por nome. Criada pelo primeiro serviço que subir; os
  # demais a reutilizam. Não usa `internal: true` porque redes internas não publicam portas no host.
  internal:
    name: internal
