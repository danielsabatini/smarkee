[project]
name = "smarkee-dev-republish"
version = "0.1.0"
description = "Reconstrução e republicação do estado desired vigente no SSOT para outbox ou NATS JetStream."
requires-python = ">=3.14"
dependencies = [
    "nats-py>=2.16.0",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
smarkee-dev-republish = "smarkee_dev_republish.main:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smarkee_dev_republish"
namespace = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/**/adapters.py" = ["S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
