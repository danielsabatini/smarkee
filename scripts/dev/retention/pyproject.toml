[project]
name = "smarkee-dev-retention"
version = "0.1.0"
description = "Expurgo e política de retenção para tabelas de outbox e idempotency do SSOT."
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
smarkee-dev-retention = "smarkee_dev_retention.main:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smarkee_dev_retention"
namespace = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# As senhas dos papéis de banco de dev são triviais e públicas (iguais ao nome do papel).
"src/**/adapters.py" = ["S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
