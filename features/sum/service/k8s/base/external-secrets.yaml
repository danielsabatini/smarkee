apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sum-service-migrate-secrets
  namespace: sum
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: sum-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: sum-service-migrate-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: database/admin
        property: ssot_password
---
