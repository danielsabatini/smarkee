name: sum-service

# Componentes de sum.service (decisões 0015, 0019, 0032 e 0033): migração, consumers, Receiver, Manager,
# Publisher, Reconciler, Observer e Executor.
# A plataforma (banco, messaging, identidade e gateway) é de `infrastructure/dev` e precisa estar no ar
# e saudável antes: este arquivo só referencia a rede `internal` que ela cria.
#

# Driver de log legível pelo coletor (decisão 0045, docs/OBSERVABILITY.md §7): o padrão `local` do
# Docker não é lido pelo `file_log` do OpenTelemetry Collector. Com rotação.
x-logging: &component-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Limites de recursos dos componentes (decisão 0053): padrão calibrado com o consumo medido em dev (no máximo ~115 MiB de
# memória e ~0,02 núcleo de CPU em média por componente). Ajuste pelo ambiente.
x-deploy: &component-deploy
  resources:
    limits:
      cpus: "${SUM_SERVICE_COMPONENT_CPUS:-0.5}"
      memory: ${SUM_SERVICE_COMPONENT_MEMORY:-256M}

# Imagem única da feature (decisão 0063): contém o código dos seis papéis, e cada serviço escolhe o
# seu pelo `command`. Cada contêiner recebe só as variáveis e os segredos do seu papel.
x-image: &component-image
  build:
    context: .
  image: ${SUM_SERVICE_IMAGE:-smarkee-sum-service:dev}

services:
  # Consumers duráveis de trabalho de sum.service (docs/NATS.md §7.6): `requested`, `observed`, resultados e a
  # remoção da conta (`updated` de core.account) do Manager, e `action` do Executor. Os manifestos ficam em cada componente. O Reconciler e o Observer não
  # têm manifesto: cada instância cria o próprio consumer de estado, com DeliverLastPerSubject (§7.4).
  # Inexistente é criado; existente com configuração idêntica não muda; configuração diferente falha
  # de forma explícita. Exige os Streams criados pelo messaging da plataforma.
  sum-service-consumer:
    build:
      context: ../../../infrastructure/tools/nats-client
    image: ${SMARKEE_MESSAGING_CLIENT_IMAGE:-smarkee-nats-client:dev}
    container_name: sum-service-consumer.smarkee.internal
    environment:
      NATS_URL: nats://messaging.smarkee.internal:4222
      NATS_USER: ${SMARKEE_MESSAGING_USER:-smarkee}
      NATS_PASSWORD: ${SUM_SERVICE_MANAGER_MESSAGING_PASSWORD:?Defina no .env (a mesma SMARKEE_MESSAGING_PASSWORD de messaging/.env)}
    command:
      - sh
      - -c
      - >-
        nats consumer add REQUESTED --config /consumers/sum-service-manager-requested.json &&
        nats consumer add OBSERVED --config /consumers/sum-service-manager-observed.json &&
        nats consumer add RESULT --config /consumers/sum-service-manager-completed.json &&
        nats consumer add RESULT --config /consumers/sum-service-manager-failed.json &&
        nats consumer add UPDATED --config /consumers/sum-service-manager-account-removed.json &&
        for partition in 0 1 2 3; do
          nats consumer add ACTION --config /consumers/sum-service-executor-action-p$$partition.json || exit 1;
        done
    volumes:
      - ./consumers:/consumers:ro
    networks:
      - internal
    restart: "no"

  # Migrações do esquema `sum` (decisão 0033). Executadas como o dono `smarkee`; os papéis de função são
  # criados por infrastructure/dev/database/bootstrap/sum.sql, que roda na criação do banco.
  sum-service-migrate:
    build:
      context: ../../../infrastructure/tools/psql-client
    image: ${SMARKEE_DATABASE_CLIENT_IMAGE:-smarkee-psql-client:dev}
    container_name: sum-service-migrate.smarkee.internal
    environment:
      PGHOST: database.smarkee.internal
      PGDATABASE: smarkee
      PGUSER: smarkee
      # Senha trivial de dev do dono do SSOT (database/bootstrap/smarkee.sql).
      PGPASSWORD: smarkee
      PGOPTIONS: -c client_min_messages=warning
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$$migration" || exit 1; done
    volumes:
      - ./migrations:/migrations:ro
    networks:
      internal:
        aliases:
          - sum-service-migrate.smarkee.internal
    restart: "no"

  # Manager (`sum-service-manager`): único escritor do SSOT de sum.service. Consome `requested`, grava a
  # ligação, a Operation e o outbox. O catálogo serviço → roles é obrigatório (decisão 0033).
  sum-service-manager:
    <<: *component-image
    command: [sum-service-manager]
    container_name: sum-service-manager.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      SUM_SERVICE_MANAGER_CATALOG_ROLES: ${SUM_SERVICE_MANAGER_CATALOG_ROLES:?Defina no .env (JSON serviço → roles, decisão 0033)}
    secrets:
      - SUM_SERVICE_MANAGER_DATABASE_PASSWORD
      - SUM_SERVICE_MANAGER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      sum-service-migrate:
        condition: service_completed_successfully
      sum-service-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - sum-service-manager.smarkee.internal
    restart: unless-stopped
    healthcheck: &component-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Receiver (`sum-service-receiver`): a API `/v1/sum/services`. Só o gateway a alcança; a porta 8000 não é
  # publicada no host. Valida o token (audience = projeto `roles-sum`), confere a role da ação e publica
  # `requested` (decisão 0033).
  sum-service-receiver:
    <<: *component-image
    command: [sum-service-receiver]
    container_name: sum-service-receiver.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      SUM_SERVICE_RECEIVER_AUTH_AUDIENCE: ${SUM_SERVICE_RECEIVER_AUTH_AUDIENCE:?Defina no .env (ID do projeto roles-sum)}
    secrets:
      - SUM_SERVICE_RECEIVER_DATABASE_PASSWORD
      - SUM_SERVICE_RECEIVER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      sum-service-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - sum-service-receiver.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Reconciler (`sum-service-reconciler`): decide e publica as `action`. Sem chave de Zitadel: não escreve
  # nem lê o provedor. Os consumers são criados pelo `sum-service-consumer`.
  sum-service-reconciler:
    <<: *component-image
    command: [sum-service-reconciler]
    container_name: sum-service-reconciler.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
    secrets:
      - SUM_SERVICE_RECONCILER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      sum-service-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - sum-service-reconciler.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Observer (`sum-service-observer`): lê o Zitadel só de leitura (conta `sum-service-observer`) e publica
  # `observed`. Monta só a própria chave do volume da identidade.
  sum-service-observer:
    <<: *component-image
    command: [sum-service-observer]
    container_name: sum-service-observer.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      SUM_SERVICE_OBSERVER_IDENTITY_REGISTER_ORGANIZATION_ID: ${SUM_SERVICE_IDENTITY_REGISTER_ORGANIZATION_ID:?Defina no .env (ID da organização register)}
      SUM_SERVICE_OBSERVER_IDENTITY_PROJECT_IDS: ${SUM_SERVICE_IDENTITY_PROJECT_IDS:?Defina no .env (JSON módulo → ID do projeto de roles)}
      SUM_SERVICE_OBSERVER_CATALOG_ROLES: ${SUM_SERVICE_MANAGER_CATALOG_ROLES:?Defina no .env (o mesmo catálogo do Manager)}
    secrets:
      - SUM_SERVICE_OBSERVER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
      - type: volume
        source: identity-bootstrap
        target: /run/secrets/zitadel-key.json
        read_only: true
        volume:
          subpath: service-account-sum-service-observer.json
    depends_on:
      sum-service-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - sum-service-observer.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Executor (`sum-service-executor`): único componente que concede e revoga roles de serviço no Zitadel. Conta
  # `sum-service-executor`, com `PROJECT_GRANT_OWNER` só no Grant de `roles-ipm` (decisão 0032). Consome todas as
  # partições do ACTION, um laço por partição, no mesmo processo (decisão 0018).
  sum-service-executor:
    <<: *component-image
    command: [sum-service-executor]
    container_name: sum-service-executor.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      SUM_SERVICE_EXECUTOR_IDENTITY_REGISTER_ORGANIZATION_ID: ${SUM_SERVICE_IDENTITY_REGISTER_ORGANIZATION_ID:?Defina no .env (ID da organização register)}
      SUM_SERVICE_EXECUTOR_IDENTITY_PROJECT_IDS: ${SUM_SERVICE_IDENTITY_PROJECT_IDS:?Defina no .env (JSON módulo → ID do projeto de roles)}
      SUM_SERVICE_EXECUTOR_CATALOG_ROLES: ${SUM_SERVICE_MANAGER_CATALOG_ROLES:?Defina no .env (o mesmo catálogo do Manager)}
    secrets:
      - SUM_SERVICE_EXECUTOR_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
      - type: volume
        source: identity-bootstrap
        target: /run/secrets/zitadel-key.json
        read_only: true
        volume:
          subpath: service-account-sum-service-executor.json
    depends_on:
      sum-service-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - sum-service-executor.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Publisher (`sum-service-publisher`): publica o outbox de sum.service (uma instância ativa por trava
  # consultiva). Papel de banco `sum_service_publisher`, que só lê o outbox e marca `published_at`.
  sum-service-publisher:
    <<: *component-image
    command: [sum-service-publisher]
    container_name: sum-service-publisher.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
    secrets:
      - SUM_SERVICE_PUBLISHER_DATABASE_PASSWORD
      - SUM_SERVICE_PUBLISHER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      sum-service-migrate:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - sum-service-publisher.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Telemeter de app de sum.service (decisão 0062, docs/OBSERVABILITY.md §14): recebe por OTLP, do
  # telemetry-router da plataforma, os logs e os spans de app desta feature e os grava em `telemeter/logs/` e `telemeter/traces/`. Não lê logs de
  # contêineres nem usa o socket do Docker (isso é do telemetry-agent). Sem privilégios e sem escrita fora da pasta.
  sum-service-telemeter:
    image: ${SMARKEE_TELEMETRY_IMAGE_VERSION:-otel/opentelemetry-collector-contrib:0.163.1}
    container_name: sum-service-telemeter.smarkee.internal
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./telemeter/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Saída do exporter file. A imagem não tem sistema de arquivos gravável: a pasta precisa existir no host e ser
      # gravável pelo usuário 10001 (no Linux, `chmod o+rwx telemeter/logs telemeter/traces`; no Docker Desktop já é).
      - ./telemeter/logs:/telemetry/logs
      - ./telemeter/traces:/telemetry/traces
    # O log do próprio coletor é de infra (o telemetry-agent o coleta pelas labels, só WARN ou acima).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: com.docker.compose.service,smarkee.layer
    labels:
      smarkee.layer: infra
    deploy:
      resources:
        limits:
          cpus: "${SUM_SERVICE_TELEMETER_CPUS:-0.25}"
          memory: ${SUM_SERVICE_TELEMETER_MEMORY:-192M}
    networks:
      internal:
        aliases:
          - sum-service-telemeter.smarkee.internal
    restart: unless-stopped
    # Sem healthcheck do Compose: a imagem não tem shell nem wget/curl. A extensão `health_check` responde em 13133.
    healthcheck:
      disable: true

# Senhas montadas em /run/secrets/<VARIÁVEL> (arquivo somente leitura, lido pelo `SecretFilesSource`; decisão 0070).
# A origem em dev é o .env; cada papel recebe só a sua. Em stg e prd a origem passa a ser o cofre de segredos.
secrets:
  SUM_SERVICE_MANAGER_DATABASE_PASSWORD:
    environment: SUM_SERVICE_MANAGER_DATABASE_PASSWORD
  SUM_SERVICE_MANAGER_MESSAGING_PASSWORD:
    environment: SUM_SERVICE_MANAGER_MESSAGING_PASSWORD
  SUM_SERVICE_RECEIVER_DATABASE_PASSWORD:
    environment: SUM_SERVICE_RECEIVER_DATABASE_PASSWORD
  SUM_SERVICE_RECEIVER_MESSAGING_PASSWORD:
    environment: SUM_SERVICE_RECEIVER_MESSAGING_PASSWORD
  SUM_SERVICE_RECONCILER_MESSAGING_PASSWORD:
    environment: SUM_SERVICE_RECONCILER_MESSAGING_PASSWORD
  SUM_SERVICE_OBSERVER_MESSAGING_PASSWORD:
    environment: SUM_SERVICE_OBSERVER_MESSAGING_PASSWORD
  SUM_SERVICE_EXECUTOR_MESSAGING_PASSWORD:
    environment: SUM_SERVICE_EXECUTOR_MESSAGING_PASSWORD
  SUM_SERVICE_PUBLISHER_DATABASE_PASSWORD:
    environment: SUM_SERVICE_PUBLISHER_DATABASE_PASSWORD
  SUM_SERVICE_PUBLISHER_MESSAGING_PASSWORD:
    environment: SUM_SERVICE_PUBLISHER_MESSAGING_PASSWORD

volumes:
  # Volume da identidade (chaves das contas de serviço), criado por `infrastructure/dev/identity`.
  identity-bootstrap:
    name: identity-bootstrap
    external: true

networks:
  # Rede da plataforma, criada por `infrastructure/dev`.
  internal:
    name: internal
    external: true
