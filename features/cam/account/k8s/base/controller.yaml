apiVersion: apps/v1
kind: Deployment
metadata:
  name: cam-account-controller
  namespace: cam
  labels:
    app.kubernetes.io/name: cam-account-controller
    app.kubernetes.io/part-of: cam-account
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cam-account-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cam-account-controller
        app.kubernetes.io/part-of: cam-account
    spec:
      automountServiceAccountToken: false
      containers:
        - name: controller
          image: localhost:5001/smarkee-cam-account:dev
          imagePullPolicy: IfNotPresent
          command: ["cam-account-controller"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SMARKEE_ENVIRONMENT
              value: 'dev'
            - name: SMARKEE_CONFIG_PATH
              value: '/etc/smarkee/config.toml'
            - name: CAM_ACCOUNT_CONTROLLER_IDENTITY_REGISTER_ORGANIZATION_ID
              value: '395132726044262411'
            - name: CAM_ACCOUNT_CONTROLLER_IDENTITY_PROJECT_IDS
              value: '{"cam":"394490764261851138","sum":"395263163731279883"}'
          volumeMounts:
            - name: config
              mountPath: /etc/smarkee/config.toml
              subPath: config.toml
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
      volumes:
        - name: config
          configMap:
            name: cam-account-config
        - name: secrets
          secret:
            secretName: cam-account-controller-secrets
