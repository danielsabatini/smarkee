apiVersion: v1
kind: Service
metadata:
  name: cam-account-api
  namespace: cam
  labels:
    app.kubernetes.io/name: cam-account-api
    app.kubernetes.io/part-of: cam-account
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cam-account-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cam-account-api
  namespace: cam
  labels:
    app.kubernetes.io/name: cam-account-api
    app.kubernetes.io/part-of: cam-account
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cam-account-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cam-account-api
        app.kubernetes.io/part-of: cam-account
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: localhost:5001/smarkee-cam-account:dev
          imagePullPolicy: IfNotPresent
          command: ["cam-account-api"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SMARKEE_ENVIRONMENT
              value: 'dev'
            - name: SMARKEE_CONFIG_PATH
              value: '/etc/smarkee/config.toml'
            - name: CAM_ACCOUNT_API_AUTH_AUDIENCE
              value: '394490764261851138'
          volumeMounts:
            - name: config
              mountPath: /etc/smarkee/config.toml
              subPath: config.toml
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
      volumes:
        - name: config
          configMap:
            name: cam-account-config
        - name: secrets
          secret:
            secretName: cam-account-api-secrets
