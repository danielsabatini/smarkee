# SonarQube do core.account (decisão 0063: um projeto e uma imagem por feature).
#
# Execução, nesta pasta:
#   uv run pytest --cov=core_account --cov-report=xml
#   SONAR_TOKEN=<token> sonar-scanner
# O token (Account > Security > Generate Tokens) vem sempre da variável de ambiente SONAR_TOKEN,
# nunca deste arquivo.

# --- Identificação do projeto ---
sonar.projectKey=smarkee-core-account
sonar.projectName=smarkee-core-account
sonar.projectVersion=0.1.0

# --- Servidor local (SonarQube em Docker) ---
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# --- Código ---
# O pacote core_account (src/core_account) e o Dockerfile da imagem única.
sonar.sources=src,Dockerfile
sonar.python.version=3.14
# Modelos gerados dos schemas (decisão 0012) não são código escrito à mão.
sonar.exclusions=**/contracts/generated.py,**/__pycache__/**,**/.venv/**,**/.pytest_cache/**,**/.ruff_cache/**

# --- Testes ---
# Unitários, de contrato e de integração por papel (tests/<papel>/ e tests/common/) e a suíte
# e2e black-box (tests/e2e, projeto à parte com o seu próprio .venv).
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.test.exclusions=**/.venv/**,**/__pycache__/**

# --- Cobertura ---
# Gerado por `pytest --cov=core_account --cov-report=xml` (caminhos relativos: relative_files).
sonar.python.coverage.reportPaths=coverage.xml
