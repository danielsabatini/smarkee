[project]
name = "core-account-publisher"
version = "0.1.0"
description = "Publisher de Account do módulo core (core-account-publisher): publica no transporte o outbox que o Manager gravou."
requires-python = ">=3.14"
dependencies = [
    "nats-py>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.14.0",
]

[project.scripts]
core-account-publisher = "core_account_publisher.main:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core_account_publisher"
# Sem __init__.py: o pacote é um namespace package (python.md, seção 4).
namespace = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert é o mecanismo de verificação do pytest; os testes usam senhas falsas de desenvolvimento
# (papéis de login com senha igual ao nome), e não credenciais reais.
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["core_account_publisher"]
branch = true

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
