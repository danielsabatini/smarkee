name: core-account

# Componentes de core.account (decisões 0015, 0019 e 0063): migração, API (decisão 0098),
# Publisher e Controller (decisão 0096).
# A plataforma (banco, messaging, identidade e gateway) é de `infrastructure/dev` e precisa estar no ar
# e saudável antes (`docker compose up -d` e depois `docker compose up -d --wait messaging database gateway identity identity-login`,
# naquele diretório): este arquivo só referencia a rede `internal` que ela cria.

# Driver de log legível pelo coletor (decisão 0045, docs/telemetry/OBSERVABILITY.md §7): o padrão `local` do
# Docker não é lido pelo `file_log` do OpenTelemetry Collector. Com rotação.
x-logging: &component-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Limites de recursos dos componentes (decisão 0053): padrão calibrado com o consumo medido em dev (no máximo ~115 MiB de
# memória e ~0,02 núcleo de CPU em média por componente). Ajuste pelo ambiente.
x-deploy: &component-deploy
  resources:
    limits:
      cpus: "${CORE_ACCOUNT_COMPONENT_CPUS:-0.5}"
      memory: ${CORE_ACCOUNT_COMPONENT_MEMORY:-256M}

# Imagem única da feature (decisão 0063): contém o código de todos os papéis, e cada serviço escolhe o
# seu pelo `command`. Cada contêiner recebe só as variáveis e os segredos do seu papel.
x-image: &component-image
  build:
    context: .
  image: ${CORE_ACCOUNT_IMAGE:-smarkee-core-account:dev}

services:
  # Contêiner de inicialização (equivalente ao initContainer): aplica as migrações do tipo
  # (features/core/account/migrations/*.sql, em ordem) como o dono `ssot`, no banco `ssot`.
  # O código das migrações é da API (decisões 0015, 0063 e 0098); a execução é desta etapa de
  # implantação, com o papel administrativo, e nunca com o papel de runtime da API.
  # As migrações são idempotentes e rodam a cada up. Os papéis vêm de database/bootstrap/core.sql.
  core-account-migrate:
    build:
      context: ../../../infrastructure/tools/psql-client
    image: ${SMARKEE_DATABASE_CLIENT_IMAGE:-smarkee-psql-client:dev}
    container_name: core-account-migrate.smarkee.internal
    environment:
      PGHOST: database.smarkee.internal
      PGDATABASE: ssot
      PGUSER: ssot
      # Senha trivial de dev do dono do SSOT (database/bootstrap/ssot.sql).
      PGPASSWORD: ssot
      PGOPTIONS: -c client_min_messages=warning
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$$migration" || exit 1; done
    volumes:
      - ./migrations:/migrations:ro
    networks:
      internal:
        aliases:
          - core-account-migrate.smarkee.internal
    restart: "no"

  # API (`core-account-api`, decisão 0098): autentica, autoriza e admite a escrita de forma síncrona
  # (recurso e `desired` no outbox, numa transação). Papel de banco `core_account_api`. Só o gateway a
  # alcança; a porta 8000 não é publicada no host.
  core-account-api:
    <<: *component-image
    command: [core-account-api]
    container_name: core-account-api.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      # Segredos e identificadores de ambiente vêm do .env (veja .env.example); o resto usa os
      # defaults do componente (CORE_ACCOUNT_API_<SEÇÃO>_<CAMPO>).
      CORE_ACCOUNT_API_AUTH_AUDIENCE: ${CORE_ACCOUNT_API_AUTH_AUDIENCE:?Defina no .env (ID do projeto de permissões de core, org core)}
    secrets:
      - CORE_ACCOUNT_API_DATABASE_PASSWORD
      - CORE_ACCOUNT_API_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      core-account-migrate:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - core-account-api.smarkee.internal
    restart: unless-stopped
    healthcheck: &component-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Controller (`core-account-controller`, decisão 0096): observa, decide, age e reobserva o usuário
  # numa só transação, e substitui Observer, Reconciler e Executor. Única identidade do provedor
  # (conta core-account-controller: ORG_USER_CREATOR e ORG_OWNER_VIEWER na organização `register` e
  # PROJECT_GRANT_OWNER nos projetos de permissões que concede) e papel de banco próprio
  # (`core_account_controller_login`, sem INSERT em `account`). Monta só a própria chave.
  core-account-controller:
    <<: *component-image
    command: [core-account-controller]
    container_name: core-account-controller.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      CORE_ACCOUNT_CONTROLLER_IDENTITY_REGISTER_ORGANIZATION_ID: ${CORE_ACCOUNT_IDENTITY_REGISTER_ORGANIZATION_ID:?Defina no .env (ID da organização register)}
      CORE_ACCOUNT_CONTROLLER_IDENTITY_PROJECT_IDS: ${CORE_ACCOUNT_IDENTITY_PROJECT_IDS:?Defina no .env (JSON módulo → ID do projeto de permissões que o Controller concede)}
    secrets:
      - CORE_ACCOUNT_CONTROLLER_DATABASE_PASSWORD
      - CORE_ACCOUNT_CONTROLLER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
      - type: volume
        source: identity-bootstrap
        target: /run/secrets/zitadel-key.json
        read_only: true
        volume:
          subpath: service-account-core-account-controller.json
    depends_on:
      core-account-migrate:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - core-account-controller.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Publisher (`core-account-publisher`): publica o outbox do tipo (uma instância ativa por trava
  # consultiva). Papel de banco `core_account_publisher`, que só lê o outbox e marca `published_at`, e
  # identidade própria no NATS (decisão 0019).
  core-account-publisher:
    <<: *component-image
    command: [core-account-publisher]
    container_name: core-account-publisher.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
    secrets:
      - CORE_ACCOUNT_PUBLISHER_DATABASE_PASSWORD
      - CORE_ACCOUNT_PUBLISHER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      core-account-migrate:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - core-account-publisher.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Telemeter de app de core.account (decisão 0062, docs/telemetry/OBSERVABILITY.md §14): recebe por OTLP, do
  # telemetry-router da plataforma, os logs e os spans de app desta feature e os grava em `telemeter/logs/` e `telemeter/traces/`. Não lê logs de
  # contêineres nem usa o socket do Docker (isso é do telemetry-agent). Sem privilégios e sem escrita fora da pasta.
  core-account-telemeter:
    image: ${SMARKEE_TELEMETRY_IMAGE_VERSION:-otel/opentelemetry-collector-contrib:0.163.1}
    container_name: core-account-telemeter.smarkee.internal
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./telemeter/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Saída do exporter file. A imagem não tem sistema de arquivos gravável: a pasta precisa existir no host e ser
      # gravável pelo usuário 10001 (no Linux, `chmod o+rwx telemeter/logs telemeter/traces`; no Docker Desktop já é).
      - ./telemeter/logs:/telemetry/logs
      - ./telemeter/traces:/telemetry/traces
    # O log do próprio coletor é de infra (o telemetry-agent o coleta pelas labels, só WARN ou acima).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: com.docker.compose.service,smarkee.layer
    labels:
      smarkee.layer: infra
    deploy:
      resources:
        limits:
          cpus: "${CORE_ACCOUNT_TELEMETER_CPUS:-0.25}"
          memory: ${CORE_ACCOUNT_TELEMETER_MEMORY:-192M}
    networks:
      internal:
        aliases:
          - core-account-telemeter.smarkee.internal
    restart: unless-stopped
    # Sem healthcheck do Compose: a imagem não tem shell nem wget/curl. A extensão `health_check` responde em 13133.
    healthcheck:
      disable: true

# Senhas montadas em /run/secrets/<VARIÁVEL> (arquivo somente leitura, lido pelo `SecretFilesSource`; decisão 0070).
# A origem em dev é o .env; cada papel recebe só a sua. Em stg e prd a origem passa a ser o cofre de segredos.
secrets:
  CORE_ACCOUNT_API_DATABASE_PASSWORD:
    environment: CORE_ACCOUNT_API_DATABASE_PASSWORD
  CORE_ACCOUNT_API_MESSAGING_PASSWORD:
    environment: CORE_ACCOUNT_API_MESSAGING_PASSWORD
  CORE_ACCOUNT_CONTROLLER_DATABASE_PASSWORD:
    environment: CORE_ACCOUNT_CONTROLLER_DATABASE_PASSWORD
  CORE_ACCOUNT_CONTROLLER_MESSAGING_PASSWORD:
    environment: CORE_ACCOUNT_CONTROLLER_MESSAGING_PASSWORD
  CORE_ACCOUNT_PUBLISHER_DATABASE_PASSWORD:
    environment: CORE_ACCOUNT_PUBLISHER_DATABASE_PASSWORD
  CORE_ACCOUNT_PUBLISHER_MESSAGING_PASSWORD:
    environment: CORE_ACCOUNT_PUBLISHER_MESSAGING_PASSWORD

volumes:
  # Volume da identidade (chaves das contas de serviço), criado por `infrastructure/dev/identity`.
  identity-bootstrap:
    name: identity-bootstrap
    external: true

networks:
  # Rede da plataforma, criada por `infrastructure/dev`.
  internal:
    name: internal
    external: true
