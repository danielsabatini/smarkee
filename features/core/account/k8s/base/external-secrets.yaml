apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-account-migrate-secrets
  namespace: core
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: core-account
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: core-account-migrate-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: database/admin
        property: ssot_password
---
