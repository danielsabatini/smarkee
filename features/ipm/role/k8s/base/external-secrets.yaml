  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: ipm-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: ipm-role-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: IPM_ROLE_API_DATABASE_PASSWORD
      remoteRef:
        key: ipm/role
        property: api_database_password
    - secretKey: IPM_ROLE_API_MESSAGING_PASSWORD
      remoteRef:
        key: ipm/role
        property: api_messaging_password
