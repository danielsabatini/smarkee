apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ipm-role-migrate-secrets
  namespace: ipm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: ipm-role
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: ipm-role-migrate-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: database/admin
        property: ssot_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ipm-role-api-secrets
