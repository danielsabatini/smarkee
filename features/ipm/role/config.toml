# Configuração de dev de ipm.role (decisões 0067 e 0083). Sem segredos: eles vêm do ambiente ou de /run/secrets.
# Tabela por papel: [tool.ipm.role.<papel>.<seção>]. Precedência: CLI > ambiente > este arquivo > segredos > default.

[tool.ipm.role.api.auth]
host_header = "ipm-dev.smarkee.com.br:8080"
issuer = "http://ipm-dev.smarkee.com.br:8080"
jwks_url = "http://gateway.gateway.svc.cluster.local:8000/oauth/v2/keys"

[tool.ipm.role.api.database]
host = "database-rw.database.svc.cluster.local"
name = "ssot"
port = 5432
user = "ipm_role_api_login"

[tool.ipm.role.api.messaging]
url = "nats://messaging.messaging.svc.cluster.local:4222"
user = "smarkee"

[tool.ipm.role.publisher.database]
host = "database-rw.database.svc.cluster.local"
name = "ssot"
port = 5432
user = "ipm_role_publisher_login"

[tool.ipm.role.publisher.messaging]
url = "nats://messaging.messaging.svc.cluster.local:4222"
user = "smarkee"
