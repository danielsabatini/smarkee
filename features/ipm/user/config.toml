# Configuração de dev de ipm.user (decisão 0067). Sem segredos: eles vêm do ambiente ou de /run/secrets.
# Tabela por papel: [tool.ipm.user.<papel>.<seção>]. Precedência: CLI > ambiente > este arquivo > segredos > default.

[tool.ipm.user.receiver.auth]
host_header = "ipm-dev.smarkee.com.br:8080"
issuer = "http://ipm-dev.smarkee.com.br:8080"
jwks_url = "http://gateway.smarkee.internal:8000/oauth/v2/keys"

[tool.ipm.user.receiver.database]
host = "database.smarkee.internal"
name = "smarkee"
port = 5432
user = "ipm_user_receiver_login"

[tool.ipm.user.receiver.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

[tool.ipm.user.receiver.api]
# Roles do Project Grant de `roles-ipm` que o operador cria para cada organização de cliente
# (decisão 0077). Mantenha igual ao Grant: o Receiver recusa as demais antes do loop.
grantable_roles = [
    "ipm.organization.get",
    "ipm.organization.list",
    "ipm.organization.update",
    "ipm.user.bind",
    "ipm.user.create",
    "ipm.user.delete",
    "ipm.user.get",
    "ipm.user.list",
    "ipm.user.update",
]

[tool.ipm.user.receiver.peers]
organizations_url = "http://ipm-organization-receiver.smarkee.internal:8000"

[tool.ipm.user.manager.database]
host = "database.smarkee.internal"
name = "smarkee"
port = 5432
user = "ipm_user_manager_login"

[tool.ipm.user.manager.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

[tool.ipm.user.publisher.database]
host = "database.smarkee.internal"
name = "smarkee"
port = 5432
user = "ipm_user_publisher_login"

[tool.ipm.user.publisher.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

[tool.ipm.user.observer.identity]
base_url = "http://identity.smarkee.internal:8080"
host_header = "ipm-dev.smarkee.com.br:8080"
issuer = "http://ipm-dev.smarkee.com.br:8080"

[tool.ipm.user.observer.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

[tool.ipm.user.reconciler.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

[tool.ipm.user.executor.identity]
base_url = "http://identity.smarkee.internal:8080"
host_header = "ipm-dev.smarkee.com.br:8080"
issuer = "http://ipm-dev.smarkee.com.br:8080"

[tool.ipm.user.executor.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

