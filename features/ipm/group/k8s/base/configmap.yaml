apiVersion: v1
kind: ConfigMap
metadata:
  name: ipm-group-config
  namespace: ipm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: ipm-group
data:
  config.toml: |
    # Configuração de dev de ipm.group (decisões 0067 e 0083). Sem segredos: eles vêm do ambiente ou de /run/secrets.
    # Tabela por papel: [tool.ipm.group.<papel>.<seção>]. Precedência: CLI > ambiente > este arquivo > segredos > default.

    [tool.ipm.group.api.auth]
    host_header = "ipm-dev.smarkee.com.br:8080"
    issuer = "http://ipm-dev.smarkee.com.br:8080"
    jwks_url = "http://gateway.gateway.svc.cluster.local:8000/oauth/v2/keys"

    [tool.ipm.group.api.database]
    host = "database-rw.database.svc.cluster.local"
    name = "ssot"
    port = 5432
    user = "ipm_group_api_login"

    [tool.ipm.group.api.messaging]
    url = "nats://messaging.messaging.svc.cluster.local:4222"
    user = "smarkee"

    [tool.ipm.group.publisher.database]
    host = "database-rw.database.svc.cluster.local"
    name = "ssot"
    port = 5432
    user = "ipm_group_publisher_login"

    [tool.ipm.group.publisher.messaging]
    url = "nats://messaging.messaging.svc.cluster.local:4222"
    user = "smarkee"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipm-group-migrations
  namespace: ipm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: ipm-group
data:
  0001-group.sql: |
    -- Migração 0001 de ipm.group: Grupo de usuários da Organization no SSOT da Smarkee (docs/data/POSTGRESQL.md §6 e §14.2; decisões 0085 e 0088).
    -- Projeto: ipm-group-manager (decisões 0015 e 0088), dono do esquema do tipo.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`; serviços de runtime não
    -- executam DDL. Os papéis de função são criados por infrastructure/dev/database/bootstrap/ipm.sql.
    -- Idempotente: pode ser reaplicada sem erro.

    CREATE SCHEMA IF NOT EXISTS ipm;

    CREATE TABLE IF NOT EXISTS ipm.group (
      resource_id         text        PRIMARY KEY
                          CHECK (resource_id ~ '^[a-z0-9]([a-z0-9-]{0,126}[a-z0-9])?$'),
      schema_version      text        NOT NULL CHECK (schema_version ~ '^[0-9]+\.[0-9]+$'),
      lifecycle           text        NOT NULL CHECK (lifecycle IN ('present', 'absent')),
      reconciliation      text        NOT NULL DEFAULT 'active' CHECK (reconciliation IN ('active', 'suspended')),
      desired             jsonb       NOT NULL
                          CHECK (jsonb_typeof(desired) = 'object' AND pg_column_size(desired) <= 262144),
      desired_generation  bigint      NOT NULL CHECK (desired_generation >= 1),
      resource_version    bigint      NOT NULL DEFAULT 1,
      observed            jsonb
                          CHECK (observed IS NULL OR (jsonb_typeof(observed) = 'object' AND pg_column_size(observed) <= 262144)),
      presence            text        CHECK (presence IN ('present', 'absent', 'unknown')),
      observed_at         timestamptz,
      phase               text        NOT NULL CHECK (phase IN ('Pending', 'Reconciling', 'Ready', 'Failed', 'Deleting')),
      conditions          jsonb       NOT NULL DEFAULT '[]'::jsonb CHECK (jsonb_typeof(conditions) = 'array'),
      failure_count       integer     NOT NULL DEFAULT 0 CHECK (failure_count >= 0),
      observed_generation bigint,
      created_at          timestamptz NOT NULL DEFAULT now(),
      updated_at          timestamptz NOT NULL DEFAULT now(),
      CHECK ((presence IS NULL) = (observed_at IS NULL)),
      CONSTRAINT group_observed_generation_check
        CHECK (observed_generation IS NULL
               OR (observed_generation >= 1 AND observed_generation <= desired_generation))
    );

    CREATE TABLE IF NOT EXISTS ipm.group_operation (
      operation_id            text        PRIMARY KEY CHECK (length(operation_id) BETWEEN 1 AND 128),
      resource_id             text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      operation_type          text        NOT NULL CHECK (operation_type IN ('create', 'update', 'delete')),
      desired_generation      bigint      CHECK (desired_generation >= 1),
      requested_by            text        NOT NULL CHECK (length(requested_by) BETWEEN 1 AND 256),
      correlation_id          text        NOT NULL CHECK (length(correlation_id) BETWEEN 1 AND 256),
      request_digest          text        NOT NULL CHECK (request_digest ~ '^[0-9a-f]{64}$'),
      operation_status        text        NOT NULL
                              CHECK (operation_status IN ('accepted', 'in_progress', 'completed', 'failed', 'rejected')),
      operation_status_reason text        CHECK (operation_status_reason IN ('conflict', 'validation', 'not_found', 'protected')),
      created_at              timestamptz NOT NULL DEFAULT now(),
      updated_at              timestamptz NOT NULL DEFAULT now(),
      completed_at            timestamptz,
      CHECK ((operation_status = 'rejected') = (operation_status_reason IS NOT NULL)),
      CHECK ((operation_status = 'rejected') = (desired_generation IS NULL))
    );
    CREATE INDEX IF NOT EXISTS group_operation_resource
      ON ipm.group_operation (resource_id, created_at);
    CREATE INDEX IF NOT EXISTS group_operation_retention
      ON ipm.group_operation (updated_at)
      WHERE operation_status IN ('completed', 'failed', 'rejected');

    CREATE TABLE IF NOT EXISTS ipm.group_action_result (
      action_id          text        PRIMARY KEY CHECK (length(action_id) BETWEEN 1 AND 512),
      resource_id        text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      desired_generation bigint      NOT NULL CHECK (desired_generation >= 1),
      action_outcome     text        NOT NULL CHECK (action_outcome IN ('completed', 'failed')),
      recorded_at        timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS group_action_result_recorded
      ON ipm.group_action_result (recorded_at);

    CREATE TABLE IF NOT EXISTS ipm.group_outbox (
      sequence     bigint      GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      message_id   text        NOT NULL UNIQUE CHECK (length(message_id) BETWEEN 1 AND 128),
      resource_id  text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      subject      text        NOT NULL CHECK (length(subject) BETWEEN 1 AND 512),
      payload      jsonb       NOT NULL CHECK (pg_column_size(payload) <= 262144),
      traceparent  text        CHECK (traceparent ~ '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'),
      created_at   timestamptz NOT NULL DEFAULT now(),
      published_at timestamptz
    );
    CREATE INDEX IF NOT EXISTS group_outbox_pending
      ON ipm.group_outbox (sequence) WHERE published_at IS NULL;
    CREATE INDEX IF NOT EXISTS group_outbox_published
      ON ipm.group_outbox (published_at) WHERE published_at IS NOT NULL;

    -- Índice de unicidade de `name` por `organizationId` entre grupos ativos (`lifecycle = 'present'`),
    -- conferido na unidade atômica do pedido sob advisory lock (docs/data/SSOT.md §10.1; decisões 0085 e 0088).
    CREATE UNIQUE INDEX IF NOT EXISTS group_active_organization_name
      ON ipm.group ((desired ->> 'organizationId'), (desired ->> 'name'))
      WHERE lifecycle = 'present';

    -- Índice de busca por organizationId (para contagem de cota e listagem de grupos da Organization)
    CREATE INDEX IF NOT EXISTS group_organization_id
      ON ipm.group ((desired ->> 'organizationId'))
      WHERE lifecycle = 'present';

    -- Interface de leitura do Receiver (docs/data/POSTGRESQL.md §14.2): views sem colunas internas de auditoria.
    DROP VIEW IF EXISTS ipm.group_v1;
    CREATE OR REPLACE VIEW ipm.group_v1 AS
      SELECT
        resource_id,
        schema_version,
        resource_version,
        desired_generation,
        lifecycle,
        reconciliation,
        phase,
        conditions,
        desired,
        observed,
        presence,
        observed_at,
        created_at,
        updated_at
      FROM ipm.group;

    CREATE OR REPLACE VIEW ipm.group_operation_v1 AS
      SELECT
        operation_id,
        resource_id,
        operation_type,
        desired_generation,
        request_digest,
        operation_status,
        operation_status_reason,
        requested_by,
        created_at,
        updated_at,
        completed_at
      FROM ipm.group_operation;

    -- Concessão de privilégios aos papéis de função do SSOT (decisões 0015 e 0088).
    REVOKE ALL ON SCHEMA ipm FROM PUBLIC;
    REVOKE ALL ON ALL TABLES IN SCHEMA ipm FROM PUBLIC;
    REVOKE ALL ON ALL SEQUENCES IN SCHEMA ipm FROM PUBLIC;

    GRANT USAGE ON SCHEMA ipm TO ipm_group_publisher, ipm_maintenance;

    GRANT CONNECT ON DATABASE ssot
      TO ipm_group_publisher, ipm_maintenance;



    GRANT SELECT ON ipm.group_outbox TO ipm_group_publisher;
    GRANT UPDATE (published_at) ON ipm.group_outbox TO ipm_group_publisher;

    GRANT SELECT, DELETE
      ON ipm.group_outbox, ipm.group_action_result, ipm.group_operation
      TO ipm_maintenance;
  0002-group-operation-superseded.sql: |
    -- Migração de ipm.group: novo estado de Operation `superseded` (decisão 0091).
    -- Aditiva: a Operation de uma geração substituída por outra antes de convergir deixa de ser `failed`.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`. Idempotente.

    ALTER TABLE ipm.group_operation
      DROP CONSTRAINT IF EXISTS group_operation_operation_status_check;
    ALTER TABLE ipm.group_operation
      ADD CONSTRAINT group_operation_operation_status_check
      CHECK (operation_status IN ('accepted', 'in_progress', 'completed', 'failed', 'rejected', 'superseded'));

    DROP INDEX IF EXISTS ipm.group_operation_retention;
    CREATE INDEX group_operation_retention
      ON ipm.group_operation (updated_at)
      WHERE operation_status IN ('completed', 'failed', 'rejected', 'superseded');
  0003-group-api.sql: |
    -- ipm.group: API síncrona (decisão 0098) e fim do plano de dados `platform` (S4).
    -- A admissão passa a ser feita na requisição pelo papel `ipm_group_api`, que substitui
    -- `..._manager` e `..._receiver`. Fim da Operation (tabela, view e privilégios) e do resultado de
    -- ação (o tipo não tem Executor); a causa da geração (`requested_by` e `correlation_id`) passa a
    -- ser do próprio recurso; a idempotência do cliente ganha tabela própria.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`, depois de `ipm.sql` (que cria o
    -- papel `ipm_group_api`). Idempotente: pode ser reaplicada sem erro.

    ALTER TABLE ipm.group
      ADD COLUMN IF NOT EXISTS requested_by   text CHECK (length(requested_by) BETWEEN 1 AND 256),
      ADD COLUMN IF NOT EXISTS correlation_id text CHECK (length(correlation_id) BETWEEN 1 AND 256);

    -- Recursos anteriores guardam a causa na última Operation da geração vigente.
    DO $$
    BEGIN
      IF to_regclass('ipm.group_operation') IS NOT NULL THEN
        UPDATE ipm.group AS resource
           SET requested_by = operation.requested_by, correlation_id = operation.correlation_id
          FROM (SELECT DISTINCT ON (resource_id) resource_id, requested_by, correlation_id
                  FROM ipm.group_operation
                 ORDER BY resource_id, created_at DESC) AS operation
         WHERE operation.resource_id = resource.resource_id AND resource.requested_by IS NULL;
      END IF;
    END
    $$;

    -- O Grupo é só dado do SSOT: sem Observer, todo Grupo existente já está convergido. As linhas
    -- anteriores passam a `Ready` com `observed_generation = generation`.
    UPDATE ipm.group
       SET phase = 'Ready', observed_generation = desired_generation
     WHERE phase <> 'Ready' OR observed_generation IS DISTINCT FROM desired_generation;

    -- Idempotência (`Idempotency-Key`): gravada na transação da admissão, só quando a escrita é aplicada.
    CREATE TABLE IF NOT EXISTS ipm.group_idempotency (
      requested_by    text        NOT NULL CHECK (length(requested_by) BETWEEN 1 AND 256),
      idempotency_key text        NOT NULL CHECK (idempotency_key ~ '^[A-Za-z0-9._:-]{1,128}$'),
      request_digest  text        NOT NULL CHECK (request_digest ~ '^[0-9a-f]{64}$'),
      resource_id     text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      created_at      timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (requested_by, idempotency_key)
    );
    CREATE INDEX IF NOT EXISTS group_idempotency_retention
      ON ipm.group_idempotency (created_at);

    -- A view ganha `observed_generation` (no fim, como exige CREATE OR REPLACE VIEW).
    CREATE OR REPLACE VIEW ipm.group_v1 AS
      SELECT resource_id, schema_version, resource_version, desired_generation, lifecycle,
             reconciliation, phase, conditions, desired, observed, presence, observed_at,
             created_at, updated_at, observed_generation
        FROM ipm.group;

    DROP VIEW IF EXISTS ipm.group_operation_v1;
    DROP TABLE IF EXISTS ipm.group_operation;
    DROP TABLE IF EXISTS ipm.group_action_result;

    -- Privilégios: o `api` lê (view), escreve o recurso (com DELETE: a exclusão remove a linha e o
    -- tombstone vai no outbox), o outbox e a idempotência. Os papéis antigos perdem tudo do tipo.
    GRANT CONNECT ON DATABASE ssot TO ipm_group_api;
    GRANT USAGE ON SCHEMA ipm TO ipm_group_api;

    GRANT SELECT, INSERT, UPDATE, DELETE ON ipm.group             TO ipm_group_api;
    GRANT SELECT                         ON ipm.group_v1          TO ipm_group_api;
    GRANT INSERT                         ON ipm.group_outbox      TO ipm_group_api;
    GRANT SELECT, INSERT                 ON ipm.group_idempotency TO ipm_group_api;

    GRANT SELECT, DELETE ON ipm.group_idempotency TO ipm_maintenance;

    DO $$
    BEGIN
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'ipm_group_manager') THEN
        REVOKE ALL ON ipm.group, ipm.group_v1, ipm.group_outbox FROM ipm_group_manager;
        REVOKE ALL ON SCHEMA ipm FROM ipm_group_manager;
        REVOKE CONNECT ON DATABASE ssot FROM ipm_group_manager;
      END IF;
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'ipm_group_receiver') THEN
        REVOKE ALL ON ipm.group_v1 FROM ipm_group_receiver;
        REVOKE ALL ON SCHEMA ipm FROM ipm_group_receiver;
        REVOKE CONNECT ON DATABASE ssot FROM ipm_group_receiver;
      END IF;
    END
    $$;
