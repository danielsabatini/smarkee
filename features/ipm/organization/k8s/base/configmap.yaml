apiVersion: v1
kind: ConfigMap
metadata:
  name: ipm-organization-config
  namespace: ipm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: ipm-organization
data:
  config.toml: |
    # Configuração de dev de ipm.organization (decisão 0067). Sem segredos: eles vêm do ambiente ou de /run/secrets.
    # Tabela por papel: [tool.ipm.organization.<papel>.<seção>]. Precedência: CLI > ambiente > este arquivo > segredos > default.

    [tool.ipm.organization.api.auth]
    host_header = "ipm-dev.smarkee.com.br:8080"
    issuer = "http://ipm-dev.smarkee.com.br:8080"
    jwks_url = "http://gateway.gateway.svc.cluster.local:8000/oauth/v2/keys"
    userinfo_url = "http://gateway.gateway.svc.cluster.local:8000/oidc/v1/userinfo"

    [tool.ipm.organization.api.database]
    host = "database-rw.database.svc.cluster.local"
    name = "ssot"
    port = 5432
    user = "ipm_organization_api_login"

    [tool.ipm.organization.api.messaging]
    url = "nats://messaging.messaging.svc.cluster.local:4222"
    user = "smarkee"

    [tool.ipm.organization.publisher.database]
    host = "database-rw.database.svc.cluster.local"
    name = "ssot"
    port = 5432
    user = "ipm_organization_publisher_login"

    [tool.ipm.organization.publisher.messaging]
    url = "nats://messaging.messaging.svc.cluster.local:4222"
    user = "smarkee"

    [tool.ipm.organization.controller.database]
    host = "database-rw.database.svc.cluster.local"
    name = "ssot"
    port = 5432
    user = "ipm_organization_controller_login"

    [tool.ipm.organization.controller.identity]
    base_url = "http://identity.identity.svc.cluster.local:8080"
    host_header = "ipm-dev.smarkee.com.br:8080"
    issuer = "http://ipm-dev.smarkee.com.br:8080"

    [tool.ipm.organization.controller.messaging]
    url = "nats://messaging.messaging.svc.cluster.local:4222"
    user = "smarkee"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipm-organization-migrations
  namespace: ipm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: ipm-organization
data:
  0001-organization.sql: |
    -- Migração 0001 de ipm.organization: Organization no SSOT (docs/data/POSTGRESQL.md §6 e §14.2).
    -- Projeto: ipm-organization-manager (decisão 0015), dono do esquema do tipo.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`; serviços de runtime não
    -- executam DDL. Os papéis de função são criados por infrastructure/dev/database/bootstrap/ipm.sql.
    -- Idempotente: pode ser reaplicada sem erro.

    CREATE SCHEMA IF NOT EXISTS ipm;

    CREATE TABLE IF NOT EXISTS ipm.organization (
      resource_id        text        PRIMARY KEY
                         CHECK (resource_id ~ '^[a-z0-9]([a-z0-9-]{0,126}[a-z0-9])?$'),
      schema_version     text        NOT NULL CHECK (schema_version ~ '^[0-9]+\.[0-9]+$'),
      lifecycle          text        NOT NULL CHECK (lifecycle IN ('present', 'absent')),
      reconciliation     text        NOT NULL DEFAULT 'active' CHECK (reconciliation IN ('active', 'suspended')),
      desired            jsonb       NOT NULL
                         CHECK (jsonb_typeof(desired) = 'object' AND pg_column_size(desired) <= 262144),
      desired_generation bigint      NOT NULL CHECK (desired_generation >= 1),
      resource_version   bigint      NOT NULL DEFAULT 1,
      observed           jsonb
                         CHECK (observed IS NULL OR (jsonb_typeof(observed) = 'object' AND pg_column_size(observed) <= 262144)),
      presence           text        CHECK (presence IN ('present', 'absent', 'unknown')),
      observed_at        timestamptz,
      phase              text        NOT NULL CHECK (phase IN ('Pending', 'Reconciling', 'Ready', 'Failed', 'Deleting')),
      conditions         jsonb       NOT NULL DEFAULT '[]'::jsonb CHECK (jsonb_typeof(conditions) = 'array'),
      failure_count      integer     NOT NULL DEFAULT 0 CHECK (failure_count >= 0),
      created_at         timestamptz NOT NULL DEFAULT now(),
      updated_at         timestamptz NOT NULL DEFAULT now(),
      CHECK ((presence IS NULL) = (observed_at IS NULL))
    );

    CREATE TABLE IF NOT EXISTS ipm.organization_operation (
      operation_id            text        PRIMARY KEY CHECK (length(operation_id) BETWEEN 1 AND 128),
      resource_id             text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      operation_type          text        NOT NULL CHECK (operation_type IN ('create', 'update', 'delete')),
      desired_generation      bigint      CHECK (desired_generation >= 1),
      requested_by            text        NOT NULL CHECK (length(requested_by) BETWEEN 1 AND 256),
      correlation_id          text        NOT NULL CHECK (length(correlation_id) BETWEEN 1 AND 256),
      request_digest          text        NOT NULL CHECK (request_digest ~ '^[0-9a-f]{64}$'),
      operation_status        text        NOT NULL
                              CHECK (operation_status IN ('accepted', 'in_progress', 'completed', 'failed', 'rejected')),
      operation_status_reason text        CHECK (operation_status_reason IN ('conflict', 'validation', 'not_found')),
      created_at              timestamptz NOT NULL DEFAULT now(),
      updated_at              timestamptz NOT NULL DEFAULT now(),
      completed_at            timestamptz,
      CHECK ((operation_status = 'rejected') = (operation_status_reason IS NOT NULL)),
      CHECK ((operation_status = 'rejected') = (desired_generation IS NULL))
    );
    CREATE INDEX IF NOT EXISTS organization_operation_resource
      ON ipm.organization_operation (resource_id, created_at);
    CREATE INDEX IF NOT EXISTS organization_operation_retention
      ON ipm.organization_operation (updated_at)
      WHERE operation_status IN ('completed', 'failed', 'rejected');

    CREATE TABLE IF NOT EXISTS ipm.organization_outbox (
      sequence     bigint      GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      message_id   text        NOT NULL UNIQUE CHECK (length(message_id) BETWEEN 1 AND 128),
      resource_id  text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      subject      text        NOT NULL CHECK (length(subject) BETWEEN 1 AND 512),
      payload      jsonb       NOT NULL CHECK (pg_column_size(payload) <= 262144),
      created_at   timestamptz NOT NULL DEFAULT now(),
      published_at timestamptz
    );
    CREATE INDEX IF NOT EXISTS organization_outbox_pending
      ON ipm.organization_outbox (sequence) WHERE published_at IS NULL;
    CREATE INDEX IF NOT EXISTS organization_outbox_published
      ON ipm.organization_outbox (published_at) WHERE published_at IS NOT NULL;

    -- Índices de busca do Manager: dono (cota por dono, decisão 0010) e nome (unicidade), conferidos
    -- na unidade atômica do pedido (docs/data/SSOT.md §10.1).
    CREATE INDEX IF NOT EXISTS organization_owner
      ON ipm.organization ((desired ->> 'ownerAccountId'));
    CREATE INDEX IF NOT EXISTS organization_name
      ON ipm.organization ((desired ->> 'name'));

    -- Interface de leitura versionada do Receiver (decisão 0004): sem failure_count. `requested_by` aparece
    -- só na view da Operation, para o Receiver autorizar a leitura (docs/data/POSTGRESQL.md §6.5).
    DROP VIEW IF EXISTS ipm.organization_v1;
    CREATE OR REPLACE VIEW ipm.organization_v1 AS
      SELECT resource_id, schema_version, lifecycle, reconciliation, desired, desired_generation,
             resource_version, observed, presence, observed_at, phase, conditions, created_at, updated_at
        FROM ipm.organization;

    CREATE OR REPLACE VIEW ipm.organization_operation_v1 AS
      SELECT operation_id, resource_id, operation_type, desired_generation, request_digest,
             operation_status, operation_status_reason, created_at, updated_at, completed_at,
             requested_by
        FROM ipm.organization_operation;

    -- Privilégios (docs/data/POSTGRESQL.md §14.2).
    GRANT CONNECT ON DATABASE ssot
      TO ipm_organization_publisher, ipm_maintenance;

    REVOKE ALL ON SCHEMA ipm FROM PUBLIC;
    REVOKE ALL ON ALL TABLES IN SCHEMA ipm FROM PUBLIC;
    GRANT USAGE ON SCHEMA ipm
      TO ipm_organization_publisher, ipm_maintenance;



    GRANT SELECT ON ipm.organization_outbox TO ipm_organization_publisher;
    GRANT UPDATE (published_at) ON ipm.organization_outbox TO ipm_organization_publisher;

    GRANT SELECT, DELETE
      ON ipm.organization_outbox, ipm.organization_operation
      TO ipm_maintenance;
  0002-organization-rejection-protected.sql: |
    -- Migração 0002 de ipm.organization: novo motivo de rejeição `protected` (decisão 0043).
    -- Aditiva: a Operation rejeitada pela proteção contra exclusão guarda `protected` como motivo.
    -- Idempotente: pode ser reaplicada sem erro.

    ALTER TABLE ipm.organization_operation
      DROP CONSTRAINT IF EXISTS organization_operation_operation_status_reason_check;
    ALTER TABLE ipm.organization_operation
      ADD CONSTRAINT organization_operation_operation_status_reason_check
      CHECK (operation_status_reason IN ('conflict', 'validation', 'not_found', 'protected'));
  0003-organization-outbox-traceparent.sql: |
    -- Migração 0003 de ipm.organization: contexto de trace no outbox (decisão 0055).
    -- Aditiva e idempotente. O `traceparent` W3C (versão 00) da requisição ou da mensagem que originou a
    -- linha fica ao lado da mensagem, e não dentro do envelope: o Publisher o repassa como header NATS.
    -- Nulo quando a origem não trouxe contexto (por exemplo, o ciclo de observação).

    ALTER TABLE ipm.organization_outbox
      ADD COLUMN IF NOT EXISTS traceparent text
      CHECK (traceparent ~ '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$');
  0004-organization-observed-generation.sql: |
    -- Migração 0004 de ipm.organization: geração confirmada pela observação (decisão 0072).
    -- Aditiva e idempotente (expandir, `docs/data/POSTGRESQL.md` §15). `observed_generation` é a última
    -- geração cuja convergência o Manager confirmou com uma observação feita depois dela, como o
    -- `status.observedGeneration` do Kubernetes: nula até a primeira confirmação, só cresce e nunca
    -- passa de `desired_generation`.

    ALTER TABLE ipm.organization
      ADD COLUMN IF NOT EXISTS observed_generation bigint;

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_constraint
         WHERE conname = 'organization_observed_generation_check'
           AND conrelid = 'ipm.organization'::regclass
      ) THEN
        ALTER TABLE ipm.organization
          ADD CONSTRAINT organization_observed_generation_check
          CHECK (observed_generation IS NULL
                 OR (observed_generation >= 1 AND observed_generation <= desired_generation));
      END IF;
    END
    $$;

    -- Registros existentes: a fase `Ready` só era gravada com a geração vigente convergida.
    UPDATE ipm.organization
       SET observed_generation = desired_generation
     WHERE observed_generation IS NULL AND phase = 'Ready';
  0005-organization-user-access-permissions.sql: |
    -- Migração 0005 de ipm.organization: renomeia `grantRoles` para `grantPermissions` e
    -- `administrators[].roles` para `administrators[].permissions` em `desired.userAccess` e
    -- `observed.userAccess` (docs/identity/PERMISSION.md).
    -- Executada pela infraestrutura como `ssot` no banco `ssot`; idempotente.

    UPDATE ipm.organization
       SET desired = jsonb_set(
             desired,
             '{userAccess}',
             ((desired -> 'userAccess') - 'grantRoles')
               || jsonb_build_object('grantPermissions', desired -> 'userAccess' -> 'grantRoles')
           ),
           updated_at = now()
     WHERE desired ? 'userAccess'
       AND (desired -> 'userAccess') ? 'grantRoles'
       AND NOT ((desired -> 'userAccess') ? 'grantPermissions');

    UPDATE ipm.organization
       SET observed = jsonb_set(
             observed,
             '{userAccess}',
             ((observed -> 'userAccess') - 'grantRoles')
               || jsonb_build_object('grantPermissions', observed -> 'userAccess' -> 'grantRoles')
           ),
           updated_at = now()
     WHERE observed IS NOT NULL
       AND observed ? 'userAccess'
       AND (observed -> 'userAccess') ? 'grantRoles'
       AND NOT ((observed -> 'userAccess') ? 'grantPermissions');

    UPDATE ipm.organization
       SET observed = jsonb_set(
             observed,
             '{userAccess,administrators}',
             COALESCE(
               (SELECT jsonb_agg(
                         CASE
                           WHEN entry ? 'roles' AND NOT (entry ? 'permissions')
                             THEN (entry - 'roles') || jsonb_build_object('permissions', entry -> 'roles')
                           ELSE entry
                         END
                       )
                  FROM jsonb_array_elements(observed -> 'userAccess' -> 'administrators') AS entry),
               '[]'::jsonb
             )
           ),
           updated_at = now()
     WHERE observed IS NOT NULL
       AND observed ? 'userAccess'
       AND (observed -> 'userAccess') ? 'administrators'
       AND EXISTS (
             SELECT 1
               FROM jsonb_array_elements(observed -> 'userAccess' -> 'administrators') AS entry
              WHERE entry ? 'roles' AND NOT (entry ? 'permissions')
           );
  0006-organization-operation-superseded.sql: |
    -- Migração de ipm.organization: novo estado de Operation `superseded` (decisão 0091).
    -- Aditiva: a Operation de uma geração substituída por outra antes de convergir deixa de ser `failed`.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`. Idempotente.

    ALTER TABLE ipm.organization_operation
      DROP CONSTRAINT IF EXISTS organization_operation_operation_status_check;
    ALTER TABLE ipm.organization_operation
      ADD CONSTRAINT organization_operation_operation_status_check
      CHECK (operation_status IN ('accepted', 'in_progress', 'completed', 'failed', 'rejected', 'superseded'));

    DROP INDEX IF EXISTS ipm.organization_operation_retention;
    CREATE INDEX organization_operation_retention
      ON ipm.organization_operation (updated_at)
      WHERE operation_status IN ('completed', 'failed', 'rejected', 'superseded');
  0007-organization-controller.sql: |
    -- Migração de ipm.organization: privilégios do Controller (decisão 0096).
    -- O Controller substitui Observer, Reconciler e Executor: lê o recurso sob lock, grava o estado
    -- observado, a fase, as conditions e as Operations, apaga o registro quando a remoção converge e
    -- grava `desired` suspenso e `updated` no outbox na mesma transação. Não cria nem altera o `desired`.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`. Idempotente.
    -- O papel é criado por infrastructure/dev/database/bootstrap/ipm.sql.

    GRANT CONNECT ON DATABASE ssot TO ipm_organization_controller;
    GRANT USAGE ON SCHEMA ipm TO ipm_organization_controller;

    GRANT SELECT, UPDATE, DELETE ON ipm.organization           TO ipm_organization_controller;
    GRANT SELECT, UPDATE         ON ipm.organization_operation TO ipm_organization_controller;
    GRANT INSERT                 ON ipm.organization_outbox    TO ipm_organization_controller;
  0008-organization-remove-action-result.sql: |
    -- Migração de ipm.organization: fim de `organization_action_result` e privilégios mínimos do Manager (decisão 0096).
    -- O Controller concentra observação, ação e resultado num ciclo atômico; a idempotência da ação
    -- não precisa mais do registro por `actionId`, e o Manager deixa de aplicar `observed` e resultados:
    -- só admite pedidos (insere, altera o `desired` e insere Operations e outbox).
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`. Idempotente.

    DROP TABLE IF EXISTS ipm.organization_action_result;

    DO $$
    BEGIN
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'ipm_organization_manager') THEN
        REVOKE DELETE ON ipm.organization FROM ipm_organization_manager;
        REVOKE UPDATE ON ipm.organization_operation FROM ipm_organization_manager;
      END IF;
    END
    $$;
  0009-organization-api.sql: |
    -- ipm.organization: API síncrona (decisão 0098). A admissão passa a ser feita na requisição pelo
    -- papel `ipm_organization_api`, que substitui `..._manager` e `..._receiver`.
    -- Fim da Operation (tabela, view e privilégios); a causa da geração (`requested_by` e
    -- `correlation_id`) passa a ser do próprio recurso; a idempotência do cliente ganha tabela própria.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`, depois de `ipm.sql` (que cria o
    -- papel `ipm_organization_api`). Idempotente: pode ser reaplicada sem erro.

    ALTER TABLE ipm.organization
      ADD COLUMN IF NOT EXISTS requested_by   text CHECK (length(requested_by) BETWEEN 1 AND 256),
      ADD COLUMN IF NOT EXISTS correlation_id text CHECK (length(correlation_id) BETWEEN 1 AND 256);

    -- Recursos anteriores guardam a causa na última Operation da geração vigente.
    DO $$
    BEGIN
      IF to_regclass('ipm.organization_operation') IS NOT NULL THEN
        UPDATE ipm.organization AS resource
           SET requested_by = operation.requested_by, correlation_id = operation.correlation_id
          FROM (SELECT DISTINCT ON (resource_id) resource_id, requested_by, correlation_id
                  FROM ipm.organization_operation
                 ORDER BY resource_id, created_at DESC) AS operation
         WHERE operation.resource_id = resource.resource_id AND resource.requested_by IS NULL;
      END IF;
    END
    $$;

    -- Idempotência (`Idempotency-Key`): gravada na transação da admissão, só quando a escrita é aplicada.
    CREATE TABLE IF NOT EXISTS ipm.organization_idempotency (
      requested_by    text        NOT NULL CHECK (length(requested_by) BETWEEN 1 AND 256),
      idempotency_key text        NOT NULL CHECK (idempotency_key ~ '^[A-Za-z0-9._:-]{1,128}$'),
      request_digest  text        NOT NULL CHECK (request_digest ~ '^[0-9a-f]{64}$'),
      resource_id     text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      created_at      timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (requested_by, idempotency_key)
    );
    CREATE INDEX IF NOT EXISTS organization_idempotency_retention
      ON ipm.organization_idempotency (created_at);

    -- A view ganha `observed_generation` (no fim, como exige CREATE OR REPLACE VIEW).
    CREATE OR REPLACE VIEW ipm.organization_v1 AS
      SELECT resource_id, schema_version, lifecycle, reconciliation, desired, desired_generation,
             resource_version, observed, presence, observed_at, phase, conditions, created_at, updated_at,
             observed_generation
        FROM ipm.organization;

    DROP VIEW IF EXISTS ipm.organization_operation_v1;
    DROP TABLE IF EXISTS ipm.organization_operation;

    -- Privilégios: o `api` lê (view), escreve o recurso (sem DELETE, decisão 0096), o outbox e a
    -- idempotência. Os papéis antigos perdem tudo do tipo.
    GRANT CONNECT ON DATABASE ssot TO ipm_organization_api;
    GRANT USAGE ON SCHEMA ipm TO ipm_organization_api;

    GRANT SELECT, INSERT, UPDATE ON ipm.organization             TO ipm_organization_api;
    GRANT SELECT                 ON ipm.organization_v1          TO ipm_organization_api;
    GRANT INSERT                 ON ipm.organization_outbox      TO ipm_organization_api;
    GRANT SELECT, INSERT         ON ipm.organization_idempotency TO ipm_organization_api;

    GRANT SELECT, DELETE ON ipm.organization_idempotency TO ipm_maintenance;

    DO $$
    BEGIN
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'ipm_organization_manager') THEN
        REVOKE ALL ON ipm.organization, ipm.organization_v1, ipm.organization_outbox
          FROM ipm_organization_manager;
        REVOKE ALL ON SCHEMA ipm FROM ipm_organization_manager;
        REVOKE CONNECT ON DATABASE ssot FROM ipm_organization_manager;
      END IF;
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'ipm_organization_receiver') THEN
        REVOKE ALL ON ipm.organization_v1 FROM ipm_organization_receiver;
        REVOKE ALL ON SCHEMA ipm FROM ipm_organization_receiver;
        REVOKE CONNECT ON DATABASE ssot FROM ipm_organization_receiver;
      END IF;
    END
    $$;
