name: ipm-organization

# Componentes de ipm.organization (decisões 0015 e 0019): migração, consumers, Receiver, Manager,
# Publisher e Controller (decisão 0096).
# A plataforma (banco, messaging, identidade e gateway) é de `infrastructure/dev` e precisa estar no ar
# e saudável antes (`docker compose up -d` e depois `docker compose up -d --wait messaging database gateway identity identity-login`,
# naquele diretório): este arquivo só referencia a rede `internal` que ela cria.

# Driver de log legível pelo coletor (decisão 0045, docs/telemetry/OBSERVABILITY.md §7): o padrão `local` do
# Docker não é lido pelo `file_log` do OpenTelemetry Collector. Com rotação.
x-logging: &component-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Limites de recursos dos componentes (decisão 0053): padrão calibrado com o consumo medido em dev (no máximo ~115 MiB de
# memória e ~0,02 núcleo de CPU em média por componente). Ajuste pelo ambiente.
x-deploy: &component-deploy
  resources:
    limits:
      cpus: "${IPM_ORGANIZATION_COMPONENT_CPUS:-0.5}"
      memory: ${IPM_ORGANIZATION_COMPONENT_MEMORY:-256M}

# Imagem única da feature (decisão 0063): contém o código dos seis papéis, e cada serviço escolhe o
# seu pelo `command`. Cada contêiner recebe só as variáveis e os segredos do seu papel.
x-image: &component-image
  build:
    context: .
  image: ${IPM_ORGANIZATION_IMAGE:-smarkee-ipm-organization:dev}

services:
  # Consumers duráveis de trabalho do tipo: o Manager (`requested`) (docs/messaging/NATS.md §7.6). Os manifestos são do Manager (`consumers/`). Inexistente é criado;
  # existente com configuração idêntica não muda; configuração diferente falha de forma explícita.
  # Exige o Stream REQUESTED, criado pelo messaging da plataforma.
  ipm-organization-consumer:
    build:
      context: ../../../infrastructure/tools/nats-client
    image: ${SMARKEE_MESSAGING_CLIENT_IMAGE:-smarkee-nats-client:dev}
    container_name: ipm-organization-consumer.smarkee.internal
    environment:
      NATS_URL: nats://messaging.smarkee.internal:4222
      NATS_USER: ${SMARKEE_MESSAGING_USER:-smarkee}
      NATS_PASSWORD: ${IPM_ORGANIZATION_MANAGER_MESSAGING_PASSWORD:?Defina no .env (a mesma SMARKEE_MESSAGING_PASSWORD de messaging/.env)}
    command:
      - sh
      - -c
      - >-
        nats consumer add REQUESTED --config /consumers/ipm-organization-manager-requested.json
    volumes:
      - ./consumers:/consumers:ro
    networks:
      - internal
    restart: "no"

  # Contêiner de inicialização (equivalente ao initContainer): aplica as migrações do tipo
  # (features/ipm/organization/migrations/*.sql, em ordem) como o dono `ssot`, no banco `ssot`.
  # O código das migrações é do projeto do Manager (decisão 0015); a execução é desta etapa de
  # implantação, com o papel administrativo, e nunca com o papel de runtime do Manager.
  # As migrações são idempotentes e rodam a cada up. Os papéis vêm de database/bootstrap/ipm.sql.
  ipm-organization-migrate:
    build:
      context: ../../../infrastructure/tools/psql-client
    image: ${SMARKEE_DATABASE_CLIENT_IMAGE:-smarkee-psql-client:dev}
    container_name: ipm-organization-migrate.smarkee.internal
    environment:
      PGHOST: database.smarkee.internal
      PGDATABASE: ssot
      PGUSER: ssot
      # Senha trivial de dev do dono do SSOT (database/bootstrap/ssot.sql).
      PGPASSWORD: ssot
      PGOPTIONS: -c client_min_messages=warning
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$$migration" || exit 1; done
    volumes:
      - ./migrations:/migrations:ro
    networks:
      internal:
        aliases:
          - ipm-organization-migrate.smarkee.internal
    restart: "no"

  # Receiver (ipm-organization-receiver): só o gateway a alcança; a porta 8000 não é publicada no host.
  ipm-organization-receiver:
    <<: *component-image
    command: [ipm-organization-receiver]
    container_name: ipm-organization-receiver.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      # Segredos e identificadores de ambiente vêm do .env (veja .env.example); o resto usa os
      # defaults do componente (IPM_ORGANIZATION_RECEIVER_<SEÇÃO>_<CAMPO>).
      IPM_ORGANIZATION_RECEIVER_AUTH_AUDIENCE: ${IPM_ORGANIZATION_RECEIVER_AUTH_AUDIENCE:?Defina no .env (ID do projeto roles-ipm, org core)}
    secrets:
      - IPM_ORGANIZATION_RECEIVER_DATABASE_PASSWORD
      - IPM_ORGANIZATION_RECEIVER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      ipm-organization-migrate:
        condition: service_completed_successfully
      ipm-organization-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-receiver.smarkee.internal
    restart: unless-stopped
    healthcheck: &component-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Manager (`ipm-organization-manager`): único escritor do SSOT do tipo. Grava no `desired` o
  # preparo de cada Organization para os usuários (decisão 0081): o catálogo vem do contrato, e as
  # contas do ipm/user, daqui.
  ipm-organization-manager:
    <<: *component-image
    command: [ipm-organization-manager]
    container_name: ipm-organization-manager.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      IPM_ORGANIZATION_MANAGER_USER_ACCESS_USER_EXECUTOR_ACCOUNT_ID: ${IPM_ORGANIZATION_USER_EXECUTOR_ACCOUNT_ID:?Defina no .env (ID da conta ipm-user-executor, org core)}
      IPM_ORGANIZATION_MANAGER_USER_ACCESS_USER_OBSERVER_ACCOUNT_ID: ${IPM_ORGANIZATION_USER_OBSERVER_ACCOUNT_ID:?Defina no .env (ID da conta ipm-user-observer, org core)}
      IPM_ORGANIZATION_MANAGER_USER_ACCESS_SERVICEACCOUNT_EXECUTOR_ACCOUNT_ID: ${IPM_ORGANIZATION_SERVICEACCOUNT_EXECUTOR_ACCOUNT_ID:?Defina no .env (ID da conta ipm-serviceaccount-executor, org core)}
      IPM_ORGANIZATION_MANAGER_USER_ACCESS_SERVICEACCOUNT_OBSERVER_ACCOUNT_ID: ${IPM_ORGANIZATION_SERVICEACCOUNT_OBSERVER_ACCOUNT_ID:?Defina no .env (ID da conta ipm-serviceaccount-observer, org core)}
      IPM_ORGANIZATION_MANAGER_USER_ACCESS_SERVICEACCOUNT_CONTROLLER_ACCOUNT_ID: ${IPM_ORGANIZATION_SERVICEACCOUNT_CONTROLLER_ACCOUNT_ID:?Defina no .env (ID da conta ipm-serviceaccount-controller, org core)}
      IPM_ORGANIZATION_MANAGER_USER_ACCESS_USER_CONTROLLER_ACCOUNT_ID: ${IPM_ORGANIZATION_USER_CONTROLLER_ACCOUNT_ID:?Defina no .env (ID da conta ipm-user-controller, org core)}
    secrets:
      - IPM_ORGANIZATION_MANAGER_DATABASE_PASSWORD
      - IPM_ORGANIZATION_MANAGER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      ipm-organization-migrate:
        condition: service_completed_successfully
      ipm-organization-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-manager.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Publisher (`ipm-organization-publisher`): publica o outbox do tipo (uma instância ativa por
  # trava consultiva).
  ipm-organization-publisher:
    <<: *component-image
    command: [ipm-organization-publisher]
    container_name: ipm-organization-publisher.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
    secrets:
      - IPM_ORGANIZATION_PUBLISHER_DATABASE_PASSWORD
      - IPM_ORGANIZATION_PUBLISHER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
    depends_on:
      ipm-organization-migrate:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-publisher.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Controller (`ipm-organization-controller`, decisão 0096): observa, decide, age e reobserva a
  # Organization numa só transação, e substitui Observer, Reconciler e Executor. Única identidade
  # do provedor (conta ipm-organization-controller, papel IAM_ORG_MANAGER) e papel de banco próprio
  # (`ipm_organization_controller_login`, sem INSERT em `organization`). Monta só a própria chave.
  ipm-organization-controller:
    <<: *component-image
    command: [ipm-organization-controller]
    container_name: ipm-organization-controller.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      SMARKEE_CONFIG_PATH: /etc/smarkee/config.toml
      IPM_ORGANIZATION_CONTROLLER_IDENTITY_PROJECT_ID: ${IPM_ORGANIZATION_IDENTITY_PROJECT_ID:?Defina no .env (ID do projeto roles-ipm, org core)}
    secrets:
      - IPM_ORGANIZATION_CONTROLLER_DATABASE_PASSWORD
      - IPM_ORGANIZATION_CONTROLLER_MESSAGING_PASSWORD
    volumes:
      - ./config.toml:/etc/smarkee/config.toml:ro
      - type: volume
        source: identity-bootstrap
        target: /run/secrets/zitadel-key.json
        read_only: true
        volume:
          subpath: service-account-ipm-organization-controller.json
    depends_on:
      ipm-organization-migrate:
        condition: service_completed_successfully
      ipm-organization-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-controller.smarkee.internal
    restart: unless-stopped
    healthcheck: *component-healthcheck

  # Telemeter de app de ipm.organization (decisão 0062, docs/telemetry/OBSERVABILITY.md §14): recebe por OTLP, do
  # telemetry-router da plataforma, os logs e os spans de app desta feature e os grava em `telemeter/logs/` e `telemeter/traces/`. Não lê logs de
  # contêineres nem usa o socket do Docker (isso é do telemetry-agent). Sem privilégios e sem escrita fora da pasta.
  ipm-organization-telemeter:
    image: ${SMARKEE_TELEMETRY_IMAGE_VERSION:-otel/opentelemetry-collector-contrib:0.163.1}
    container_name: ipm-organization-telemeter.smarkee.internal
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./telemeter/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Saída do exporter file. A imagem não tem sistema de arquivos gravável: a pasta precisa existir no host e ser
      # gravável pelo usuário 10001 (no Linux, `chmod o+rwx telemeter/logs telemeter/traces`; no Docker Desktop já é).
      - ./telemeter/logs:/telemetry/logs
      - ./telemeter/traces:/telemetry/traces
    # O log do próprio coletor é de infra (o telemetry-agent o coleta pelas labels, só WARN ou acima).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: com.docker.compose.service,smarkee.layer
    labels:
      smarkee.layer: infra
    deploy:
      resources:
        limits:
          cpus: "${IPM_ORGANIZATION_TELEMETER_CPUS:-0.25}"
          memory: ${IPM_ORGANIZATION_TELEMETER_MEMORY:-192M}
    networks:
      internal:
        aliases:
          - ipm-organization-telemeter.smarkee.internal
    restart: unless-stopped
    # Sem healthcheck do Compose: a imagem não tem shell nem wget/curl. A extensão `health_check` responde em 13133.
    healthcheck:
      disable: true

# Senhas montadas em /run/secrets/<VARIÁVEL> (arquivo somente leitura, lido pelo `SecretFilesSource`; decisão 0070).
# A origem em dev é o .env; cada papel recebe só a sua. Em stg e prd a origem passa a ser o cofre de segredos.
secrets:
  IPM_ORGANIZATION_RECEIVER_DATABASE_PASSWORD:
    environment: IPM_ORGANIZATION_RECEIVER_DATABASE_PASSWORD
  IPM_ORGANIZATION_RECEIVER_MESSAGING_PASSWORD:
    environment: IPM_ORGANIZATION_RECEIVER_MESSAGING_PASSWORD
  IPM_ORGANIZATION_MANAGER_DATABASE_PASSWORD:
    environment: IPM_ORGANIZATION_MANAGER_DATABASE_PASSWORD
  IPM_ORGANIZATION_MANAGER_MESSAGING_PASSWORD:
    environment: IPM_ORGANIZATION_MANAGER_MESSAGING_PASSWORD
  IPM_ORGANIZATION_PUBLISHER_DATABASE_PASSWORD:
    environment: IPM_ORGANIZATION_PUBLISHER_DATABASE_PASSWORD
  IPM_ORGANIZATION_PUBLISHER_MESSAGING_PASSWORD:
    environment: IPM_ORGANIZATION_PUBLISHER_MESSAGING_PASSWORD
  IPM_ORGANIZATION_CONTROLLER_DATABASE_PASSWORD:
    environment: IPM_ORGANIZATION_CONTROLLER_DATABASE_PASSWORD
  IPM_ORGANIZATION_CONTROLLER_MESSAGING_PASSWORD:
    environment: IPM_ORGANIZATION_CONTROLLER_MESSAGING_PASSWORD

volumes:
  # Volume da identidade (chaves das contas de serviço), criado por `infrastructure/dev/identity`.
  identity-bootstrap:
    name: identity-bootstrap
    external: true

networks:
  # Rede da plataforma, criada por `infrastructure/dev`.
  internal:
    name: internal
    external: true
