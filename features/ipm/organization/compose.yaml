name: ipm-organization

# Componentes de ipm.organization (decisões 0015 e 0019): migração, consumers, Receiver, Manager,
# Publisher, Reconciler, Observer e Executor.
# A plataforma (banco, broker, identidade e gateway) é de `infrastructure/dev` e precisa estar no ar
# e saudável antes (`docker compose up -d` e depois `docker compose up -d --wait broker database gateway identity identity-login`,
# naquele diretório): este arquivo só referencia a rede `internal` que ela cria.

# Driver de log legível pelo coletor (decisão 0045, docs/OBSERVABILITY.md §7): o padrão `local` do
# Docker não é lido pelo `file_log` do OpenTelemetry Collector. Com rotação.
x-logging: &component-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Limites de recursos dos componentes (decisão 0053): padrão calibrado com o consumo medido em dev (no máximo ~115 MiB de
# memória e ~0,02 núcleo de CPU em média por componente). Ajuste pelo ambiente.
x-deploy: &component-deploy
  resources:
    limits:
      cpus: "${IPM_ORGANIZATION_COMPONENT_CPUS:-0.5}"
      memory: ${IPM_ORGANIZATION_COMPONENT_MEMORY:-256M}

services:
  # Consumers duráveis de trabalho do tipo: o Manager (`requested`, `observed` e `result`) e o
  # Executor (`action`, um por partição) (docs/NATS.md §7.5 e §7.6). Os manifestos são do Manager (`manager/consumers/`). Inexistente é criado;
  # existente com configuração idêntica não muda; configuração diferente falha de forma explícita.
  # Exige os Streams REQUESTED, OBSERVED, RESULT e ACTION, criados pelo broker da plataforma. Os
  # consumers do Executor (um por partição) são do Executor (`executor/consumers/`).
  ipm-organization-consumer:
    build:
      context: ../../../infrastructure/tools/nats-client
    image: ${NATS_CLIENT_IMAGE:-smarkee-nats-client:dev}
    container_name: ipm-organization-consumer.smarkee.internal
    environment:
      NATS_URL: nats://broker.smarkee.internal:4222
      NATS_USER: ${NATS_USER:-smarkee}
      NATS_PASSWORD: ${IPM_ORGANIZATION_MANAGER_NATS_PASSWORD:?Defina no .env (a mesma NATS_PASSWORD de broker/.env)}
    command:
      - sh
      - -c
      - >-
        nats consumer add REQUESTED --config /consumers/ipm-organization-manager-requested.json &&
        nats consumer add OBSERVED --config /consumers/ipm-organization-manager-observed.json &&
        nats consumer add RESULT --config /consumers/ipm-organization-manager-result.json &&
        for partition in 0 1 2 3; do
          nats consumer add ACTION --config /consumers-executor/ipm-organization-executor-action-p$$partition.json || exit 1;
        done
    volumes:
      - ./manager/consumers:/consumers:ro
      - ./executor/consumers:/consumers-executor:ro
    networks:
      - internal
    restart: "no"

  # Contêiner de inicialização (equivalente ao initContainer): aplica as migrações do tipo
  # (features/ipm/organization/manager/migrations/*.sql, em ordem) como o dono `smarkee`, no banco `smarkee`.
  # O código das migrações é do projeto do Manager (decisão 0015); a execução é desta etapa de
  # implantação, com o papel administrativo, e nunca com o papel de runtime do Manager.
  # As migrações são idempotentes e rodam a cada up. Os papéis vêm de database/bootstrap/ipm.sql.
  ipm-organization-migrate:
    build:
      context: ../../../infrastructure/tools/psql-client
    image: ${POSTGRES_CLIENT_IMAGE:-smarkee-psql-client:dev}
    container_name: ipm-organization-migrate.smarkee.internal
    environment:
      PGHOST: database.smarkee.internal
      PGDATABASE: smarkee
      PGUSER: smarkee
      # Senha trivial de dev do dono do SSOT (database/bootstrap/smarkee.sql).
      PGPASSWORD: smarkee
      PGOPTIONS: -c client_min_messages=warning
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$$migration" || exit 1; done
    volumes:
      - ./manager/migrations:/migrations:ro
    networks:
      internal:
        aliases:
          - ipm-organization-migrate.smarkee.internal
    restart: "no"

  # Receiver (ipm-organization-receiver): só o gateway a alcança; a porta 8000 não é publicada no host.
  ipm-organization-receiver:
    build:
      context: ./receiver
    image: ${IPM_ORGANIZATION_RECEIVER_IMAGE:-smarkee-ipm-organization-receiver:dev}
    container_name: ipm-organization-receiver.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      # Segredos e identificadores de ambiente vêm do .env (veja .env.example); o resto usa os
      # defaults do componente (IPM_ORGANIZATION_RECEIVER_<SEÇÃO>_<CAMPO>).
      IPM_ORGANIZATION_RECEIVER_DATABASE_PASSWORD: ${IPM_ORGANIZATION_RECEIVER_DATABASE_PASSWORD:?Defina no .env}
      IPM_ORGANIZATION_RECEIVER_NATS_PASSWORD: ${IPM_ORGANIZATION_RECEIVER_NATS_PASSWORD:?Defina no .env (a mesma NATS_PASSWORD de broker/.env)}
      IPM_ORGANIZATION_RECEIVER_AUTH_AUDIENCE: ${IPM_ORGANIZATION_RECEIVER_AUTH_AUDIENCE:?Defina no .env (ID do projeto roles-ipm, org core)}
    depends_on:
      ipm-organization-migrate:
        condition: service_completed_successfully
      ipm-organization-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-receiver.smarkee.internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Manager (`ipm-organization-manager`): único escritor do SSOT do tipo.
  ipm-organization-manager:
    build:
      context: ./manager
    image: ${IPM_ORGANIZATION_MANAGER_IMAGE:-smarkee-ipm-organization-manager:dev}
    container_name: ipm-organization-manager.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      IPM_ORGANIZATION_MANAGER_DATABASE_PASSWORD: ${IPM_ORGANIZATION_MANAGER_DATABASE_PASSWORD:?Defina no .env}
      IPM_ORGANIZATION_MANAGER_NATS_PASSWORD: ${IPM_ORGANIZATION_MANAGER_NATS_PASSWORD:?Defina no .env (a mesma NATS_PASSWORD de broker/.env)}
    depends_on:
      ipm-organization-migrate:
        condition: service_completed_successfully
      ipm-organization-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-manager.smarkee.internal
    restart: unless-stopped
    healthcheck: &service-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Publisher (`ipm-organization-publisher`): publica o outbox do tipo (uma instância ativa por
  # trava consultiva).
  ipm-organization-publisher:
    build:
      context: ./publisher
    image: ${IPM_ORGANIZATION_PUBLISHER_IMAGE:-smarkee-ipm-organization-publisher:dev}
    container_name: ipm-organization-publisher.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      IPM_ORGANIZATION_PUBLISHER_DATABASE_PASSWORD: ${IPM_ORGANIZATION_PUBLISHER_DATABASE_PASSWORD:?Defina no .env}
      IPM_ORGANIZATION_PUBLISHER_NATS_PASSWORD: ${IPM_ORGANIZATION_PUBLISHER_NATS_PASSWORD:?Defina no .env (a mesma NATS_PASSWORD de broker/.env)}
    depends_on:
      ipm-organization-migrate:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-publisher.smarkee.internal
    restart: unless-stopped
    healthcheck: *service-healthcheck

  # Reconciler (`ipm-organization-reconciler`): decide a `action` a partir de `desired` e `observed`.
  # Não acessa o SSOT; cria os consumers de estado da própria instância (docs/NATS.md §7.4).
  ipm-organization-reconciler:
    build:
      context: ./reconciler
    image: ${IPM_ORGANIZATION_RECONCILER_IMAGE:-smarkee-ipm-organization-reconciler:dev}
    container_name: ipm-organization-reconciler.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      IPM_ORGANIZATION_RECONCILER_NATS_PASSWORD: ${IPM_ORGANIZATION_RECONCILER_NATS_PASSWORD:?Defina no .env (a mesma NATS_PASSWORD de broker/.env)}
    depends_on:
      ipm-organization-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-reconciler.smarkee.internal
    restart: unless-stopped
    healthcheck: *service-healthcheck

  # Observer (`ipm-organization-observer`): lê o Zitadel (conta somente leitura, IAM_OWNER_VIEWER) e
  # publica `observed`. Monta só a própria chave do volume da identidade.
  ipm-organization-observer:
    build:
      context: ./observer
    image: ${IPM_ORGANIZATION_OBSERVER_IMAGE:-smarkee-ipm-organization-observer:dev}
    container_name: ipm-organization-observer.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      IPM_ORGANIZATION_OBSERVER_NATS_PASSWORD: ${IPM_ORGANIZATION_OBSERVER_NATS_PASSWORD:?Defina no .env (a mesma NATS_PASSWORD de broker/.env)}
    volumes:
      - type: volume
        source: identity-bootstrap
        target: /run/secrets/zitadel-key.json
        read_only: true
        volume:
          subpath: service-account-ipm-organization-observer.json
    depends_on:
      ipm-organization-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-observer.smarkee.internal
    restart: unless-stopped
    healthcheck: *service-healthcheck

  # Executor (`ipm-organization-executor`): única identidade com escrita da Organization no Zitadel
  # (conta ipm-organization-executor, papel IAM_ORG_MANAGER). Monta só a própria chave.
  ipm-organization-executor:
    build:
      context: ./executor
    image: ${IPM_ORGANIZATION_EXECUTOR_IMAGE:-smarkee-ipm-organization-executor:dev}
    container_name: ipm-organization-executor.smarkee.internal
    logging: *component-logging
    deploy: *component-deploy
    environment:
      SMARKEE_ENVIRONMENT: ${SMARKEE_ENVIRONMENT:-dev}
      IPM_ORGANIZATION_EXECUTOR_NATS_PASSWORD: ${IPM_ORGANIZATION_EXECUTOR_NATS_PASSWORD:?Defina no .env (a mesma NATS_PASSWORD de broker/.env)}
    volumes:
      - type: volume
        source: identity-bootstrap
        target: /run/secrets/zitadel-key.json
        read_only: true
        volume:
          subpath: service-account-ipm-organization-executor.json
    depends_on:
      ipm-organization-consumer:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - ipm-organization-executor.smarkee.internal
    restart: unless-stopped
    healthcheck: *service-healthcheck

  # Telemeter de app de ipm.organization (decisão 0062, docs/OBSERVABILITY.md §14): recebe por OTLP, do
  # telemetry-router da plataforma, os logs e os spans de app desta feature e os grava em `telemeter/logs/` e `telemeter/traces/`. Não lê logs de
  # contêineres nem usa o socket do Docker (isso é do telemetry-agent). Sem privilégios e sem escrita fora da pasta.
  ipm-organization-telemeter:
    image: ${OTELCOL_IMAGE_VERSION:-otel/opentelemetry-collector-contrib:0.163.1}
    container_name: ipm-organization-telemeter.smarkee.internal
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./telemeter/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Saída do exporter file. A imagem não tem sistema de arquivos gravável: a pasta precisa existir no host e ser
      # gravável pelo usuário 10001 (no Linux, `chmod o+rwx telemeter/logs telemeter/traces`; no Docker Desktop já é).
      - ./telemeter/logs:/telemetry/logs
      - ./telemeter/traces:/telemetry/traces
    # O log do próprio coletor é de infra (o telemetry-agent o coleta pelas labels, só WARN ou acima).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: com.docker.compose.service,smarkee.layer
    labels:
      smarkee.layer: infra
    deploy:
      resources:
        limits:
          cpus: "${IPM_ORGANIZATION_TELEMETER_CPUS:-0.25}"
          memory: ${IPM_ORGANIZATION_TELEMETER_MEMORY:-192M}
    networks:
      internal:
        aliases:
          - ipm-organization-telemeter.smarkee.internal
    restart: unless-stopped
    # Sem healthcheck do Compose: a imagem não tem shell nem wget/curl. A extensão `health_check` responde em 13133.
    healthcheck:
      disable: true

volumes:
  # Volume da identidade (chaves das contas de serviço), criado por `infrastructure/dev/identity`.
  identity-bootstrap:
    name: identity-bootstrap
    external: true

networks:
  # Rede da plataforma, criada por `infrastructure/dev`.
  internal:
    name: internal
    external: true
