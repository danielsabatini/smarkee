# Configuração de dev de ipm.organization (decisão 0067). Sem segredos: eles vêm do ambiente ou de /run/secrets.
# Tabela por papel: [tool.ipm.organization.<papel>.<seção>]. Precedência: CLI > ambiente > este arquivo > segredos > default.

[tool.ipm.organization.api.auth]
host_header = "ipm-dev.smarkee.com.br:8080"
issuer = "http://ipm-dev.smarkee.com.br:8080"
jwks_url = "http://gateway.smarkee.internal:8000/oauth/v2/keys"
userinfo_url = "http://gateway.smarkee.internal:8000/oidc/v1/userinfo"

[tool.ipm.organization.api.database]
host = "database.smarkee.internal"
name = "ssot"
port = 5432
user = "ipm_organization_api_login"

[tool.ipm.organization.api.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

[tool.ipm.organization.api.peers]
billing_accounts_url = "http://bsm-account-receiver.smarkee.internal:8000"

[tool.ipm.organization.publisher.database]
host = "database.smarkee.internal"
name = "ssot"
port = 5432
user = "ipm_organization_publisher_login"

[tool.ipm.organization.publisher.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

[tool.ipm.organization.controller.database]
host = "database.smarkee.internal"
name = "ssot"
port = 5432
user = "ipm_organization_controller_login"

[tool.ipm.organization.controller.identity]
base_url = "http://identity.smarkee.internal:8080"
host_header = "ipm-dev.smarkee.com.br:8080"
issuer = "http://ipm-dev.smarkee.com.br:8080"

[tool.ipm.organization.controller.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"
