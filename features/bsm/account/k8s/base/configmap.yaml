apiVersion: v1
kind: ConfigMap
metadata:
  name: bsm-account-config
  namespace: bsm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: bsm-account
data:
  config.toml: |
    # Configuração de dev de bsm.account (decisão 0067). Sem segredos: eles vêm do ambiente ou de /run/secrets.
    # Tabela por papel: [tool.bsm.account.<papel>.<seção>]. Precedência: CLI > ambiente > este arquivo > segredos > default.

    [tool.bsm.account.api.auth]
    host_header = "ipm-dev.smarkee.com.br:8080"
    issuer = "http://ipm-dev.smarkee.com.br:8080"
    jwks_url = "http://gateway.gateway.svc.cluster.local:8000/oauth/v2/keys"
    userinfo_url = "http://gateway.gateway.svc.cluster.local:8000/oidc/v1/userinfo"

    [tool.bsm.account.api.database]
    host = "database-rw.database.svc.cluster.local"
    name = "ssot"
    port = 5432
    user = "bsm_account_api_login"

    [tool.bsm.account.api.messaging]
    url = "nats://messaging.messaging.svc.cluster.local:4222"
    user = "smarkee"

    [tool.bsm.account.publisher.database]
    host = "database-rw.database.svc.cluster.local"
    name = "ssot"
    port = 5432
    user = "bsm_account_publisher_login"

    [tool.bsm.account.publisher.messaging]
    url = "nats://messaging.messaging.svc.cluster.local:4222"
    user = "smarkee"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bsm-account-migrations
  namespace: bsm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: bsm-account
data:
  0001-account.sql: |
    -- Migração 0001 de bsm.account: Billing Account no SSOT (docs/data/POSTGRESQL.md §6 e §14.2).
    -- Projeto: bsm-account-manager (decisão 0015), dono do esquema do tipo.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`; serviços de runtime não
    -- executam DDL. Os papéis de função são criados por infrastructure/dev/database/bootstrap/bsm.sql.
    -- Nasce com o estado atual das migrações do modelo (ipm/organization 0001 a 0004): o motivo de
    -- rejeição `protected` (decisão 0043), o `traceparent` do outbox (decisão 0055) e a
    -- `observed_generation` (decisão 0072).
    -- Idempotente: pode ser reaplicada sem erro.

    CREATE SCHEMA IF NOT EXISTS bsm;

    CREATE TABLE IF NOT EXISTS bsm.account (
      resource_id        text        PRIMARY KEY
                         CHECK (resource_id ~ '^[a-z0-9]([a-z0-9-]{0,126}[a-z0-9])?$'),
      schema_version     text        NOT NULL CHECK (schema_version ~ '^[0-9]+\.[0-9]+$'),
      lifecycle          text        NOT NULL CHECK (lifecycle IN ('present', 'absent')),
      reconciliation     text        NOT NULL DEFAULT 'active' CHECK (reconciliation IN ('active', 'suspended')),
      desired            jsonb       NOT NULL
                         CHECK (jsonb_typeof(desired) = 'object' AND pg_column_size(desired) <= 262144),
      desired_generation bigint      NOT NULL CHECK (desired_generation >= 1),
      resource_version   bigint      NOT NULL DEFAULT 1,
      observed           jsonb
                         CHECK (observed IS NULL OR (jsonb_typeof(observed) = 'object' AND pg_column_size(observed) <= 262144)),
      presence           text        CHECK (presence IN ('present', 'absent', 'unknown')),
      observed_at        timestamptz,
      phase              text        NOT NULL CHECK (phase IN ('Pending', 'Reconciling', 'Ready', 'Failed', 'Deleting')),
      conditions         jsonb       NOT NULL DEFAULT '[]'::jsonb CHECK (jsonb_typeof(conditions) = 'array'),
      failure_count      integer     NOT NULL DEFAULT 0 CHECK (failure_count >= 0),
      -- Última geração confirmada por uma observação feita depois dela, como o
      -- `status.observedGeneration` do Kubernetes (decisão 0072).
      observed_generation bigint,
      created_at         timestamptz NOT NULL DEFAULT now(),
      updated_at         timestamptz NOT NULL DEFAULT now(),
      CHECK ((presence IS NULL) = (observed_at IS NULL)),
      CONSTRAINT account_observed_generation_check
        CHECK (observed_generation IS NULL
               OR (observed_generation >= 1 AND observed_generation <= desired_generation))
    );

    CREATE TABLE IF NOT EXISTS bsm.account_operation (
      operation_id            text        PRIMARY KEY CHECK (length(operation_id) BETWEEN 1 AND 128),
      resource_id             text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      operation_type          text        NOT NULL CHECK (operation_type IN ('create', 'update', 'delete')),
      desired_generation      bigint      CHECK (desired_generation >= 1),
      requested_by            text        NOT NULL CHECK (length(requested_by) BETWEEN 1 AND 256),
      correlation_id          text        NOT NULL CHECK (length(correlation_id) BETWEEN 1 AND 256),
      request_digest          text        NOT NULL CHECK (request_digest ~ '^[0-9a-f]{64}$'),
      operation_status        text        NOT NULL
                              CHECK (operation_status IN ('accepted', 'in_progress', 'completed', 'failed', 'rejected')),
      operation_status_reason text        CHECK (operation_status_reason IN ('conflict', 'validation', 'not_found', 'protected')),
      created_at              timestamptz NOT NULL DEFAULT now(),
      updated_at              timestamptz NOT NULL DEFAULT now(),
      completed_at            timestamptz,
      CHECK ((operation_status = 'rejected') = (operation_status_reason IS NOT NULL)),
      CHECK ((operation_status = 'rejected') = (desired_generation IS NULL))
    );
    CREATE INDEX IF NOT EXISTS account_operation_resource
      ON bsm.account_operation (resource_id, created_at);
    CREATE INDEX IF NOT EXISTS account_operation_retention
      ON bsm.account_operation (updated_at)
      WHERE operation_status IN ('completed', 'failed', 'rejected');

    CREATE TABLE IF NOT EXISTS bsm.account_action_result (
      action_id          text        PRIMARY KEY CHECK (length(action_id) BETWEEN 1 AND 512),
      resource_id        text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      desired_generation bigint      NOT NULL CHECK (desired_generation >= 1),
      action_outcome     text        NOT NULL CHECK (action_outcome IN ('completed', 'failed')),
      recorded_at        timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS account_action_result_recorded
      ON bsm.account_action_result (recorded_at);

    CREATE TABLE IF NOT EXISTS bsm.account_outbox (
      sequence     bigint      GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      message_id   text        NOT NULL UNIQUE CHECK (length(message_id) BETWEEN 1 AND 128),
      resource_id  text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      subject      text        NOT NULL CHECK (length(subject) BETWEEN 1 AND 512),
      payload      jsonb       NOT NULL CHECK (pg_column_size(payload) <= 262144),
      -- `traceparent` W3C da origem da linha, repassado pelo Publisher como header (decisão 0055).
      traceparent  text        CHECK (traceparent ~ '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'),
      created_at   timestamptz NOT NULL DEFAULT now(),
      published_at timestamptz
    );
    CREATE INDEX IF NOT EXISTS account_outbox_pending
      ON bsm.account_outbox (sequence) WHERE published_at IS NULL;
    CREATE INDEX IF NOT EXISTS account_outbox_published
      ON bsm.account_outbox (published_at) WHERE published_at IS NOT NULL;

    -- Índices de busca do Manager e do Receiver: dono (listagem por dono) e unicidade de `displayName`
    -- por dono entre contas ativas (`lifecycle = 'present'`), conferidos na unidade atômica do pedido
    -- (docs/data/SSOT.md §10.1).
    CREATE INDEX IF NOT EXISTS account_owner
      ON bsm.account ((desired ->> 'ownerAccountId'));
    CREATE INDEX IF NOT EXISTS account_owner_display_name
      ON bsm.account ((desired ->> 'ownerAccountId'), (desired ->> 'displayName'))
      WHERE lifecycle = 'present';

    -- Interface de leitura versionada do Receiver (decisão 0004): sem failure_count. `requested_by` aparece
    -- só na view da Operation, para o Receiver autorizar a leitura (docs/data/POSTGRESQL.md §6.5).
    CREATE OR REPLACE VIEW bsm.account_v1 AS
      SELECT resource_id, schema_version, lifecycle, reconciliation, desired, desired_generation,
             resource_version, observed, presence, observed_at, phase, conditions, created_at, updated_at,
             observed_generation
        FROM bsm.account;

    CREATE OR REPLACE VIEW bsm.account_operation_v1 AS
      SELECT operation_id, resource_id, operation_type, desired_generation, request_digest,
             operation_status, operation_status_reason, created_at, updated_at, completed_at,
             requested_by
        FROM bsm.account_operation;

    -- Privilégios (docs/data/POSTGRESQL.md §14.2).
    GRANT CONNECT ON DATABASE ssot
      TO bsm_account_publisher, bsm_maintenance;

    REVOKE ALL ON SCHEMA bsm FROM PUBLIC;
    REVOKE ALL ON ALL TABLES IN SCHEMA bsm FROM PUBLIC;
    GRANT USAGE ON SCHEMA bsm
      TO bsm_account_publisher, bsm_maintenance;



    GRANT SELECT ON bsm.account_outbox TO bsm_account_publisher;
    GRANT UPDATE (published_at) ON bsm.account_outbox TO bsm_account_publisher;

    GRANT SELECT, DELETE
      ON bsm.account_outbox, bsm.account_action_result, bsm.account_operation
      TO bsm_maintenance;
  0002-account-operation-superseded.sql: |
    -- Migração de bsm.account: novo estado de Operation `superseded` (decisão 0091).
    -- Aditiva: a Operation de uma geração substituída por outra antes de convergir deixa de ser `failed`.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`. Idempotente.

    ALTER TABLE bsm.account_operation
      DROP CONSTRAINT IF EXISTS account_operation_operation_status_check;
    ALTER TABLE bsm.account_operation
      ADD CONSTRAINT account_operation_operation_status_check
      CHECK (operation_status IN ('accepted', 'in_progress', 'completed', 'failed', 'rejected', 'superseded'));

    DROP INDEX IF EXISTS bsm.account_operation_retention;
    CREATE INDEX account_operation_retention
      ON bsm.account_operation (updated_at)
      WHERE operation_status IN ('completed', 'failed', 'rejected', 'superseded');
  0003-account-api.sql: |
    -- bsm.account: API síncrona (decisão 0098) e fim dos papéis assíncronos do loop antigo (S6.1).
    -- A admissão passa a ser feita na requisição pelo papel `bsm_account_api`, que substitui
    -- `..._manager` e `..._receiver`. Fim da Operation (tabela, view e privilégios) e do resultado de
    -- ação (o tipo não tem Executor externo); a causa da geração (`requested_by` e `correlation_id`) passa a
    -- ser do próprio recurso; a idempotência do cliente ganha tabela própria.
    -- Executada pela infraestrutura como o dono `ssot`, no banco `ssot`, depois de `bsm.sql` (que cria o
    -- papel `bsm_account_api`). Idempotente: pode ser reaplicada sem erro.

    ALTER TABLE bsm.account
      ADD COLUMN IF NOT EXISTS requested_by   text CHECK (length(requested_by) BETWEEN 1 AND 256),
      ADD COLUMN IF NOT EXISTS correlation_id text CHECK (length(correlation_id) BETWEEN 1 AND 256);

    -- Recursos anteriores guardam a causa na última Operation da geração vigente.
    DO $$
    BEGIN
      IF to_regclass('bsm.account_operation') IS NOT NULL THEN
        UPDATE bsm.account AS resource
           SET requested_by = operation.requested_by, correlation_id = operation.correlation_id
          FROM (SELECT DISTINCT ON (resource_id) resource_id, requested_by, correlation_id
                  FROM bsm.account_operation
                 ORDER BY resource_id, created_at DESC) AS operation
         WHERE operation.resource_id = resource.resource_id AND resource.requested_by IS NULL;
      END IF;
    END
    $$;

    -- A Billing Account é gerida no SSOT: sem Observer/Executor externo, toda conta existente já está convergida. As linhas
    -- anteriores passam a `Ready` com `observed_generation = generation`.
    UPDATE bsm.account
       SET phase = 'Ready', observed_generation = desired_generation
     WHERE phase <> 'Ready' OR observed_generation IS DISTINCT FROM desired_generation;

    -- Idempotência (`Idempotency-Key`): gravada na transação da admissão, só quando a escrita é aplicada.
    CREATE TABLE IF NOT EXISTS bsm.account_idempotency (
      requested_by    text        NOT NULL CHECK (length(requested_by) BETWEEN 1 AND 256),
      idempotency_key text        NOT NULL CHECK (idempotency_key ~ '^[A-Za-z0-9._:-]{1,128}$'),
      request_digest  text        NOT NULL CHECK (request_digest ~ '^[0-9a-f]{64}$'),
      resource_id     text        NOT NULL CHECK (length(resource_id) BETWEEN 1 AND 128),
      created_at      timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (requested_by, idempotency_key)
    );
    CREATE INDEX IF NOT EXISTS account_idempotency_retention
      ON bsm.account_idempotency (created_at);

    -- A view ganha `observed_generation` (no fim, como exige CREATE OR REPLACE VIEW).
    CREATE OR REPLACE VIEW bsm.account_v1 AS
      SELECT resource_id, schema_version, lifecycle, reconciliation, desired, desired_generation,
             resource_version, observed, presence, observed_at, phase, conditions, created_at, updated_at,
             observed_generation
        FROM bsm.account;

    DROP VIEW IF EXISTS bsm.account_operation_v1;
    DROP TABLE IF EXISTS bsm.account_operation;
    DROP TABLE IF EXISTS bsm.account_action_result;

    -- Privilégios: o `api` lê (view), escreve o recurso (com DELETE: a exclusão remove a linha e o
    -- tombstone vai no outbox), o outbox e a idempotência. Os papéis antigos perdem tudo do tipo.
    GRANT CONNECT ON DATABASE ssot TO bsm_account_api;
    GRANT USAGE ON SCHEMA bsm TO bsm_account_api;

    GRANT SELECT, INSERT, UPDATE, DELETE ON bsm.account             TO bsm_account_api;
    GRANT SELECT                         ON bsm.account_v1          TO bsm_account_api;
    GRANT INSERT                         ON bsm.account_outbox      TO bsm_account_api;
    GRANT SELECT, INSERT                 ON bsm.account_idempotency TO bsm_account_api;

    GRANT SELECT, DELETE ON bsm.account_idempotency TO bsm_maintenance;

    DO $$
    BEGIN
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'bsm_account_manager') THEN
        REVOKE ALL ON bsm.account, bsm.account_v1, bsm.account_outbox FROM bsm_account_manager;
        REVOKE ALL ON SCHEMA bsm FROM bsm_account_manager;
        REVOKE CONNECT ON DATABASE ssot FROM bsm_account_manager;
      END IF;
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'bsm_account_receiver') THEN
        REVOKE ALL ON bsm.account_v1 FROM bsm_account_receiver;
        REVOKE ALL ON SCHEMA bsm FROM bsm_account_receiver;
        REVOKE CONNECT ON DATABASE ssot FROM bsm_account_receiver;
      END IF;
    END
    $$;
