    app.kubernetes.io/part-of: bsm-account
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: bsm-account-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: BSM_ACCOUNT_API_DATABASE_PASSWORD
      remoteRef:
        key: bsm/account
        property: api_database_password
    - secretKey: BSM_ACCOUNT_API_MESSAGING_PASSWORD
      remoteRef:
        key: bsm/account
        property: api_messaging_password
