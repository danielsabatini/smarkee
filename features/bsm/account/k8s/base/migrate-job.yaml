apiVersion: batch/v1
kind: Job
metadata:
  name: bsm-account-migrate
  namespace: bsm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  labels:
    app.kubernetes.io/name: bsm-account-migrate
    app.kubernetes.io/part-of: bsm-account
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bsm-account-migrate
        app.kubernetes.io/part-of: bsm-account
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: localhost:5001/smarkee-psql-client:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1; done'
          env:
            - name: PGHOST
              value: database-rw.database.svc.cluster.local
            - name: PGDATABASE
              value: ssot
            - name: PGUSER
              value: ssot
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bsm-account-migrate-secrets
                  key: PGPASSWORD
            - name: PGOPTIONS
              value: "-c client_min_messages=warning"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: bsm-account-migrations
