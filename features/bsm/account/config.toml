# Configuração de dev de bsm.account (decisão 0067). Sem segredos: eles vêm do ambiente ou de /run/secrets.
# Tabela por papel: [tool.bsm.account.<papel>.<seção>]. Precedência: CLI > ambiente > este arquivo > segredos > default.

[tool.bsm.account.api.auth]
host_header = "ipm-dev.smarkee.com.br:8080"
issuer = "http://ipm-dev.smarkee.com.br:8080"
jwks_url = "http://gateway.smarkee.internal:8000/oauth/v2/keys"
userinfo_url = "http://gateway.smarkee.internal:8000/oidc/v1/userinfo"

[tool.bsm.account.api.database]
host = "database.smarkee.internal"
name = "ssot"
port = 5432
user = "bsm_account_api_login"

[tool.bsm.account.api.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"

[tool.bsm.account.publisher.database]
host = "database.smarkee.internal"
name = "ssot"
port = 5432
user = "bsm_account_publisher_login"

[tool.bsm.account.publisher.messaging]
url = "nats://messaging.smarkee.internal:4222"
user = "smarkee"
