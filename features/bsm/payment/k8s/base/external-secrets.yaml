apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bsm-payment-migrate-secrets
  namespace: bsm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: bsm-payment
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: smarkee-core-svm
    kind: ClusterSecretStore
  target:
    name: bsm-payment-migrate-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: database/admin
        property: ssot_password
---
